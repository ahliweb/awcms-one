version: 2

updates:
  # Root workflow actions (.github/workflows/*.yml). AGENTS.md's "Configuration
  # and toolchain" says every action is pinned to a commit SHA with a
  # `# vX.Y.Z` comment "Dependabot reads to keep both in step" — this is the
  # config that makes that sentence true (issue #180).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
        # A major version bump (actions/checkout@v3 -> v4) is never grouped:
        # it can change an action's behaviour, so it gets its own PR and its
        # own review rather than riding along with a routine patch bump.
    commit-message:
      prefix: "ci(deps)"
      include: "scope"

  # No `bun` ecosystem block (issue #199, follow-up to #180/#179). The first
  # scheduled run against it failed outright — run 35858077848:
  #   "Unsupported bun.lock 'lockfileVersion' 2 in /bun.lock. The bun version
  #   Dependabot runs supports up to 1."
  # `bun.lock` at this repo's root is lockfileVersion 2 (Bun 1.4 writes v2;
  # downgrading the lockfile format to keep the block working was rejected —
  # it would fight the pinned Bun version instead of the other way around).
  # A monthly job that always fails is noise that hides a real failure, so
  # the block is removed rather than left red. Until Dependabot's `bun`
  # ecosystem supports lockfileVersion 2, this repo's own workspace
  # dependencies (root package.json, apps/storefront, packages/*) are bumped
  # by hand: `bun update`, then `bun run check:lockfile` — see AGENTS.md's
  # "Configuration and toolchain" and docs/alur-kerja-pengembangan.md's
  # "Dependency updates". Re-enable by restoring a bun ecosystem update
  # block (git history has the exact shape this repo used, prior to the
  # commit that closed issue #199) once Dependabot's changelog says v2 is
  # supported, then update `tests/dependabot-config.test.mjs` back to
  # requiring the block.
