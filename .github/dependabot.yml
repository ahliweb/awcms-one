version: 2

updates:
  # Root workflow actions (.github/workflows/*.yml). AGENTS.md's "Configuration
  # and toolchain" says every action is pinned to a commit SHA with a
  # `# vX.Y.Z` comment "Dependabot reads to keep both in step" — this is the
  # config that makes that sentence true (issue #180).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
        # A major version bump (actions/checkout@v3 -> v4) is never grouped:
        # it can change an action's behaviour, so it gets its own PR and its
        # own review rather than riding along with a routine patch bump.
    commit-message:
      prefix: "ci(deps)"
      include: "scope"

  # This repo's own workspaces (root package.json plus apps/storefront and
  # packages/*) — deliberately NOT apps/cms. apps/cms is ahliweb/awcms
  # embedded via git subtree (AGENTS.md's "The subtree embed"): upstream owns
  # its own dependency set and its own dependabot.yml
  # (apps/cms/.github/dependabot.yml, inert here because GitHub only reads
  # the config at the repository root); a version-update PR opened against
  # apps/cms/package.json from THIS repo would edit code a future
  # `git subtree pull` can silently overwrite or conflict with. `exclude-paths`
  # is a per-ecosystem-block option (GitHub, Aug 2025) and applies to the
  # `bun` ecosystem the same as any other, so one root-directory `bun` entry
  # with apps/cms excluded covers the workspace without a second entry.
  - package-ecosystem: "bun"
    directory: "/"
    exclude-paths:
      - "apps/cms/**"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      workspace-minor-patch:
        update-types:
          - "minor"
          - "patch"
        # Same split as github-actions above: a major bump gets its own PR.
    ignore:
      # Bun itself is pinned in three places that must move together
      # (packageManager/engines.bun here, bun-version in every ci.yml job) —
      # AGENTS.md's "Configuration and toolchain". A version-update PR that
      # bumped only one of the three would make the pin a lie between the
      # PR's merge and whoever notices; raising it is a deliberate, all-three
      # change a maintainer makes by hand, not something Dependabot opens.
      - dependency-name: "bun"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
