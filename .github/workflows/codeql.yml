name: CodeQL

# Issue #184 (part of epic #179) — CodeQL code scanning for this workspace's
# own JavaScript/TypeScript, alongside the secret scanning + push protection
# and Dependabot security updates already enabled on this repository (see
# SECURITY.md's "Automated scanning in force"). Findings appear on this
# repository's own Security -> Code scanning tab, never merged with
# ahliweb/awcms's own separate scan of the same apps/cms/ tree.
#
# apps/cms/** SOURCE stays IN SCOPE below (no paths-ignore entry in
# .github/codeql/codeql-config.yml excludes it) — it is the code that
# actually runs in this deployment, even though that tree is upstream
# ahliweb/awcms embedded via git subtree (AGENTS.md's "The subtree embed").
# Only apps/cms's own GENERATED/vendored output is excluded, on the same
# terms as this repo's own equivalent output — see that config file's own
# comments. A finding under apps/cms/** is triaged per SECURITY.md: fixed
# here only if it is one of AGENTS.md's documented local divergences or
# this repo's own `commerce` module, otherwise reported/fixed upstream
# (apps/cms/.github/workflows/codeql.yml runs the same scan there — inert
# in THIS repository, same as every other workflow file under
# apps/cms/.github/workflows/, since GitHub only reads workflow files under
# the checked-out repo's own top-level .github/workflows/) and pulled in
# through the normal subtree sync.
#
# Scope is javascript-typescript only, matching this issue's own title.
# Upstream's own workflow additionally runs an `actions` language leg over
# workflow YAML; that is out of scope for #184 and can be added later if
# this repo wants the same coverage.
#
# Query suite: `security-extended` (not upstream's
# `security-extended,security-and-quality`) — kept deliberately narrower
# than upstream even now that this check is required (issue #214):
# `security-and-quality` adds pure code-quality/maintainability queries
# that are not security findings at all, which would dilute the signal
# this repository's own CodeQL triage playbook (SECURITY.md's "CodeQL
# triage" section, issue #206) is built around. Widening the suite is a
# separate signal/risk decision, explicitly out of scope for #214.
#
# REQUIRED status check since issue #214 (promoted after a real triage
# process — SECURITY.md's "CodeQL triage" — and a verified green run
# history with no observed workflow failure, the same bar
# Check (toko|berita|landing), check-cms, template-init-smoke's four legs
# (issue #182), and e2e's three legs (issue #215) were each held to
# before their own promotion). The context actually named in branch
# protection is this job's own name, `Analyze (javascript-typescript)`
# (app: GitHub Actions) — NOT the sibling `CodeQL` check GitHub's code
# scanning app posts once a SARIF upload succeeds (app: GitHub Advanced
# Security). The job-status check is the one that fails closed when the
# analysis itself fails (a broken step, a timeout, an extraction error);
# the code-scanning-results check only exists once a SARIF has already
# been produced, so it cannot represent an analyzer failure at all. See
# docs/alur-kerja-pengembangan.md's "CI: a fifth, now-required workflow —
# `codeql`" for the full reasoning and how to read a run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, off-peak UTC — catches a query-pack update or a newly
    # published pattern between pushes even on a quiet week. The exact
    # day/time has no significance beyond not colliding with another
    # scheduled job this repo runs.
    - cron: "30 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Actions are pinned to a commit SHA, not a tag (AGENTS.md's "Configuration
# and toolchain"). `actions/checkout` reuses ci.yml's exact pin; the
# codeql-action pin was resolved from its latest release tag at the time
# this workflow was written (v4.38.1, github.com/github/codeql-action) —
# newer than the v4 pin apps/cms's own workflow carries (cdf488f, dated
# 2026-08-26; this pin is dated 2026-09-18).
# ---------------------------------------------------------------------------
jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Least-required permissions, spelled out here rather than left as an
    # inherited default: this is the only job in this workflow, and the
    # only one anywhere in this repo, that needs `security-events: write`
    # (to upload SARIF results). `actions: read` is only load-bearing on a
    # private repository (it lets CodeQL look up the workflow run that
    # triggered it); harmless read-only scope to keep on a public one too.
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `build-mode: none` — CodeQL's no-build source extraction, so this
      # stays Bun-only: no `astro build`, no live apps/cms, no application
      # code ever runs. It does NOT cover `.astro`: CodeQL ships no Astro
      # extractor, so every `.astro` file under apps/storefront/src or
      # apps/cms/src is outside this scan regardless of paths-ignore — the
      # same limit apps/cms's own workflow states for its own tree.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
