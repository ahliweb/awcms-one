name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a stale run when a new push lands on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Actions are pinned to a commit SHA, not a tag (see AGENTS.md's
# "Configuration and toolchain"). A tag can be moved; a SHA cannot, and an
# action runs with access to the workflow token and the whole checkout.
#
# The `# vX.Y.Z` comment behind each SHA is not decoration: Dependabot reads
# it to raise the pin and its comment together, so this stays readable by a
# human without becoming unreadable to the tool that maintains it.
# ---------------------------------------------------------------------------

jobs:
  # ---------------------------------------------------------------------------
  # The storefront + root gate. Everything in it runs unconditionally —
  # none of it needs a network beyond fetching dependencies, or apps/cms's
  # own database (the build-smoke tests bring their own stub CMS).
  #
  # Issue #137 (ADR-0018 D7): a 3-leg matrix over the storefront's build
  # profile. Every leg type-checks the storefront under its `SITE_PROFILE`
  # and builds THAT profile against the stub CMS (`profil-build-smoke` +
  # `profil-routes`, which prove the excluded page groups are absent from
  # that leg's `dist/` and `sitemap-*.xml`). The root suite and the
  # repo-wide audits do not depend on the profile, so they run once, on the
  # `toko` leg — the default profile, whose build every pre-#137 smoke test
  # already asserts (each of those pins `SITE_PROFILE: "toko"` itself).
  # `bun install` is cached (`~/.bun/install/cache`, keyed on `bun.lock`)
  # and the legs run in parallel, so the matrix adds two short builds, not
  # three times the job's wall-clock. `fail-fast: false`: a `landing`
  # regression must not hide a `berita` one.
  #
  # The job stays named `Check` / `check`: `AGENTS.md` records it as the
  # required status check on `main`, and the matrix is additive to that job,
  # not a new check to separately mark required.
  # ---------------------------------------------------------------------------
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        profile: [toko, berita, landing]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bun's version here must equal packageManager/engines.bun in the root
      # package.json — see AGENTS.md's "Configuration and toolchain" for why
      # that pin is load-bearing rather than cosmetic.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Cache Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Before install, not after: this gate is a pure file read, so its
      # failure reads as "the lockfile has drifted" — not as an unrelated
      # install failure whose cause has to be guessed. `bun install
      # --frozen-lockfile` below is the second layer: it refuses a bun.lock
      # that does not satisfy package.json at all.
      - name: Lockfile matches package.json
        run: bun run check:lockfile

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `astro check` over the whole storefront under this leg's profile —
      # `src/profil/**` is type-checked whether or not its group is in the
      # build, so a type error in an excluded group still fails every leg.
      - name: Type check (SITE_PROFILE=${{ matrix.profile }})
        env:
          SITE_PROFILE: ${{ matrix.profile }}
        run: bun run check

      # This leg's own storefront build against the stub CMS, plus the
      # assertions that make the profile real: excluded groups absent from
      # `dist/` and `sitemap-*.xml`, robots/feeds/CSP matching
      # `src/config/profil.ts`, and no built page linking outside the
      # profile. `SITE_PROFILE` is set on THIS step only — the root suite
      # below must run with the default profile.
      - name: Profile build smoke (SITE_PROFILE=${{ matrix.profile }})
        env:
          SITE_PROFILE: ${{ matrix.profile }}
        run: |
          cd apps/storefront
          bun test tests/profil-build-smoke.test.ts tests/profil-routes.test.ts

      # The root gate suite — once, on the default-profile leg. bunfig.toml's
      # [test] pathIgnorePatterns excludes apps/cms/** — that suite is ~500
      # files and needs a live PostgreSQL; it runs under its own gate
      # (`bun run check:cms`), not this one. This step calling `bun test`
      # BARE (not `bun run test`) matters: a flag on the package.json script
      # would be silently skipped by a bare invocation, and CI always
      # invokes it bare — see `tests/cakupan-uji-akar.test.mjs`, which
      # guards this exact point. With no `SITE_PROFILE` in this step's
      # environment the suite's own `profil-build-smoke` builds all three
      # profiles, so the toko leg alone also proves the whole matrix.
      - name: Unit tests
        if: matrix.profile == 'toko'
        run: bun test

      # Dead markdown links, the ADR index (self-skips until docs/adr/
      # exists), file paths a document names, ADR-NNNN citations, and marked
      # linked counts. Needs no build, no network, no apps/cms.
      - name: Audit dokumen
        if: matrix.profile == 'toko'
        run: bun run audit:dokumen

      # A stale or missing Indonesian mirror of a governance document.
      - name: Audit translation
        if: matrix.profile == 'toko'
        run: bun run audit:translation

      # The root knowledge-graph corpus (graphify-out/) describing itself
      # honestly — issue #11. Reads only artefacts already committed (plus
      # `git ls-files`), so it runs here like the other audit:* gates. What
      # it deliberately does NOT do: `graphify` itself is a local Python tool
      # this runner does not have installed, so `bun run knowledge:graph:*` /
      # `knowledge:obsidian:*` (which shell out to it) are NOT run in CI —
      # only the read-only, already-committed-artefact check is. See
      # knowledge/README.md's "Toolchain" table for which commands need
      # `graphify` locally and which do not.
      - name: Audit graf
        if: matrix.profile == 'toko'
        run: bun run audit:graf

      # The waiting .changesets/ backlog crossing its bound. This can go red
      # on a push that did nothing wrong — see that gate's own docblock for
      # why that is accepted: main carries no required checks yet, so a red
      # run here informs without blocking anyone's merge, and it is cleared
      # by a maintainer running one release.
      - name: Audit rilis
        if: matrix.profile == 'toko'
        run: bun run audit:rilis

      # `bun audit` (dependency-chain vulnerabilities) and this repo's own
      # `audit:*` gates check unrelated things; their names are kept
      # distinct on purpose. This scans the WHOLE resolved lockfile,
      # apps/cms's dependencies included — a finding here may belong to
      # that embedded tree rather than to this workspace's own new code.
      - name: Dependency audit
        if: matrix.profile == 'toko'
        run: bun audit --audit-level=low

  # ---------------------------------------------------------------------------
  # check-cms (issue #25) — apps/cms's own full gate chain
  # (`bun run check` — lint, docs, inventories, spec, gates, typecheck,
  # tests, build), plus its DB-gated integration suite, against a real
  # `postgres:18.4` service. Modeled directly on apps/cms's OWN CI
  # (apps/cms/.github/workflows/ci.yml)'s `quality` + `integration-tests`
  # jobs — that workflow file is otherwise dead weight in THIS repo, since
  # GitHub only ever reads workflow files under the CHECKED-OUT repo's own
  # top-level `.github/workflows/`, and every checkout of this workflow is
  # awcms-one's, never a standalone checkout of `apps/cms`'s own history.
  #
  # `needs: check` — no reason to spin up a database for a tree the cheap
  # gates above have not already confirmed installs, lints, and tests
  # cleanly at the root.
  # ---------------------------------------------------------------------------
  check-cms:
    name: check-cms
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: awcms
          POSTGRES_PASSWORD: awcms_ci_password
          POSTGRES_DB: awcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U awcms -d awcms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `bun run check` (below) loads apps/cms's `version:check`, which
          # reads `git tag --list 'v*'`. Its own non-vacuity floor already
          # skips itself inside the subtree embed regardless of how many tags
          # are fetched (fix/22, `apps/cms/tests/version-check.test.ts`), so
          # this is not load-bearing for correctness the way it is in
          # apps/cms's own standalone CI — kept anyway, matching that
          # workflow's own checkout, so the two assertions that DO state a
          # rule have this repo's real `v0.x` tags to check against instead
          # of none.
          fetch-tags: true

      # The ROOT pin (package.json's `packageManager`/`engines.bun`), NOT
      # apps/cms's own `1.4.2` — AGENTS.md's "Configuration and toolchain"
      # records that divergence as a known, accepted leftover from when
      # apps/cms was its own standalone repository; it does not govern what
      # this workspace installs with.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Cache Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      # Once, at the root — apps/cms is a workspace member (AGENTS.md: "bun
      # install runs once, at the root, for the whole workspace"), not a
      # second install.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Mirrors apps/cms's own `quality` job exactly: `DATABASE_URL` is
      # EMPTY for this step only, so the bare `bun test` inside `check` skips
      # every DB-gated suite cleanly (`tests/integration/harness.ts`'s
      # `integrationEnabled`) instead of failing against a database this step
      # has not migrated yet. Real DB/RLS coverage is the step below,
      # deliberately separate — apps/cms's own `integration-tests` job
      # documents WHY DB-gated suites cannot share one `bun test` process
      # with this one: a bare `bun test` running both concurrently against a
      # shared database reproduced 26 failures (data collisions/ordering).
      #
      # Output is duplicated to a log file (`tee`) so the next step can read
      # its own before/after skip count into the job summary without
      # re-running the whole gate chain a second time just to see the number.
      - name: apps/cms full quality gate (DATABASE_URL empty — DB-gated suites skip)
        run: |
          cd apps/cms
          DATABASE_URL="" bun run check 2>&1 | tee /tmp/check-cms-quality.log

      - name: Assemble DATABASE_URL for this job's Postgres
        run: echo "DATABASE_URL=postgres://awcms:awcms_ci_password@127.0.0.1:5432/awcms" >> "$GITHUB_ENV"

      - name: Migrate apps/cms against this job's Postgres
        run: bun run db:migrate:cms

      # Scoped to `tests/integration/` — the harness-based suite, purpose-built
      # for concurrent execution against its OWN ephemeral per-run database
      # (`tests/integration/harness.ts`) — not a bare `bun test`, for the same
      # reason `check` above only ever runs with `DATABASE_URL=""`. The
      # `*-postgres.test.ts`/legacy DB-gated files elsewhere under
      # `apps/cms/tests/` are apps/cms's own CI's job (its `integration-tests`
      # job's second step); this workflow's 20-minute budget and issue #25's
      # own ≤15-minute target are spent on the harness suite only.
      #
      # `--timeout 60000`: `setupIntegrationDatabase()` applies every file in
      # `sql/` as a subprocess inside `beforeAll`, which is subject to Bun's
      # 5000ms per-hook default — see apps/cms's own CI comment on the
      # identical step for the measured cost this headroom covers.
      - name: Run DB-gated integration tests
        run: |
          cd apps/cms
          bun test tests/integration/ --timeout 60000 2>&1 | tee /tmp/check-cms-integration.log

      # Issue #25's acceptance criterion: "integration suites that gate on
      # DATABASE_URL run instead of skipping (assert the skip count dropped
      # in the job summary)". Bun's own reporter prints a trailing
      # " N skip" line; both log files came from the two steps above.
      - name: Job summary — DB-gated skip count before/after
        if: always()
        run: |
          before="$(grep -oE '[0-9]+ skip$' /tmp/check-cms-quality.log | tail -1 | grep -oE '^[0-9]+' || echo 0)"
          after="$(grep -oE '[0-9]+ skip$' /tmp/check-cms-integration.log | tail -1 | grep -oE '^[0-9]+' || echo 0)"
          {
            echo "### check-cms — DB-gated skip count"
            echo ""
            echo "- Before a live database (\`cd apps/cms && DATABASE_URL=\"\" bun run check\`): **$before** skipped"
            echo "- After a live database (\`cd apps/cms && bun test tests/integration/\`): **$after** skipped"
            if [ "$after" -lt "$before" ]; then
              echo "- Skip count dropped ($before → $after) — DB-gated suites ran instead of skipping."
            else
              echo "- ⚠️ skip count did NOT drop ($before → $after) — this job is not exercising the database it provisions; investigate before trusting it as coverage."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
