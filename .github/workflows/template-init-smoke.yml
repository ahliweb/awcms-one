name: template-init-smoke

# Issue #138 — proves `bun run template:init` actually leaves a derived
# repository green, for all three build profiles (ADR-0018 D2/D7), on every
# push/PR. A separate workflow from `.github/workflows/ci.yml` on purpose:
# `ci.yml` is owned by a different, concurrently-landing change (issue #137)
# and this job's own scope line asks for a NEW workflow file rather than a
# new job bolted onto that one.
#
# Issue #147 reshaped this workflow after two consecutive `main` runs each
# failed a DIFFERENT matrix leg's final "Root bun test" step on a DIFFERENT
# storefront build-smoke test — evidence of runner contention (three legs
# each running their own full `bun test`, including the heavy build-smoke
# suite, concurrently on a two-core runner) rather than a real profile
# defect. The fix is a responsibility split, not a bigger timeout:
#
#   - each of the three matrix legs still runs the REAL `template:init` for
#     its profile, starts the storefront's stub CMS, and runs a REAL
#     `SITE_PROFILE=<profile> bun run build` — then a cheap, deterministic
#     assertion over that SAME already-built `dist/client` (`bun scripts/
#     assert-profil-dist.ts`, apps/storefront), instead of re-running a
#     test file that would build a SECOND time;
#   - the expensive full-root `bun test` now runs exactly ONCE, in a
#     separate `root-suite` job with no matrix, so three copies are never
#     competing for the same runner's CPU/IO at once.
#
# Not a required status check yet — see docs/alur-kerja-pengembangan.md for
# the protection-settings update once this job has run green for a while,
# matching how `check`/`check-cms` themselves were promoted. Promotion
# additionally waits for at least three consecutive green runs against the
# same code state (issue #147's own acceptance criterion).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  template-init-smoke:
    name: template-init-smoke (${{ matrix.profil }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        profil: [toko, berita, landing]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must equal packageManager/engines.bun in the root package.json — see
      # AGENTS.md's "Configuration and toolchain".
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Cache Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs the WHOLE tool, including its own trailing gate chain
      # (docs:i18n:stamp, bun install, audit:dokumen, audit:translation,
      # audit:rilis, bun test — docs/template.md's "After it runs"). This
      # runner's checkout is ephemeral, so mutating it here (rather than a
      # copy) is fine — this job's only purpose is proving the tool leaves
      # ITS OWN checkout green for each profile, one matrix leg at a time.
      - name: bun run template:init --profil ${{ matrix.profil }}
        # `TEMPLATE_INIT_TEST_SCOPE=root`: the tool's own trailing `bun test`
        # runs only the root gate tests here — `root-suite` (below, a
        # SEPARATE job) is where the full suite runs once, and a nested full
        # run inside every matrix leg doubled the stub-CMS build load enough
        # to trip the stub-start deadline (issue #147).
        env:
          TEMPLATE_INIT_TEST_SCOPE: root
        run: |
          bun run template:init \
            --nama "Toko Contoh ${{ matrix.profil }}" \
            --slug "toko-contoh-${{ matrix.profil }}" \
            --domain "toko-contoh-${{ matrix.profil }}.id" \
            --profil "${{ matrix.profil }}" \
            --warna-primer "#0ea5e9" \
            --kontak-email "owner@toko-contoh.id" \
            --yes

      # The storefront's own stub CMS (apps/storefront/scripts/stub-awcms.mjs),
      # on a fixed port for this job only — see
      # apps/storefront/tests/berita-build-smoke.test.ts for the identical
      # start/wait pattern this step follows. The PID is written to a file
      # (rather than relied on as a shell variable) so the teardown step
      # below — a SEPARATE step, run under `if: always()` — can find and
      # kill it even when an earlier step in between failed.
      - name: Start the stub CMS
        run: |
          cd apps/storefront
          STUB_PORT=4310 nohup bun scripts/stub-awcms.mjs > /tmp/stub-awcms.log 2>&1 &
          echo $! > /tmp/stub-awcms.pid
          # The stub answers 401 to a request without a bearer token (on
          # purpose — see scripts/stub-awcms.mjs), so probe WITH one; `-f`
          # would otherwise treat that 401 as "not up yet" forever.
          for _ in $(seq 1 100); do
            if curl -sf -H "Authorization: Bearer stub" http://localhost:4310/api/v1/commerce/products -o /dev/null; then exit 0; fi
            sleep 0.2
          done
          echo "stub-awcms did not answer in time" >&2
          cat /tmp/stub-awcms.log >&2
          exit 1

      # Issue #137 landed the SITE_PROFILE mechanism itself
      # (`apps/storefront/src/config/profil.ts`, the `injectRoute`
      # integration): this build genuinely filters pages now, not merely
      # succeeds under a value with no effect.
      - name: SITE_PROFILE=${{ matrix.profil }} bun run build
        env:
          SITE_PROFILE: ${{ matrix.profil }}
          AWCMS_API_URL: http://localhost:4310
          AWCMS_API_TOKEN: stub-token
          SITE_URL: http://localhost:4321
          PUBLIC_AWCMS_ORIGIN: https://cms.example.com
        run: |
          cd apps/storefront
          bun run build

      # A deterministic, non-rebuilding check over the dist/ the PREVIOUS
      # step already produced (issue #147): excluded groups' representative
      # files/directories are absent, active groups' are present, no
      # sitemap entry or built-page link falls under an excluded route, and
      # every internal link resolves to a file this build actually wrote —
      # derived from `src/config/profil.ts`, never a second hand-typed
      # list. `tests/profil-build-smoke.test.ts` / `tests/profil-routes.
      # test.ts` are the AUTHORITATIVE proof of this same invariant
      # (`ci.yml`'s own 3-leg `Check` matrix runs them on every push) — both
      # start their own stub and run their own `astro build`, so running
      # them again here, on top of the build this job already paid for,
      # would double this job's build load for nothing.
      - name: Assert dist/ matches src/config/profil.ts for SITE_PROFILE=${{ matrix.profil }}
        run: |
          cd apps/storefront
          SITE_PROFILE=${{ matrix.profil }} bun scripts/assert-profil-dist.ts

      # `if: always()` so a failure in any step above still gets its stub
      # process killed (this runner is ephemeral and thrown away right
      # after, so the kill itself only matters for a clean job exit — the
      # LOG dump is what actually helps a reader). `if: failure()` guards
      # the log dump alone: a green run has nothing worth printing.
      - name: Stop the stub CMS and surface logs
        if: always()
        run: |
          if [ -f /tmp/stub-awcms.pid ]; then
            kill "$(cat /tmp/stub-awcms.pid)" 2>/dev/null || true
          fi
      - name: Surface stub-awcms logs on failure
        if: failure()
        run: cat /tmp/stub-awcms.log 2>/dev/null || echo "(no stub-awcms.log)"

  # ---------------------------------------------------------------------------
  # Issue #147 — the expensive full-root `bun test` (including every
  # storefront build-smoke test, which each spin up their own stub CMS and
  # `astro build`) now runs exactly ONCE, in its own job with no matrix,
  # instead of once per profile leg above. Three copies of that suite
  # competing for the same two-core runner's CPU/IO is what produced the
  # two flaky `main` failures issue #147 exists to fix — see the workflow's
  # own header comment. This job is independent of the matrix job above
  # (no `needs:`) so a `root-suite` failure and a `toko`/`berita`/`landing`
  # failure are both visible on the same push, `fail-fast` does not hide
  # either from the other, and this job does not wait on three legs it does
  # not depend on.
  # ---------------------------------------------------------------------------
  root-suite:
    name: "template-init-smoke (root-suite)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Cache Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The default profile (`toko`), same as the matrix legs above:
      # `TEMPLATE_INIT_TEST_SCOPE=root` keeps `template:init`'s OWN trailing
      # `bun test` scoped to the root gate tests only, so the FULL suite
      # below runs exactly once, as its own explicit step — not twice
      # (once nested inside this tool, once again below) on this job's own
      # single runner.
      - name: bun run template:init --profil toko
        env:
          TEMPLATE_INIT_TEST_SCOPE: root
        run: |
          bun run template:init \
            --nama "Toko Contoh Root Suite" \
            --slug "toko-contoh-root-suite" \
            --domain "toko-contoh-root-suite.id" \
            --profil toko \
            --warna-primer "#0ea5e9" \
            --kontak-email "owner@toko-contoh.id" \
            --yes

      # The full derived-repository `bun test` — every root gate test plus
      # every storefront unit/build-smoke/route test (which build all three
      # profiles when `SITE_PROFILE` is unset, e.g.
      # `profil-build-smoke.test.ts`) — run exactly ONCE, on this job's own
      # runner with nothing else competing for CPU/IO. This is the single
      # place in the whole workflow that full suite runs; see the job's own
      # header comment for why three concurrent copies of it (the pre-#147
      # shape) produced flaky `main` failures instead of real defects.
      - name: Root bun test
        run: bun test
