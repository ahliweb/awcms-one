# CodeQL config for the local-ci/security leg's javascript-typescript
# analysis (tools/ci/runners/security.ts, issue #184/#225, part of epic
# #179) — originally written for `.github/workflows/codeql.yml`, removed
# along with every other GitHub Actions workflow (ADR-0021); this file
# itself stays, read directly by the CodeQL CLI rather than codeql-action.
#
# apps/cms/** SOURCE stays IN SCOPE — nothing below excludes it. It is the
# code that actually runs in this deployment (SECURITY.md's "apps/cms"
# surface), even though the tree itself is upstream ahliweb/awcms embedded
# via git subtree (AGENTS.md's "The subtree embed"). Only apps/cms's own
# generated/vendored output is excluded here, on the same terms as this
# repo's own equivalent output.
#
# Every path below is either dependency/build output regenerated by a tool,
# or a vendored dataset with no logic of its own — never hand-authored
# source this repo or apps/cms owns. Compare each app's own .gitignore for
# why these are the generated paths. A bare path (no wildcard) excludes
# that exact file/directory and everything under it; `**/x` additionally
# matches `x` at any depth, for names that recur across workspace members.

name: "awcms-one CodeQL config"

paths-ignore:
  # Dependencies and build output, at any depth in the workspace.
  - "**/node_modules"
  - "**/dist"
  - "**/.astro"

  # This repo's own knowledge-graph corpus, and the untouched copy embedded
  # in apps/cms's own subtree — both machine-generated, never hand-edited
  # from here (AGENTS.md's "Working with the knowledge graph").
  - "graphify-out"
  - "apps/cms/graphify-out"

  # Compiled from locales/*.po by apps/cms's own i18n build step — build
  # output, not hand-authored source.
  - "apps/cms/src/lib/i18n/catalogs/*.generated.ts"

  # Dependency lockfiles, not source code.
  - "bun.lock"
  - "apps/cms/bun.lock"

  # Vendored reference/sample datasets (the Indonesian administrative-region
  # dump, sample content, the seputarborneo legacy export) — sql/md/json/
  # ndjson fixtures, no .ts/.js source of their own.
  - "apps/cms/data"

  # Playwright run artefacts: traces/screenshots/videos/HTML reports,
  # regenerated by every run, never committed logic (see each app's own
  # .gitignore).
  - "apps/storefront/playwright-report"
  - "apps/storefront/test-results"
  - "apps/cms/playwright-report"
  - "apps/cms/test-results"
  - "apps/cms/blob-report"
