                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                          - pending
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: "UNAUTHENTICATED — an Authorization header was present but not a live session (Issue #91)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: REVIEW_NOT_ALLOWED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  # --- Issue #86 (ADR-0016, epic #32 wave 0) — CONTRACT. ----------------------
  # C2 (accounts/OTP/sessions, Issue #89) and C3 (addresses/wishlist/orders/
  # reviews, Issue #91) are now IMPLEMENTED — every path below carries a real
  # route file. Only C4 (affiliates, issues #92/#93) remains contract-only and
  # still has an explicit `ROUTE_PARITY_EXEMPTIONS` entry in
  # `scripts/api-spec-check.ts`. Documenting each wave's shape ahead of its own
  # handlers was the point of wave 0: every later wave codes AGAINST this
  # contract instead of re-deciding it.
  /api/v1/commerce/storefront/account/otp/request:
    post:
      operationId: requestCommerceStorefrontAccountOtp
      tags:
        - Commerce Accounts
      summary: "Issue #89 (implemented, contract #86). Request a 6-digit e-mail OTP for login or registration (D2). Always answers 202 — anti-enumeration (ADR-0016)."
      description: >-
        Anonymous, per-IP and per-e-mail rate limited (10/IP/h, 5/e-mail/h).
        For `purpose: "register"`, `name`/`phone` are stored on the OTP row
        (`customer_otps.registration`) and applied only when the code is
        verified — a request alone creates nothing. Always answers `202
        {sent:true, ...}` regardless of whether the address has an account,
        whether the phone is already registered, or whether the tenant's
        `email` outbox is reachable, so this endpoint is never an
        account-existence oracle.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "202":
          description: Always — the OTP was queued (or the request was silently absorbed by a rate limit/tenant resolution failure that answers identically).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      sent:
                        type: boolean
                        enum:
                          - true
                      expiresInSeconds:
                        type: integer
                        enum:
                          - 600
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: 'CHANNEL_UNAVAILABLE — `via: "whatsapp"` and the tenant has no WhatsApp channel configured/enabled (Issue #108, contract #106/ADR-0017 D5). Configuration, not enumeration — answered before an OTP is ever issued, and reveals only a per-tenant configuration fact, never anything about the e-mail/phone/account itself.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many OTP requests from this source (RATE_LIMITED). Carries `Retry-After`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/storefront/account/otp/verify:
    post:
      operationId: verifyCommerceStorefrontAccountOtp
      tags:
        - Commerce Accounts
      summary: "Issue #89 (implemented, contract #86). Verify a 6-digit e-mail OTP and mint a bearer session (D2/D3)."
      description: >-
        Anonymous, per-IP and per-e-mail rate limited. The code is hashed, 10
        minute TTL, 5 attempts, single use — any of wrong/expired/consumed/
        attempts-exhausted answers the SAME `401 OTP_INVALID` so a guess
        cannot distinguish why it failed. On success, mints an opaque `cs_`
        bearer token (only its `sha256:` digest is stored, D3) and — for
        `purpose: "register"` — applies the registration data captured at
        request time, binding to an existing guest `awcms_commerce_customers`
        row by phone when one exists (history_from rule, D4).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerify"
      responses:
        "200":
          description: Verified — a new bearer session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                      account:
                        $ref: "#/components/schemas/CustomerAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: OTP_INVALID — wrong, expired, consumed, or attempts exhausted (one code for all four, D2's anti-guess rule).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: 'ACCOUNT_NOT_FOUND — `purpose: "login"` for an e-mail with no account. Acceptable per ADR-0016 D2 — the mailbox owner already received the code, so this is not a new oracle.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: 'PHONE_ALREADY_REGISTERED — `purpose: "register"` and the phone is bound to another account.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many verification attempts from this source (RATE_LIMITED). Carries `Retry-After`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
