          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        createdByTenantUserId: *id001
        createdAt: *id002
        updatedAt: *id002
    CommerceWorkOrderEvent:
