  /api/v1/commerce/storefront/orders:
    post:
      operationId: createCommerceStorefrontOrder
      tags:
        - Commerce
      summary: "Anonymous order creation (Issue 29), with an optional customer bearer (Issue #91). Idempotent by the client-supplied idempotencyKey; re-quotes the cart inside the write transaction. No permission check required — a valid bearer is accepted, never required."
      description: >-
        Issue #91 (implemented, contract #86): an OPTIONAL
        `Authorization: Bearer <customer session token>` (see `customerBearer`)
        is accepted alongside the existing anonymous path. Present and valid
        → the order is attributed to that account's OWN customer row instead
        of the guest find-or-create by phone (the typed phone is still
        validated for shape, but ignored for identity); present and
        invalid/expired → `401 UNAUTHENTICATED` (explicit — the storefront
        re-reads its own session right before submit); absent entirely → the
        request proceeds exactly as it did before this issue. `affiliateCode`
        is likewise optional and shape-validated (a string, at most 50
        characters) but otherwise IGNORED in this issue — Issue #92 is what
        actually resolves it against `awcms_commerce_affiliates.code` and
        records a referral.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommerceCreateOrderRequest"
      responses:
        "201":
          description: Order created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceOrder"
        "200":
          description: The idempotency key was seen before; the same order is returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: "UNAUTHENTICATED — an Authorization header was present but not a live session (Issue #91)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unresolvable tenant, disabled module, or a rate-limited caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "CART_CHANGED — a line's price/stock/shipping/payment method changed since it was last quoted (in `ledger` inventory mode this includes the inventory ledger refusing the last unit); `error.details.quote` carries a fresh quote. INVENTORY_UNAVAILABLE — the store's inventory location is missing, inactive or counts the item in another unit (ADR-0038); nothing was written. With `loyaltyRedemption` (Issue #363): LOYALTY_REDEMPTION_UNAVAILABLE, LOYALTY_REDEMPTION_REQUIRES_ACCOUNT, LOYALTY_REDEMPTION_DEPOSIT_CONFLICT, LOYALTY_REDEMPTION_EXCEEDS_LIMIT (details carry `reason` and `maxPoints`), LOYALTY_REDEMPTION_CUSTOMER_UNAVAILABLE or INSUFFICIENT_POINTS (details carry `balance` and `requested`) - each found before any row of the order was written."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited (per IP and per normalised phone).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
