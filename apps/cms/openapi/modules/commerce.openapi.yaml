                  maxLength: 500
                  description: Required when rejecting.
      responses:
        "200":
          description: "The expense and the outcome (or the stored replay)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceExpenseAction"
        "400":
          description: "`VALIDATION_ERROR` or `IDEMPOTENCY_REQUIRED`."
          content:
