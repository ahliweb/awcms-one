    post:
      operationId: validateCommerceVoucher
      tags:
        - Commerce
      summary: Evaluate a voucher code against a subtotal (Issue 26). A read, not a redemption — nothing is written. Gated on vouchers.read.
      description: Arithmetic is exact (integer cents) — a percentage discount is capped by maxDiscount, a nominal one is the value, free_shipping yields discount "0.00" and freeShipping true. An unknown code and an ineligible one answer the same 200 shape with valid false and a reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - subtotal
              properties:
                code:
                  type: string
                  maxLength: 40
                subtotal:
                  type: string
                  description: numeric(14,2) as a string.
                shippingCost:
                  type: string
                  description: numeric(14,2) as a string; defaults to "0.00".
      responses:
        "200":
          description: The evaluation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
