    get:
      operationId: getReportsCommerceOperationalTenders
      tags:
        - Commerce
      summary: "Issue #296 (ADR-0035). The POS operational tenders report over the inclusive day range: money movement per day, register and tender (payment and reversal counts and sums, net derived), from the `commerce.pos_tender_daily` projection over the payment-allocation ledger; each leg lands on the day it SETTLED in the report time zone, and pending or failed legs never count. It needs no tenant feature (payments exist in every tenant). Gated on `commerce.report_tenders.read`, a permission of its own (not implied by `reporting.dashboard.read` or by the source-domain permission)."
