        marketingConsent:
          type: boolean
          description: "Issue #114 (contract #106 ADR-0017 D9). `true` when `marketing_consent_at` is non-null. A campaign's audience resolution only ever includes accounts where this is `true` — an account that never opts in is structurally unreachable, not merely filtered by convention."
    CustomerSession:
      type: object
      description: "Issue #86 (design only). A row of `awcms_commerce_customer_sessions` — never returned with its token; the token is minted once, at verify, and only its `sha256:` digest is ever stored (D3)."
      properties:
        id:
          type: string
          format: uuid
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
