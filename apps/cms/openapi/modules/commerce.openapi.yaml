                        description: "`numeric(14,2)` string."
                      more:
                        type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`FEATURE_DISABLED` — the tenant's `storedValue` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/stored-value/reconcile:
    post:
      operationId: reconcileCommerceStoredValue
      tags:
        - Commerce
      summary: "Issue #288 (ADR-0030). Compares every account's projected balance with its ledger, the ledger with itself and every redemption with its payment leg. `repair: false` needs `commerce.stored_value.read`; `repair: true` also needs `commerce.stored_value_reconcile.approve`."
      description: >-
        Read-only by default. `repair: true` rebuilds ONLY the `balance` and
        `version` of drifted accounts, under the account lock, auditing each. A
        ledger that contradicts itself, a status that disagrees with its
        entries and an unmatched redemption are REPORTED and never repaired.
        Bounded to 1000 findings per run (`truncated`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                repair:
                  type: boolean
                  default: false
      responses:
        "200":
          description: The findings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceStoredValueReconcile"
        "400":
          description: "`VALIDATION_ERROR`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`FEATURE_DISABLED` — the tenant's `storedValue` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
