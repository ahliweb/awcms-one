  /api/v1/commerce/returns/{id}/refunds/{refundId}/execute:
    post:
      operationId: executeCommerceRefund
      tags:
        - Commerce
      summary: "Issue #287 (ADR-0033). Settles one still-open refund leg: a gateway leg is sent to the payment provider (with NO database transaction open), any other open leg is settled in the ledger. Gated on `commerce.refunds.create` and `commerce.payments.revoke` and the tenant's `returns` feature; requires `Idempotency-Key`."
      description: >-
        The provider is given the refund leg's id as its idempotency key on
        EVERY attempt, so a retry after a timeout can never refund twice. A
        transport failure or a provider refusal leaves the leg `failed` (a
        short `failureCode`, retryable); a provider answer of "accepted,
        pending" leaves it `processing`. `503 GATEWAY_UNAVAILABLE` means no
        adapter that can refund is configured: settle the leg with `.../offline`.
        A settled or accepted answer is replayed under the key; a failure is not.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: refundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                registerSessionId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        "200":
          description: "The leg after the attempt (`settled` says whether it is now booked)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceRefundOutcome"
        "400":
          description: "`VALIDATION_ERROR` or `IDEMPOTENCY_REQUIRED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`REFUND_NOT_REFUNDABLE`, `PAYMENT_NOT_REVERSIBLE`, `REGISTER_SESSION_NOT_OPEN`, `NOT_SESSION_CASHIER`, `IDEMPOTENCY_CONFLICT` or `FEATURE_DISABLED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: "`PROVIDER_REFUND_FAILED` - the provider did not complete it (`details.failureCode`); retry or settle offline."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "`GATEWAY_UNAVAILABLE` - no adapter that can refund is configured; settle offline."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/returns/{id}/refunds/{refundId}/offline:
    post:
      operationId: settleCommerceRefundOffline
      tags:
        - Commerce
      summary: "Issue #287 (ADR-0033). Settles a refund leg as made OUTSIDE the system, on the caller's attestation. Gated on the high-risk `commerce.refunds_offline.approve` AND `commerce.payments.revoke` and the tenant's `returns` feature; requires `Idempotency-Key`."
      description: >-
        For a leg the provider refused or no adapter can make. The stated
        `reason` and the approver are stored on the leg and the settlement is
        audited; the payment-ledger reversal and the proportional compensations
        are booked exactly as for an automatic settlement.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: refundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: "The settled leg."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceRefundOutcome"
        "400":
          description: "`VALIDATION_ERROR` or `IDEMPOTENCY_REQUIRED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`REFUND_NOT_REFUNDABLE`, `PAYMENT_NOT_REVERSIBLE`, `IDEMPOTENCY_CONFLICT` or `FEATURE_DISABLED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/segments:
    get:
      operationId: listCommerceSegments
      tags:
        - Commerce
      summary: "Issue #360 (ADR-0042). CRM segments, keyset-paginated, newest first. Definitions only - never a customer. Gated on `commerce.segments.read` and the tenant's `segments` feature (default OFF)."
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: includeRetired
          in: query
          required: false
          description: "`true` adds retired segments; the default lists live ones only."
          schema:
            type: boolean
      responses:
        "200":
          description: "One page of segments (limit 50) with an opaque `nextCursor` (null on the last page)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommerceSegment"
                      nextCursor:
                        type: string
                        nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`FEATURE_DISABLED` - the `segments` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createCommerceSegment
      tags:
        - Commerce
      summary: "Issue #360 (ADR-0042). Define a segment: a name and a rule tree in the closed vocabulary. Creates version 1. Gated on `commerce.segments.create` and the tenant's `segments` feature."
      description: >-
        The rule tree is validated against the closed vocabulary (PRD 6.1, owner
        answer Q7): an unknown field, operator or key, a value of the wrong type,
        a depth above 4, more than 25 nodes, more than 10 children in a group,
        more than 3 distinct windows or more than 8 KiB of JSON is a 400 whose
        `details` name the offending path (`rules.and[1].field`). A key outside
        `name`, `description`, `rules` - a `tenantId`, for instance - is refused
        by name, never honoured. The stored rules are the canonical form.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommerceSegmentInput"
      responses:
        "201":
          description: "The segment, with its version 1."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceSegmentDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`FEATURE_DISABLED` (the `segments` feature is off) or `SEGMENT_NAME_TAKEN` (a live segment already has this name, compared case-insensitively)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/segments/preview:
    post:
      operationId: previewCommerceSegment
      tags:
        - Commerce
      summary: "Issue #360 (ADR-0042, PRD S2). How many customers a rule matches. Body: `{ rules }` (unsaved) OR `{ segmentId, version? }` (saved). Gated on `commerce.segment_previews.read` and the tenant's `segments` feature."
      description: >-
        Read-only and bounded (control C-26): at most 2 concurrent evaluations
        per tenant and 1 per actor (429 `SEGMENT_EVALUATION_BUSY`), a 5 s
        statement timeout (422 `SEGMENT_TOO_EXPENSIVE`), and 30 previews per
        actor per minute (429 `RATE_LIMITED`). The answer carries the SERVER's
        `asOf` instant; the request has no such field and one is refused by
        name. A count below 5 is withheld: `count` is `{ suppressed: true,
        count: null, label: "fewer_than_5" }` (control C-27). `sample` (at most
        10 masked customers, never pageable) is present only for a caller who
        also holds `commerce.segment_members.read` and `commerce.customers.read`;
        otherwise it is null and no customer permission is needed. The walk-in
        placeholder, blocked and erased customers are never counted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommerceSegmentPreviewRequest"
      responses:
        "200":
          description: "The count (suppressed under 5), the as-of instant and, for a caller who may see members, a bounded masked sample."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceSegmentPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`FEATURE_DISABLED` - the `segments` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "`SEGMENT_TOO_EXPENSIVE` - the rule took longer than the statement timeout to evaluate and was cancelled."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "`SEGMENT_EVALUATION_BUSY` (too many evaluations running) or `RATE_LIMITED` (too many previews); `Retry-After` is set."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/segments/{id}:
    get:
      operationId: getCommerceSegment
      tags:
        - Commerce
      summary: "Issue #360 (ADR-0042). One segment with its versions (rules only, newest first, at most 100). Gated on `commerce.segments.read`. An unknown id and another tenant's id are the same 404."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "The segment and its versions."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceSegmentDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`FEATURE_DISABLED` - the `segments` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateCommerceSegment
      tags:
        - Commerce
      summary: "Issue #360 (ADR-0042, PRD S1). Rename a segment and/or add a NEW version of its rules - an existing version is never changed. Must carry the `baseVersion` the edit started from. Gated on `commerce.segments.update`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommerceSegmentUpdate"
      responses:
        "200":
          description: "The segment; `latestVersion` rose by one when `rules` was sent."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceSegmentDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`FEATURE_DISABLED`, `SEGMENT_VERSION_CONFLICT` (`details.latestVersion` is the current one - a stale tab or a double submit), `SEGMENT_RETIRED` or `SEGMENT_NAME_TAKEN`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: retireCommerceSegment
      tags:
        - Commerce
      summary: "Issue #360 (ADR-0042). Retire a segment. Every version is KEPT so a past campaign or earn that recorded `(segment, version)` stays explainable (control C-29). Gated on `commerce.segments.delete` (high-risk)."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "The retired segment, with all its versions."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceSegmentDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`FEATURE_DISABLED` or `SEGMENT_RETIRED` (already retired)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/segments/{id}/members:
    get:
      operationId: listCommerceSegmentMembers
      tags:
        - Commerce
      summary: "Issue #360 (ADR-0042, PRD S4). The customers a segment version matches, keyset-paged by customer id, masked. Gated on `commerce.segment_members.read` AND `commerce.customers.read` (403 without the second)."
      description: >-
        Walk-in, blocked and erased customers are never members. Fields are the
        customer's name, masked phone, masked e-mail and price level. Every page
        is audited (actor, version, count - never who). Bounded like a preview
        (422 `SEGMENT_TOO_EXPENSIVE`, 429 `SEGMENT_EVALUATION_BUSY`). Each page
        is evaluated at the server's current instant.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: query
          required: false
          description: "The version to evaluate; the latest by default."
          schema:
            type: integer
            minimum: 1
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: "One page of masked members."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceSegmentMembersPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`FEATURE_DISABLED` - the `segments` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "`SEGMENT_TOO_EXPENSIVE` - the rule was cancelled at the statement timeout."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "`SEGMENT_EVALUATION_BUSY`; `Retry-After` is set."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/segments/{id}/export.csv:
    get:
      operationId: exportCommerceSegmentMembersCsv
      tags:
        - Commerce
      summary: "Issue #360 (ADR-0042, control C-27). The members of a segment version as CSV. Gated on `commerce.segment_members.export` - the high-risk `export` verb; reading members grants none - AND `commerce.customers.read`."
      description: >-
        Every cell is spreadsheet-formula-neutralised; phone and e-mail are the
        masked forms a list shows. Bounded: at most 10,000 rows with
        `X-Export-Truncated: true` when more existed - never a silent cut.
        `Cache-Control: no-store`. The export is audited at `warning` severity
        with the actor, the version and the row count.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The CSV.
          headers:
            X-Export-Truncated:
              schema:
                type: string
                enum:
                  - "true"
                  - "false"
            X-Segment-As-Of:
              description: The server instant the export was evaluated at.
              schema:
                type: string
                format: date-time
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`FEATURE_DISABLED` - the `segments` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "`SEGMENT_TOO_EXPENSIVE` - the rule was cancelled at the statement timeout."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "`SEGMENT_EVALUATION_BUSY`; `Retry-After` is set."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    CommerceInventoryMode:
      type: object
      required:
        - mode
        - locationId
        - changedAt
      properties:
        mode:
          type: string
          enum:
            - counter
            - ledger
        locationId:
          type: string
          format: uuid
          nullable: true
          description: The inventory location commerce sells from; null in counter mode.
        changedAt:
          type: string
          format: date-time
          nullable: true
    CommerceInventoryDrift:
      type: object
      required:
        - itemType
        - itemRef
        - sku
        - name
        - cached
        - expected
        - ledgerOnHand
      properties:
        itemType:
          type: string
          enum:
            - commerce.product
            - commerce.variant
        itemRef:
          type: string
          format: uuid
        sku:
          type: string
          nullable: true
        name:
          type: string
        cached:
          type: integer
          description: The `stock` column as it stands.
        expected:
          type: integer
          description: "`max(0, floor(ledger on-hand))`."
        ledgerOnHand:
          type: string
          description: The ledger balance, as the ledger states it (decimal string).
    CommerceInventoryReconciliation:
      type: object
      required:
        - mode
        - locationId
        - scanned
        - drift
        - nextCursor
      properties:
        mode:
          type: string
          enum:
            - ledger
        locationId:
          type: string
          format: uuid
        scanned:
          type: integer
        drift:
          type: array
          items:
            $ref: "#/components/schemas/CommerceInventoryDrift"
        nextCursor:
          type: string
          nullable: true
    CommerceInventoryItem:
      type: object
      required:
        - itemType
        - itemRef
        - sku
        - name
        - variantName
        - unitCode
      properties:
        itemType:
          type: string
          enum:
            - commerce.product
            - commerce.variant
        itemRef:
          type: string
          format: uuid
        sku:
          type: string
          nullable: true
        name:
          type: string
          description: The product's name (for a variant, its parent product).
        variantName:
          type: string
          nullable: true
          description: The variant's value, e.g. `M`; null for a product-level unit.
        unitCode:
          type: string
          enum:
            - unit
    CommerceInventoryItemPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommerceInventoryItem"
        nextCursor:
          type: string
          nullable: true
    CommerceInventoryOrphan:
      type: object
      required:
        - itemType
        - itemRef
        - unitCode
        - onHand
        - reason
      properties:
        itemType:
          type: string
        itemRef:
          type: string
        unitCode:
          type: string
        onHand:
          type: string
          description: The ledger balance at the sales location (decimal string).
        reason:
          type: string
          enum:
            - not_found
            - product_has_variants
            - wrong_unit
            - unknown_item_type
    CommerceInventoryOrphanReport:
      type: object
      required:
        - items
        - truncated
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommerceInventoryOrphan"
        truncated:
          type: boolean
    CommerceInventoryReconciliationReport:
      allOf:
        - $ref: "#/components/schemas/CommerceInventoryReconciliation"
        - type: object
          required:
            - orphans
          properties:
            orphans:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/CommerceInventoryOrphanReport"
    CommerceInventoryResync:
      allOf:
        - $ref: "#/components/schemas/CommerceInventoryReconciliation"
        - type: object
          required:
            - repaired
          properties:
            repaired:
              type: integer
    CommerceStoredValueProgram:
      type: object
      description: "Issue #288 (ADR-0030) — per-tenant configuration of one kind of closed-loop stored value."
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: "`null` until the tenant first saves the program."
        kind:
          type: string
          enum:
            - gift_card
            - store_credit
        configured:
          type: boolean
        enabled:
          type: boolean
        expiryDays:
          type: integer
          nullable: true
        allowRefundToAccount:
          type: boolean
        maxBalance:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
    CommerceStoredValueAccount:
      type: object
      description: "Issue #288 (ADR-0030) — one gift card / store credit. The code is NEVER returned (only masked); `balance`, `version` and `status` are the projection of the ledger."
      properties:
        id:
          type: string
          format: uuid
        programId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - gift_card
            - store_credit
        status:
          type: string
          enum:
            - active
            - disabled
            - expired
        balance:
          type: string
          description: "`numeric(14,2)` string."
        version:
          type: integer
          description: Number of ledger entries (the per-account sequence of the last one).
        maskedCode:
          type: string
          example: "•••••••-•••••••-•••AB2C"
        codeLast4:
          type: string
          minLength: 4
          maxLength: 4
        customerId:
          type: string
          format: uuid
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        issuedByTenantUserId:
          type: string
          format: uuid
          nullable: true
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CommerceStoredValueEntry:
      type: object
      description: "Issue #288 (ADR-0030) — one append-only liability entry."
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - issue
            - load
            - redeem
            - refund
            - adjust
            - expire
            - disable
            - enable
        amount:
          type: string
          description: "Signed `numeric(14,2)` string (a redemption or expiry is negative)."
        accountSeq:
          type: integer
        balanceAfter:
          type: string
        allocationId:
          type: string
          format: uuid
          nullable: true
          description: The payment-allocation row a `redeem` / `refund` mirrors.
        reason:
          type: string
          nullable: true
        actorKind:
          type: string
          enum:
            - tenant_user
            - system
        actorTenantUserId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
    CommerceStoredValueIssued:
      type: object
      description: "Issue #288 — the 201 body of an issue."
      properties:
        account:
          $ref: "#/components/schemas/CommerceStoredValueAccount"
        entry:
          $ref: "#/components/schemas/CommerceStoredValueEntry"
        code:
          type: string
          nullable: true
          description: "The plaintext code, `XXXXXXX-XXXXXXX-XXXXXXX`, present ONLY in the response to the request that created the account; `null` on a replay. Never stored."
        codeRevealed:
          type: boolean
    CommerceStoredValueMutation:
      type: object
      description: "Issue #288 — the 201 body of a load / adjust / status change."
      properties:
        account:
          $ref: "#/components/schemas/CommerceStoredValueAccount"
        entry:
          $ref: "#/components/schemas/CommerceStoredValueEntry"
    CommerceStoredValueReconcile:
      type: object
      description: "Issue #288 — the result of a consistency check."
      properties:
        accountsChecked:
          type: integer
        truncated:
          type: boolean
        repaired:
          type: integer
        findings:
          type: array
          items:
            type: object
            properties:
              accountId:
                type: string
                format: uuid
              type:
                type: string
                enum:
                  - projection_drift
                  - status_drift
                  - ledger_break
                  - allocation_mismatch
              detail:
                type: string
              repairable:
                type: boolean
              repaired:
                type: boolean
    CommerceStoredValueReport:
      type: object
      description: "Issue #288 — the closed-loop liability report."
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        timeZone:
          type: string
        kinds:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - gift_card
                  - store_credit
              issued:
                type: object
                description: "Value added in the period: issues + loads."
                properties:
                  count:
                    type: integer
                  amount:
                    type: string
                    description: "`numeric(14,2)` string, a positive magnitude."
              loaded:
                type: object
                description: "Of which top-ups."
                properties:
                  count:
                    type: integer
                  amount:
                    type: string
                    description: "`numeric(14,2)` string, a positive magnitude."
              redeemed:
                type: object
                description: "Value redeemed as a tender."
                properties:
                  count:
                    type: integer
                  amount:
                    type: string
                    description: "`numeric(14,2)` string, a positive magnitude."
              refunded:
                type: object
                description: "Value returned to an account by a payment reversal."
                properties:
                  count:
                    type: integer
                  amount:
                    type: string
                    description: "`numeric(14,2)` string, a positive magnitude."
              adjustedUp:
                type: object
                description: "Manual adjustments that added value."
                properties:
                  count:
                    type: integer
                  amount:
                    type: string
                    description: "`numeric(14,2)` string, a positive magnitude."
              adjustedDown:
                type: object
                description: "Manual adjustments that took value off."
                properties:
                  count:
                    type: integer
                  amount:
                    type: string
                    description: "`numeric(14,2)` string, a positive magnitude."
              expired:
                type: object
                description: "Value released because accounts lapsed."
                properties:
                  count:
                    type: integer
                  amount:
                    type: string
                    description: "`numeric(14,2)` string, a positive magnitude."
              net:
                type: string
                description: Signed net change in the period (sum of every entry).
              outstanding:
                type: string
                description: All-time, as of now — the sum of the ledger; what is owed.
              disabledBalance:
                type: string
                description: Of `outstanding`, the value on disabled accounts.
              lapsedPendingRelease:
                type: string
                description: Of `outstanding`, the value on accounts past their expiry that the sweep has not released yet.
              accounts:
                type: object
                properties:
                  total:
                    type: integer
                  active:
                    type: integer
                  disabled:
                    type: integer
                  expired:
                    type: integer
        totals:
          type: object
          properties:
            issued:
              type: string
            redeemed:
              type: string
            refunded:
              type: string
            expired:
              type: string
            outstanding:
              type: string
    CommerceSalesDailyRow:
      type: object
      description: "One projection day of `commerce.sales_daily`. Money is a `numeric(14,2)` decimal string (ADR-0003); `gross` is the sum of order subtotals, `discount` the sum of order + voucher discounts, `shipping` the sum of shipping costs, `net` the sum of order totals."
      properties:
        day:
          type: string
          format: date
        ordersPaid:
          type: integer
        gross:
          type: string
        discount:
          type: string
        shipping:
          type: string
        net:
          type: string
    CommerceSalesByProductRow:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        productName:
          type: string
          description: "The product name as snapshotted on the most recent order line in the range."
        qty:
          type: integer
        gross:
          type: string
          description: "Sum of line totals (`numeric(14,2)` decimal string)."
    CommerceSalesByCategoryRow:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: "`null` for the uncategorised bucket."
        categoryName:
          type: string
        qty:
          type: integer
        gross:
          type: string
    CommerceCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
          nullable: true
        productCount:
          type: integer
          description: Computed — the tenant's LIVE products currently in this category (Issue 23).
    CommerceProductImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        mediaObjectId:
          type: string
          format: uuid
        publicUrl:
          type: string
          nullable: true
          description: Resolved through media_library's MediaLibraryPort; null if the media object is no longer safe to reference.
        altText:
          type: string
          nullable: true
        sortOrder:
          type: integer
    CommerceProductVariant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        name:
          type: string
        value:
          type: string
        colorHex:
          type: string
          nullable: true
        imageMediaObjectId:
          type: string
          format: uuid
          nullable: true
        imageUrl:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        price:
          type: string
          nullable: true
          description: numeric(14,2) as a decimal string, or null to inherit the product's own price.
        priceLevel2:
          type: string
          nullable: true
        priceLevel3:
          type: string
          nullable: true
        priceLevel4:
          type: string
          nullable: true
        stock:
          type: integer
        weightGrams:
          type: integer
        sortOrder:
          type: integer
        attributes:
          type: array
          description: "Issue #291 — additive. Only `visible_public` attribute values set on this variant."
          items:
            $ref: "#/components/schemas/CommerceAttributeValue"
    CommerceProductVariantInput:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        colorHex:
          type: string
          nullable: true
          description: "#RRGGBB."
        imageMediaObjectId:
          type: string
          format: uuid
          nullable: true
        sku:
          type: string
          nullable: true
          description: Checked for uniqueness against BOTH this tenant's live products and live variants.
        price:
          type: string
          nullable: true
        priceLevel2:
          type: string
          nullable: true
        priceLevel3:
          type: string
          nullable: true
        priceLevel4:
          type: string
          nullable: true
        stock:
          type: integer
          minimum: 0
        weightGrams:
          type: integer
          minimum: 0
        sortOrder:
          type: integer
    CommerceServiceFormField:
      type: object
      required:
        - id
        - type
        - label
        - required
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - text
            - textarea
            - select
            - number
            - date
        label:
          type: string
        required:
          type: boolean
        options:
          type: array
          items:
            type: string
          nullable: true
          description: Required (non-empty) when type is "select"; rejected for every other type.
    CommerceVariantAttributeGroup:
      type: object
      required:
        - name
        - options
      properties:
        name:
          type: string
        options:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string
              description:
                type: string
                nullable: true
    CommerceProductParityFields:
      type: object
      description: Fields Issue 23 adds on top of Issue 4's catalog core — shared by the create and update request bodies below.
      properties:
        priceLevel2:
          type: string
          nullable: true
          description: numeric(14,2) as a decimal string.
        priceLevel3:
          type: string
          nullable: true
        priceLevel4:
          type: string
          nullable: true
        costPrice:
          type: string
          nullable: true
          description: Admin-only — never present on a GET response's CommerceProduct.
        minPurchase:
          type: integer
          minimum: 1
          default: 1
        weightGrams:
          type: integer
          minimum: 0
          default: 0
        manualRating:
          type: string
          nullable: true
          description: numeric(2,1) as a decimal string, "0.0"-"5.0".
        manualSoldCount:
          type: integer
          minimum: 0
          default: 0
        withInsurance:
          type: boolean
          default: false
        insuranceRequired:
          type: boolean
          default: false
        insuranceFee:
          type: string
          nullable: true
        promoBannerShow:
          type: boolean
          default: false
        promoBannerTitle:
          type: string
          nullable: true
        promoBannerSubtitle:
          type: string
          nullable: true
        promoBannerBadge:
          type: string
          nullable: true
        promoBannerIcon:
          type: string
          nullable: true
        promoBannerColor:
          type: string
          nullable: true
        sizeChartType:
          type: string
          enum:
            - none
            - image
            - table
          default: none
        sizeChartMediaId:
          type: string
          format: uuid
          nullable: true
          description: Required when sizeChartType is "image"; must be null otherwise.
        sizeChartDetails:
          type: object
          nullable: true
          description: Required when sizeChartType is "table"; must be null otherwise. Arbitrary JSON (object/array), capped at 20000 serialized characters.
        serviceForm:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CommerceServiceFormField"
        subscriptionPeriod:
          type: string
          nullable: true
          enum:
            - day
            - week
            - month
            - year
        downloadLink:
          type: string
          nullable: true
        taxCategoryCode:
          type: string
          nullable: true
          maxLength: 63
          pattern: "^[a-z0-9][a-z0-9_.-]{0,62}$"
          description: "Issue #293 (ADR-0039) — the product's tax class: a tax rule category code (`tax` module, ADR-0127). null/blank = standard (the rule version's fallback rule). Product level only — a variant never differs in tax class. Used only in `engine` tax mode; admin-only (never on the public `CommerceProduct`)."
        allowDp:
          type: boolean
          default: false
        allowFreeShipping:
          type: boolean
          default: true
        variantAttributes:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CommerceVariantAttributeGroup"
        isFeatured:
          type: boolean
          default: false
        isRecommended:
          type: boolean
          default: false
        kind:
          type: string
          enum:
            - standard
            - bundle
          default: standard
          description: "Issue #290 (ADR-0036) — `bundle` makes this product a kit sold as ONE line whose stock movement is its components'. A bundle has no variants, no stock of its own (`stock` must be 0 or absent), is not a service product and is not flash-sale eligible. Distinct from the descriptive `type: bundle` (issue #266), which carries no stock semantics."
        bundlePricing:
          type: string
          enum:
            - fixed
            - derived
          default: fixed
          description: "`fixed` = the bundle product's own price; `derived` = sum of the components' list prices x quantity, less `bundleDiscountPercent`, rounded half-up to the cent. Bundles only."
        bundleDiscountPercent:
          type: string
          nullable: true
          description: "A percentage from 0 to 100 with at most two decimals (a number or a decimal string is accepted; returned as a `numeric(5,2)` string). `derived` pricing only."
        bundleComponents:
          type: array
          minItems: 1
          maxItems: 20
          description: "Replaces the bundle's component lines (omit to leave them unchanged). 1-20 lines; a component is never itself a bundle (no nesting); a component product with live variants must name a variant."
          items:
            $ref: "#/components/schemas/CommerceBundleComponentInput"
    CommerceBundleComponentInput:
      type: object
      description: "Name the component either by `productId` (+ optional `variantId`) or by `sku` - a live product's or variant's SKU, resolved server-side inside the tenant (the admin form's `SKU x quantity` lines). An unknown SKU is refused exactly like an unknown product id."
      required:
        - quantity
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 64
        productId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
          nullable: true
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
          description: Units of the component in ONE bundle.
    CommerceBundleComponent:
      type: object
      required:
        - position
        - productId
        - variantId
        - sku
        - name
        - variantName
        - quantity
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 20
        productId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
          nullable: true
        sku:
          type: string
          nullable: true
        name:
          type: string
        variantName:
          type: string
          nullable: true
        quantity:
          type: integer
    CommerceBundle:
      type: object
      required:
        - pricing
        - discountPercent
        - components
      properties:
        pricing:
          type: string
          enum:
            - fixed
            - derived
        discountPercent:
          type: string
          nullable: true
        components:
          type: array
          items:
            $ref: "#/components/schemas/CommerceBundleComponent"
    CommerceProductCreateInput:
      allOf:
        - $ref: "#/components/schemas/CommerceProductParityFields"
        - type: object
          required:
            - sku
            - name
            - slug
            - price
          properties:
            categoryId:
              type: string
              format: uuid
              nullable: true
              description: Must reference a live category in the SAME tenant. An id that is unknown, soft-deleted, or belongs to another tenant is rejected identically with 400 (same GHSA-r7cx-c4jh-cvvw-shaped reasoning as categories.parentId).
            type:
              type: string
              enum:
                - physical
                - digital
                - service
                - subscription
                - digital_ebook
                - digital_program
                - mentoring
                - bundle
                - event
              default: physical
            sku:
              type: string
            name:
              type: string
            slug:
              type: string
              description: Lowercase alphanumeric segments separated by single hyphens.
            description:
              type: string
              nullable: true
            digitalNote:
              type: string
              nullable: true
            price:
              type: string
              description: numeric(14,2) as a decimal string, e.g. "19999.00" — never a JSON number. Non-negative, at most 2 fractional digits.
            discountPercent:
              type: integer
              minimum: 0
              maximum: 100
              default: 0
            stock:
              type: integer
              minimum: 0
              default: 0
            label:
              type: string
              nullable: true
            labelColor:
              type: string
              nullable: true
    CommerceProductUpdateInput:
      allOf:
        - $ref: "#/components/schemas/CommerceProductParityFields"
        - type: object
          properties:
            categoryId:
              type: string
              format: uuid
              nullable: true
            type:
              type: string
              enum:
                - physical
                - digital
                - service
                - subscription
                - digital_ebook
                - digital_program
                - mentoring
                - bundle
                - event
            sku:
              type: string
            name:
              type: string
            slug:
              type: string
            description:
              type: string
              nullable: true
            digitalNote:
              type: string
              nullable: true
            price:
              type: string
            discountPercent:
              type: integer
              minimum: 0
              maximum: 100
            stock:
              type: integer
              minimum: 0
            status:
              type: string
              enum:
                - draft
                - active
                - inactive
                - archived
            label:
              type: string
              nullable: true
            labelColor:
              type: string
              nullable: true
    # NOT built on `CommerceProductParityFields` via `allOf` — that schema's
    # `costPrice` is exactly the field this response must never carry
    # (`sql/904`'s header, this file's own header), and OpenAPI/JSON Schema
    # composition has no "allOf minus one property". So every parity field
    # OTHER than `costPrice` is repeated here by hand; keep the two lists in
    # sync when a parity field is added or renamed.
    CommerceProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum:
            - physical
            - digital
            - service
            - subscription
            - digital_ebook
            - digital_program
            - mentoring
            - bundle
            - event
        sku:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        digitalNote:
          type: string
          nullable: true
        price:
          type: string
          description: numeric(14,2) as a decimal string — never a JSON number (money is never a float; see sql/901's header).
        discountPercent:
          type: integer
        stock:
          type: integer
        status:
          type: string
          enum:
            - draft
            - active
            - inactive
            - archived
        label:
          type: string
          nullable: true
        labelColor:
          type: string
          nullable: true
        priceLevel2:
          type: string
          nullable: true
        priceLevel3:
          type: string
          nullable: true
        priceLevel4:
          type: string
          nullable: true
        minPurchase:
          type: integer
        weightGrams:
          type: integer
        manualRating:
          type: string
          nullable: true
        manualSoldCount:
          type: integer
        withInsurance:
          type: boolean
        insuranceRequired:
          type: boolean
        insuranceFee:
          type: string
          nullable: true
        promoBannerShow:
          type: boolean
        promoBannerTitle:
          type: string
          nullable: true
        promoBannerSubtitle:
          type: string
          nullable: true
        promoBannerBadge:
          type: string
          nullable: true
        promoBannerIcon:
          type: string
          nullable: true
        promoBannerColor:
          type: string
          nullable: true
        sizeChartType:
          type: string
          enum:
            - none
            - image
            - table
        sizeChartMediaId:
          type: string
          format: uuid
          nullable: true
        sizeChartImageUrl:
          type: string
          nullable: true
          description: sizeChartMediaId resolved to a public URL through the media port (Issue 26). null unless sizeChartType is image and the object is publicly resolvable.
        sizeChartDetails:
          type: object
          nullable: true
        serviceForm:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CommerceServiceFormField"
        subscriptionPeriod:
          type: string
          nullable: true
          enum:
            - day
            - week
            - month
            - year
        allowDp:
          type: boolean
        allowFreeShipping:
          type: boolean
        variantAttributes:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CommerceVariantAttributeGroup"
        isFeatured:
          type: boolean
        isRecommended:
          type: boolean
        finalPrice:
          type: string
          description: "price after discountPercent off, computed server-side in integer cents (domain/price-calculation.ts) — never a float. For a `derived`-priced bundle (Issue #290) it is the derived price (components' list prices x quantity, less `bundleDiscountPercent`)."
        averageRating:
          type: string
          nullable: true
          description: "= manualRating (until #29 lands reviews)."
        soldCount:
          type: integer
          description: "= manualSoldCount (until #29 lands orders)."
        kind:
          type: string
          enum:
            - standard
            - bundle
          description: "Issue #290 (ADR-0036). A `bundle` is one product made of components; its `stock` here is the COMPUTED availability (min over components of floor(component stock / quantity)), never a stored count."
        bundlePricing:
          type: string
          enum:
            - fixed
            - derived
        bundleDiscountPercent:
          type: string
          nullable: true
        bundle:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CommerceBundle"
          description: "Issue #290. The bundle's pricing and contents (no cost price, no stock counts); null for a standard product."
        images:
          type: array
          items:
            $ref: "#/components/schemas/CommerceProductImage"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/CommerceProductVariant"
        attributes:
          type: array
          description: "Issue #291 — additive. Typed custom attribute values set on this product that the tenant flagged `visible_public`, in the definitions' sort order. A consumer that predates attributes ignores the field; back-office-only attributes never appear here (read them through GET /products/{id}/attributes)."
          items:
            $ref: "#/components/schemas/CommerceAttributeValue"
    CommerceAttributeValue:
      type: object
      description: "Issue #291. One typed attribute value. `value` is a JSON number for `integer`, a decimal STRING for `decimal` (never a float), a boolean for `boolean`, an ISO `YYYY-MM-DD` string for `date`, and a string for `text`/`enum`."
      required:
        - key
        - label
        - valueType
        - value
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,62}$"
        label:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
          description: Per-locale labels (`en`, `id`, ...); `label` is the default.
        valueType:
          $ref: "#/components/schemas/CommerceAttributeValueType"
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
        valueLabel:
          type: string
          nullable: true
          description: An enum value's display label; null for every other type.
    CommerceAttributeValueType:
      type: string
      enum:
        - text
        - integer
        - decimal
        - boolean
        - date
        - enum
    CommerceAttributeConstraints:
      type: object
      description: "Closed per-type schema — any other key is a 400. text: minLength, maxLength (<= 2000). integer/decimal: min, max (canonical decimal strings; integer up to 12 digits, decimal up to 12 integer + 6 fractional digits), decimal also scale (1..6). date: min, max (ISO dates). enum: options[] (value, label), case-insensitively unique. boolean: none."
      properties:
        minLength:
          type: integer
        maxLength:
          type: integer
        min:
          type: string
        max:
          type: string
        scale:
          type: integer
          minimum: 1
          maximum: 6
        options:
          type: array
          items:
            type: object
            required:
              - value
            properties:
              value:
                type: string
                pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$"
              label:
                type: string
    CommerceAttributeDefinition:
      type: object
      description: "Issue #291. A tenant-authored attribute schema. `key` and `valueType` are fixed at creation."
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,62}$"
        label:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        valueType:
          $ref: "#/components/schemas/CommerceAttributeValueType"
        constraints:
          $ref: "#/components/schemas/CommerceAttributeConstraints"
        appliesTo:
          type: string
          enum:
            - product
            - variant
            - both
        isSearchable:
          type: boolean
          description: Matched by the free-text `q` (text and enum types only).
        isFilterable:
          type: boolean
          description: May be used in an `attr=` filter.
        visibleAdmin:
          type: boolean
        visiblePublic:
          type: boolean
          description: Exposed on the catalog API and usable in its filters (needs isFilterable for filtering).
        sortOrder:
          type: integer
          minimum: 0
          maximum: 10000
    CommerceAttributeDefinitionInput:
      type: object
      required:
        - key
        - label
        - valueType
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,62}$"
        label:
          type: string
          maxLength: 100
        labels:
          type: object
          additionalProperties:
            type: string
        valueType:
          $ref: "#/components/schemas/CommerceAttributeValueType"
        constraints:
          $ref: "#/components/schemas/CommerceAttributeConstraints"
        appliesTo:
          type: string
          enum:
            - product
            - variant
            - both
          default: product
        isSearchable:
          type: boolean
          default: false
        isFilterable:
          type: boolean
          default: false
        visibleAdmin:
          type: boolean
          default: true
        visiblePublic:
          type: boolean
          default: false
        sortOrder:
          type: integer
          default: 0
    CommerceAttributeAssignments:
      type: object
      required:
        - attributes
      properties:
        attributes:
          type: object
          description: "`{ <key>: <value> | null }`. A value sets the attribute, `null` clears it, an absent key is untouched. Values are parsed with the typed grammar; one invalid entry rejects the whole request."
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"
    CommerceCatalogImportReport:
      type: object
      description: "Issue #291. The per-row report of a catalog CSV import. A dry-run and the apply of the same file produce the same `summary` and per-row `action`s."
      properties:
        mode:
          type: string
          enum:
            - dry_run
            - apply
        valid:
          type: boolean
          description: True when nothing blocks an apply (no fatal error, no row error).
        fileSha256:
          type: string
          description: SHA-256 of the uploaded bytes; send it back as `expectedSha256` to apply exactly the file that was reviewed.
        rowCount:
          type: integer
        summary:
          type: object
          properties:
            create:
              type: integer
            update:
              type: integer
            unchanged:
              type: integer
            error:
              type: integer
        fatalErrors:
          type: array
          description: File-level problems (unparsable CSV, bad header). When present, `rows` is empty.
          items:
            type: object
            required:
              - message
            properties:
              line:
                type: integer
              column:
                type: string
              message:
                type: string
        rows:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
                description: 1-based data-row number (the first record after the header is row 1).
              line:
                type: integer
                description: 1-based physical line in the file.
              sku:
                type: string
                nullable: true
              action:
                type: string
                enum:
                  - create
                  - update
                  - unchanged
                  - error
              errors:
                type: array
                items:
                  type: object
                  properties:
                    column:
                      type: string
                    message:
                      type: string
        rowsTruncated:
          type: boolean
          description: True when the file has more than 1000 rows and `rows` lists only the rows with errors (the counts in `summary` still cover every row).
        batchId:
          type: string
          format: uuid
          description: Set only on a successful apply.
