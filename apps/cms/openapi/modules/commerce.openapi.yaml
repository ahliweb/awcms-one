  /api/v1/commerce/conversations/{id}:
    get:
      operationId: getCommerceConversation
      tags:
        - Commerce
      summary: "Issue #111 (contract #106 D8). One conversation with its messages, oldest first. Marks the thread read for the STORE. Gated on `commerce.conversations.read`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The conversation and its messages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      conversation:
                        $ref: "#/components/schemas/CommerceConversation"
                      messages:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommerceConversationMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCommerceConversation
      tags:
        - Commerce
      summary: "Issue #111 (contract #106 D8). Explicit close/reopen by staff (a store REPLY also implicitly reopens a closed thread — this is the explicit path with no message attached). Gated on `commerce.conversations.update`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - open
                    - closed
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      conversation:
                        $ref: "#/components/schemas/CommerceConversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/commerce/conversations/{id}/messages:
    post:
      operationId: createCommerceConversationMessage
      tags:
        - Commerce
      summary: "Issue #111 (contract #106 D8). Staff reply — implicitly reopens a closed conversation. Enqueues one `derived.commerce_conversation_reply` e-mail through the existing `email` module outbox (no new delivery channel), auto-seeding its template on first miss. `Idempotency-Key` header required (high-risk mutation). Gated on `commerce.conversations.update`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 4000
      responses:
        "201":
          description: Message added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      message:
                        $ref: "#/components/schemas/CommerceConversationMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: IDEMPOTENCY_CONFLICT — the Idempotency-Key was already used with a different request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/campaigns:
    get:
      operationId: listCommerceCampaigns
      tags:
        - Commerce
      summary: "Issue #114 (contract #106 ADR-0017 D9). Staff list of campaigns, newest first. Gated on `commerce.campaigns.read`."
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: One page of campaigns.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommerceCampaign"
                      nextCursor:
                        type: string
                        nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createCommerceCampaign
      tags:
        - Commerce
      summary: "Issue #114 (contract #106 ADR-0017 D9). Create a `draft` campaign. Gated on `commerce.campaigns.update`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel
                - audience
                - body
              properties:
                channel:
                  type: string
                  enum:
                    - email
                    - whatsapp
                audience:
                  type: object
                  properties:
                    levels:
                      type: array
                      items:
                        type: integer
                    hasAccount:
                      type: boolean
                      nullable: true
                    lastOrderSince:
                      type: string
                      format: date-time
                      nullable: true
                subject:
                  type: string
                  nullable: true
                  description: Required for `channel:"email"`; ignored (optional) for `channel:"whatsapp"`.
                body:
                  type: string
      responses:
        "201":
          description: "Campaign created, `status: draft`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceCampaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/commerce/campaigns/{id}:
    get:
      operationId: getCommerceCampaign
      tags:
        - Commerce
      summary: "Issue #114 (contract #106 ADR-0017 D9). One campaign. Gated on `commerce.campaigns.read`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The campaign.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceCampaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCommerceCampaign
      tags:
        - Commerce
      summary: "Issue #114 (contract #106 ADR-0017 D9). Edit a campaign still in `draft`. Gated on `commerce.campaigns.update`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                audience:
                  type: object
                subject:
                  type: string
                body:
                  type: string
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceCampaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "CAMPAIGN_NOT_EDITABLE — not `draft`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/campaigns/{id}/preview:
    post:
      operationId: previewCommerceCampaign
      tags:
        - Commerce
      summary: "Issue #114 (contract #106 ADR-0017 D9). Resolve the audience filter into a recipient COUNT, without sending anything. Gated on `commerce.campaigns.read`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The audience count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      recipientCount:
                        type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/commerce/campaigns/{id}/send:
    post:
      operationId: sendCommerceCampaign
      tags:
        - Commerce
      summary: "Issue #114 (contract #106 ADR-0017 D9). Moves the campaign to `scheduled` (scheduled_at = now); the `commerce:campaigns:dispatch` job then resolves the audience, creates one `awcms_commerce_campaign_recipients` row per recipient, and fans the rows out into the e-mail/WhatsApp outboxes. Gated on `commerce.campaigns.send`; `Idempotency-Key` required."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Campaign moved to `sending` (or `sent`, once every recipient row is dispatched)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceCampaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "CAMPAIGN_NOT_SENDABLE — not `draft`/`scheduled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/campaigns/{id}/cancel:
    post:
      operationId: cancelCommerceCampaign
      tags:
        - Commerce
      summary: "Issue #114 (contract #106 ADR-0017 D9). Cancel a campaign before (or while) it sends; already-dispatched recipient rows are not un-sent. Gated on `commerce.campaigns.send`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Campaign moved to `cancelled`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceCampaign"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "CAMPAIGN_ALREADY_FINAL — already `sent`/`cancelled`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/webhook-endpoints:
    get:
      operationId: listCommerceWebhookEndpoints
      tags:
        - Commerce
      summary: "Issue #106 (ADR-0017 D2/D3; implemented by #110). Staff list of this tenant's inbound webhook endpoints — the token itself is NEVER re-shown after creation. Gated on `commerce.webhook_endpoints.update`."
      responses:
        "200":
          description: The endpoints.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommerceWebhookEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createCommerceWebhookEndpoint
      tags:
        - Commerce
      summary: "Issue #106 (ADR-0017 D2/D3; implemented by #110). Mint a new opaque endpoint token for a provider. The RAW token is returned exactly once, in this response, and never again — only its hash is stored (`awcms_commerce_webhook_endpoints`, D2). Gated on `commerce.webhook_endpoints.update`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider
              properties:
                provider:
                  type: string
                  enum:
                    - midtrans
                label:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Endpoint created; `data.token` is shown exactly once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    allOf:
                      - $ref: "#/components/schemas/CommerceWebhookEndpoint"
                      - type: object
                        properties:
                          token:
                            type: string
                            description: "The RAW token — embed it in the webhook URL configured at the provider. Never retrievable again after this response."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/commerce/webhook-endpoints/{id}:
    delete:
      operationId: deleteCommerceWebhookEndpoint
      tags:
        - Commerce
      summary: "Issue #106 (ADR-0017 D2/D3; implemented by #110). Revoke a webhook endpoint token — the fastest available rotation path if a URL leaks. Gated on `commerce.webhook_endpoints.update`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Revoked. Idempotent — revoking an already-revoked endpoint still answers 200 with the same row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      endpoint:
                        $ref: "#/components/schemas/CommerceWebhookEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/commerce/webhooks/{provider}/{endpointToken}:
    post:
      operationId: receiveCommercePaymentWebhook
      tags:
        - Commerce
      summary: "Issue #106 (ADR-0017 D2/D3; not yet implemented, lands in #113). Public inbound payment-gateway callback. Tenant resolved from `endpointToken` via a SECURITY DEFINER bootstrap function; the provider's own signature is verified timing-safe before anything else happens."
      description: >-
        Anonymous by definition — a provider callback carries no session.
        Replay-protected by a UNIQUE `(tenant_id, provider, event_key)`
        constraint on `awcms_commerce_payment_events`: a duplicate or replayed
        event is deduplicated and still answers `200`, exactly like a freshly
        verified one, so the provider's own retry behaviour never needs
        special-casing. A verified `paid` event calls `markOrderPaidBySystem`
        (the new `system` edge on `pending_payment -> paid`, `order-status.ts`).
        Body size is bounded; an oversized or malformed body is rejected
        before signature verification runs.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - midtrans
        - name: endpointToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "Always, for a verified event — new, deduplicated, or replayed alike."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
        "401":
          description: Bad or missing provider signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Unknown `endpointToken`, or a `provider` value the token was not minted for."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
