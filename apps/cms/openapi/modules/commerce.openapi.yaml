                $ref: "#/components/schemas/ApiError"
        "502":
          description: "`PROVIDER_ERROR` — media storage is not configured."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/expenses/summary:
    get:
      operationId: getCommerceExpenseSummary
      tags:
        - Commerce
      summary: "Issue #294 (ADR-0031). The expense summary of a date range: posted and reversed totals by category and tender, plus draft / pending counts. Gated on `commerce.expenses.read`."
      description: >-
        Only POSTED expenses count as spent; REVERSED ones are reported beside
        them (never netted away); drafts and pending approvals are counted but
        belong to no total. All sums are exact `numeric(14,2)` strings (integer
        cents). `from` and `to` are required and the range spans at most 366
        days.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: "The summary."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceExpenseSummary"
        "400":
          description: "`VALIDATION_ERROR` (a missing, malformed, inverted or over-long range)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`FEATURE_DISABLED` — the `expenses` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/expenses/export.csv:
    get:
      operationId: exportCommerceExpensesCsv
      tags:
        - Commerce
      summary: "Issue #294 (ADR-0031). The expenses of a date range as CSV. Gated on `commerce.expenses.export` — the high-risk `export` verb; reading expenses grants none."
      description: >-
        Every cell is spreadsheet-formula-neutralised (a leading `=`, `+`, `-`,
        `@`, tab or carriage return is prefixed with `'`; a strictly numeric
        amount keeps its sign). No receipt URL, media key or customer datum
        appears. Bounded: at most 366 days and 10,000 rows; `X-Export-Truncated:
        true` says a longer range was cut, never silently. `Cache-Control:
        no-store`.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The CSV.
          headers:
            X-Export-Truncated:
              schema:
                type: string
                enum:
                  - "true"
                  - "false"
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: "`VALIDATION_ERROR` (a missing, malformed, inverted or over-long range)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`FEATURE_DISABLED` — the `expenses` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/document-deliveries:
    get:
      operationId: listCommerceDocumentDeliveries
      tags:
        - Commerce
      summary: "Issue #295 (ADR-0034). The delivery history of one receipt, invoice, quotation or work order, newest first. Gated on `commerce.document_deliveries.read`."
      description: "Each entry is the append-only REQUEST (who asked, which immutable source, which channel, the MASKED recipient, the template version, the content hash) joined with the live state of the existing e-mail or WhatsApp outbox row it produced (`outbox`: status, provider message id, retry count, last error) - read, never copied, so it cannot drift. For `targetType: quotation_version` the `targetId` is the quotation's id and the history spans every version. An unknown id and another tenant's id are the same empty list. Needs the `documents` and `documentDelivery` features."
      parameters:
        - name: targetType
          in: query
          required: true
          schema:
            type: string
            enum:
              - document
              - quotation_version
              - work_order
        - name: targetId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The history, newest first (at most 50 entries).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommerceDocumentDelivery"
        "400":
          description: "`VALIDATION_ERROR` (missing or malformed `targetType` / `targetId`)."
          content: *id001
        "401": *id002
        "403": *id003
        "409":
          description: "`FEATURE_DISABLED` - the tenant's `documents` or `documentDelivery` feature is off (`documentDelivery` defaults OFF)."
          content: *id001
    post:
      operationId: requestCommerceDocumentDelivery
      tags:
        - Commerce
      summary: "Issue #295 (ADR-0034). Requests delivery of a receipt, invoice, quotation version or work-order notice by e-mail or WhatsApp. Gated on `commerce.document_deliveries.create`; requires `Idempotency-Key`."
      description: "Transactional, not marketing: the message is built from the STORED source only (a document's snapshot after its SHA-256 is re-verified, a quotation version row, a work order read at the request) and enqueued into the channel's EXISTING outbox in this transaction; a dispatcher calls the provider later. The default recipient is the customer the source names; any other recipient needs `commerce.document_delivery_overrides.create` (checked before the source is read). A replay of the same `Idempotency-Key` returns the stored result and enqueues nothing; a NEW key is an explicit re-send (`resendOfId` names the delivery it repeats). `includeLink` (documents only) adds an opaque private link valid for `linkTtlHours` (default 72, at most 168) - only its SHA-256 is stored and it is never returned. At most 5 requests per source per rolling hour (`429 DELIVERY_RATE_LIMITED`). Emits `awcms.commerce.document.delivery_requested`; audited as `document_delivery.request` / `document_delivery.denied`."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - targetType
                - targetId
                - channel
              properties:
                targetType:
                  type: string
                  enum:
                    - document
                    - quotation_version
                    - work_order
                targetId:
                  type: string
                  format: uuid
                  description: A document id, a quotation id (with `version`) or a work-order id.
                version:
                  type: integer
                  minimum: 1
                  description: "`quotation_version` only; defaults to the current version."
                channel:
                  type: string
                  enum:
                    - email
                    - whatsapp
                locale:
                  type: string
                  enum:
                    - id
                    - en
                  default: id
                recipient:
                  type: string
                  description: "An address (`email`) or number (`whatsapp`) other than the customer on file. Needs `commerce.document_delivery_overrides.create`."
                includeLink:
                  type: boolean
                  default: false
                linkTtlHours:
                  type: integer
                  minimum: 1
                  maximum: 168
                  default: 72
      responses:
        "201":
          description: The delivery request (or the stored replay). `outbox.status` is `queued` until a dispatcher moves it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceDocumentDelivery"
        "400":
          description: "`VALIDATION_ERROR` or `IDEMPOTENCY_REQUIRED`."
          content: *id001
        "401": *id002
        "403":
          description: "`ACCESS_DENIED` - the caller lacks `commerce.document_deliveries.create`, or named a recipient without `commerce.document_delivery_overrides.create`."
          content: *id001
        "404": *id008
        "409":
          description: "`CHANNEL_UNAVAILABLE` (the channel is not enabled on this deployment), `RECIPIENT_UNAVAILABLE` (the source names no usable recipient for the channel), `RECIPIENT_SUPPRESSED` or `TEMPLATE_UNAVAILABLE` (`details` is the recorded, not-enqueued delivery), `SOURCE_NOT_DELIVERABLE` (a cancelled quotation), `DOCUMENT_INTEGRITY_FAILURE`, `IDEMPOTENCY_CONFLICT` or `FEATURE_DISABLED`."
          content: *id001
        "429":
          description: "`DELIVERY_RATE_LIMITED` - too many requests for this source in the rolling window; `Retry-After` is in seconds."
          content: *id001
  /api/v1/commerce/storefront/document-links/{token}:
    get:
      operationId: openCommerceDocumentLink
      tags:
        - Commerce
      summary: "Issue #295 (ADR-0034 D6). Anonymous: opens the print page of a receipt or invoice through the opaque private link a delivery carried."
      description: "The token IS the credential: 32 random bytes with a `dl_` prefix, only its SHA-256 stored, a hard expiry of at most 168 hours. The page is the stored snapshot rendered (hash re-verified), served `no-store` under a locked-down CSP. An unknown, malformed or other-tenant token and a disabled feature are the same neutral `404`; a known token past its expiry is `410 LINK_EXPIRED`. Every open (and every expired open) is audited without an actor or recipient."
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The document's print page.
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: "`LINK_EXPIRED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/barcodes:
    get:
      operationId: listCommerceBarcodes
      tags:
        - Commerce
      summary: "Issue #292 (ADR-0032). Pages the products (without variants) and variants of the tenant with their barcode. Gated on `commerce.barcodes.read`."
      description: "Name-ordered, offset-paginated (an operator screen, not a hot path). `q` matches name/SKU by substring (LIKE metacharacters are literal) or a barcode exactly; `barcode=with|without` narrows to rows that do or do not carry one. Gated on the `barcode` feature."
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: barcode
          in: query
          required: false
          schema:
            type: string
            enum:
              - with
              - without
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of catalogue rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommerceBarcodeRow"
                      page:
                        type: integer
                      hasMore:
                        type: boolean
        "400":
          description: "`VALIDATION_ERROR` (q too long, unknown barcode filter, malformed page)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`FEATURE_DISABLED` - the tenant's `barcode` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: assignCommerceBarcode
      tags:
        - Commerce
      summary: "Issue #292 (ADR-0032). Sets or clears the barcode of one product or variant. Gated on `commerce.barcodes.update`."
      description: "`barcode` is required: a string to set, `null` to clear. A code is 1-48 printable ASCII characters without spaces; an all-digit code of 8, 12, 13 or 14 digits is a GTIN and needs a valid GS1 check digit; it may not start with a quantity prefix like `3*`. Unique per tenant among live products AND variants. Naturally idempotent (it sets state), so no `Idempotency-Key`. A variant id must belong to the named product. Audited as `update` on `product` / `product_variant`. Gated on the `barcode` feature."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - barcode
              properties:
                productId:
                  type: string
                  format: uuid
                variantId:
                  type: string
                  format: uuid
                  nullable: true
                barcode:
                  type: string
                  nullable: true
                  minLength: 1
                  maxLength: 48
      responses:
        "200":
          description: The updated catalogue row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceBarcodeRow"
        "400":
          description: "`VALIDATION_ERROR` (malformed id, invalid barcode, bad GTIN check digit, missing `barcode` key)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: An unknown id, another tenant's id and a variant that does not belong to the named product - one neutral answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "`BARCODE_DUPLICATE` (already used by another live product or variant of the tenant) or `FEATURE_DISABLED` - the tenant's `barcode` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/barcodes/lookup:
    get:
      operationId: lookupCommerceBarcode
      tags:
        - Commerce
      summary: "Issue #292 (ADR-0032). Resolves a scanned barcode to the ONE product or variant it names in the caller's tenant. Gated on `commerce.barcodes.read`."
      description: "An equality probe on the tenant's partial unique barcode index. A barcode is an identifier, not a credential: the caller is authorised first, and an unknown, soft-deleted and other-tenant code answer the same neutral `404`. `requiresVariant` is true for the bare parent of a product that has live variants; `sellable` is true only for an active, in-stock, variant-free row. Gated on the `barcode` feature."
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 48
      responses:
        "200":
          description: The matching catalogue row with its sellability.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceBarcodeLookup"
        "400":
          description: "`VALIDATION_ERROR` (missing, over-long or non-printable code)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`FEATURE_DISABLED` - the tenant's `barcode` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/inventory:
    get:
      operationId: getCommerceInventoryMode
      tags:
        - Commerce
      summary: "Issue #282 (ADR-0038). Which stock authority the store runs on: `counter` or `ledger`, and the sales location the ledger is posted at. Gated on `commerce.inventory.read`."
      description: >-
        `counter` (the default) is the single stock count on each product or
        variant. `ledger` means the upstream inventory ledger is authoritative
        and `stock` is a write-through cache of it. The flip to `ledger` is the
        operator command `bun run commerce:inventory:cutover`; the way back is
        `POST /api/v1/commerce/inventory/rollback`.
      responses:
        "200":
          description: The mode.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceInventoryMode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/commerce/inventory/items:
    get:
      operationId: lookupCommerceInventoryItems
      tags:
        - Commerce
      summary: "Issue #283 (ADR-0038 addendum). Resolves a SKU or name to the ledger reference a procurement line must carry. Gated on `commerce.inventory.read`."
      description: >-
        Lists the live stock units - a live variant (`commerce.variant`) or a
        live product with no live variant (`commerce.product`) - with the exact
        `itemType`, `itemRef` and `unitCode` to put on a procurement document
        line. A product that has live variants is not a stock unit and is not
        listed. Keyset-paged, at most 50 per page. Works in either stock mode.
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive contains-match on SKU, product name or variant value.
          schema:
            type: string
            maxLength: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 300
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: One page of stock units.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceInventoryItemPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/commerce/inventory/reconciliation:
    get:
      operationId: reconcileCommerceInventory
      tags:
        - Commerce
      summary: "Issue #282 (ADR-0038). The stock units whose cache disagrees with the inventory ledger at the sales location. Gated on `commerce.inventory.read`."
      description: >-
        Compares, per stock unit (a live variant, or a live product with no live
        variant), the `stock` column with `max(0, floor(ledger on-hand))`. One
        keyset page per call; follow `nextCursor` until it is null. Nothing is
        repaired. `409 NOT_LEDGER_MODE` for a store still on the counter.

        The FIRST page (no `cursor`) also carries `orphans` (Issue #283): the
        non-zero `commerce.*` ledger balances at the sales location that name no
        live stock unit - a procurement receipt posted for a variant that does
        not exist, for a product that has variants, under another unit code, or
        under an unknown `commerce.*` item type. Capped at 100 with `truncated`.
        Continuation pages return `orphans: null`.
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 300
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: One page of drift.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceInventoryReconciliationReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`NOT_LEDGER_MODE` - the store still runs on the commerce counter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/inventory/resync:
    post:
      operationId: resyncCommerceInventory
      tags:
        - Commerce
      summary: "Issue #282 (ADR-0038). Rewrites the stock cache of every drifted unit on one page from the inventory ledger. Gated on `commerce.inventory.configure` (high-risk)."
      description: >-
        The ledger is always the truth: only the cache is rewritten, and the
        body can never carry a stock count (only `cursor` and `limit`, to page).
        Naturally idempotent - it sets state - so it carries no
        `Idempotency-Key`. Audited as a warning. Repeat with `nextCursor` until
        it is null. `409 NOT_LEDGER_MODE` for a store still on the counter.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cursor:
                  type: string
                  maxLength: 300
                limit:
                  type: integer
                  minimum: 1
                  maximum: 500
      responses:
        "200":
          description: The page that was scanned and how many units were repaired.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceInventoryResync"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`NOT_LEDGER_MODE` - the store still runs on the commerce counter."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/inventory/rollback:
    post:
      operationId: rollbackCommerceInventory
      tags:
        - Commerce
      summary: "Issue #282 (ADR-0038). Puts the stock authority back on the commerce counter. Gated on `commerce.inventory.configure` (high-risk)."
      description: >-
        No body. Waits for every in-flight stock write, then sets the mode to
        `counter`; the cache already holds the last ledger-derived counts, so the
        counter paths resume from them. Naturally idempotent: a store already on
        the counter answers `changed: false`. Audited as a warning. There is no
        matching "switch to ledger" endpoint - that flip needs the opening
        movements posted in the same transaction (`bun run
        commerce:inventory:cutover`).
      responses:
        "200":
          description: Whether the mode changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - changed
                    properties:
                      changed:
                        type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/commerce/orders/{id}/returns:
    get:
      operationId: listCommerceOrderReturns
      tags:
        - Commerce
      summary: "Issue #287 (ADR-0033). The returns and exchanges recorded against one order, with their lines, refund legs and compensations. Gated on `commerce.returns.read` and the tenant's `returns` feature."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "The returns, oldest first."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      returns:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommerceReturn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`FEATURE_DISABLED` - the tenant's `returns` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createCommerceReturn
      tags:
        - Commerce
      summary: "Issue #287 (ADR-0033). Records goods accepted back against an order - a return or an exchange - and, optionally, its refund. Gated on `commerce.returns.create` (plus `commerce.refunds.create` and `commerce.payments.revoke` when `refund` is given) and the tenant's `returns` feature; requires `Idempotency-Key`."
      description: >-
        Quantities are bounded by what remains eligible per order line, under
        the order-row lock with a database trigger as the second guard. Value
        is exact to the cent (several partial returns of a line add up to the
        line). `restock` lines go back into sellable stock through the
        inventory port; `damaged` and `quarantine` are recorded and change no
        sellable stock. With `refund`, the money is planned back along the
        original payments newest first, each capped at what it can still give
        back, and every leg that can settle now (cash, a manual refund, a gift
        card, store credit) is settled in the same transaction; a gateway leg
        is left `pending` for `.../refunds/{refundId}/execute`. Finalised
        order history is never edited: only rows are added. A refusal writes
        nothing. The `storeCredit.code` of a newly issued store credit is shown
        ONLY in the response of the request that issued it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lines
              properties:
                kind:
                  type: string
                  enum:
                    - return
                    - exchange
                  default: return
                note:
                  type: string
                  nullable: true
                  maxLength: 500
                exchangeOrderId:
                  type: string
                  format: uuid
                  nullable: true
                  description: "`exchange` only: an existing replacement order (or link it later)."
                lines:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required:
                      - orderItemId
                      - quantity
                      - reason
                      - disposition
                    properties:
                      orderItemId:
                        type: string
                        format: uuid
                      quantity:
                        type: integer
                        minimum: 1
                      reason:
                        type: string
                        enum:
                          - defective
                          - wrong_item
                          - not_as_described
                          - damaged_in_transit
                          - changed_mind
                          - size_fit
                          - duplicate_order
                          - other
                      disposition:
                        type: string
                        enum:
                          - restock
                          - damaged
                          - quarantine
                      note:
                        type: string
                        nullable: true
                        maxLength: 500
                refund:
                  type: object
                  nullable: true
                  description: "`null` = record the return and the stock effect only; no refund leg is made (add them later with `POST /returns/{id}/refunds`)."
                  properties:
                    destination:
                      type: string
                      enum:
                        - original_tender
                        - store_credit
                      default: original_tender
                      description: "A leg on a gift card / store credit payment always goes back to its own account."
                    shippingRefund:
                      type: string
                      nullable: true
                      description: "`numeric(14,2)` string; at most the shipping that was charged."
                    registerSessionId:
                      type: string
                      format: uuid
                      nullable: true
                      description: "Cash legs only: the OPEN register session of the caller the cash is paid out of (ADR-0028 D2)."
                    storeCreditAccountId:
                      type: string
                      format: uuid
                      nullable: true
                      description: "`store_credit` only: an existing account to load; omitted issues one new account."
      responses:
        "201":
          description: "The return (or the stored replay) and the store credit it issued."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceReturnMutation"
        "400":
          description: "`VALIDATION_ERROR` or `IDEMPOTENCY_REQUIRED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`ORDER_NOT_RETURNABLE`, `RETURN_QUANTITY_EXCEEDED` (details: `orderItemId`, `requested`, `remaining`), `SHIPPING_REFUND_EXCEEDED`, `EXCHANGE_ORDER_INVALID`, `REFUND_EXCEEDS_REFUNDABLE`, `REFUND_NOT_REFUNDABLE`, `PAYMENT_NOT_REVERSIBLE`, `REGISTER_SESSION_NOT_OPEN`, `NOT_SESSION_CASHIER`, `STORE_CREDIT_UNAVAILABLE`, `IDEMPOTENCY_CONFLICT` or `FEATURE_DISABLED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/returns:
