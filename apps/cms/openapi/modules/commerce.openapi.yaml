        - name: to
          in: query
          required: false
          description: Exclusive upper bound for an instant; a bare `YYYY-MM-DD` day means through the end of that day (UTC).
          schema:
            type: string
      responses:
        "200":
          description: The loyalty summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/LoyaltySummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: FEATURE_DISABLED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/orders/{id}/payment-gateway/reconcile:
    post:
      operationId: reconcileCommerceOrderPaymentGateway
      tags:
        - Commerce
      summary: 'Issue #113 (contract #106''s D2). The order detail admin screen''s "Cek status" action — a SCOPED, single-order reconcile (never the full `commerce:payments:reconcile` batch). Gated on `commerce.orders.update`; `Idempotency-Key` required.'
      description: >-
        Calls `provider.fetchStatus` for this order's most recent
        payment-gateway session, outside any open database transaction, and
        applies the same `markOrderPaidBySystem`/`expireOrderBySystem`
        transition path the webhook route and the reconcile job use.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Checked (the session may or may not have changed status).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      status:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: NO_PAYMENT_SESSION — this order has no gateway payment session at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: GATEWAY_UNAVAILABLE — no payment-gateway provider is configured for this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/orders/{id}/payment-confirmations/{cid}/review:
    patch:
      operationId: reviewCommerceOrderPaymentConfirmation
      tags:
        - Commerce
      summary: "Admin accept/reject of a submitted payment confirmation (Issue 29). Accepting records the confirmed amount as a payment-allocation ledger leg (Issue #285 — `manual_qris`/`manual_bank_transfer`, capped at the outstanding balance, idempotent on `confirmation:{id}`); the order moves to paid when settlement reaches its total (for a down-payment order, its down payment), not merely because a confirmation was accepted. Gated on orders.update."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum:
                    - accepted
                    - rejected
      responses:
        "200":
          description: Reviewed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      decision:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  # --- Issue #285 (ADR-0025) — payment-allocation ledger. ----------------------
  /api/v1/commerce/orders/{id}/payments:
    get:
      operationId: listCommerceOrderPayments
      tags:
        - Commerce
      summary: "Issue #285 (ADR-0025). The order's payment-allocation ledger: the derived settlement (total, paid, reversed, settled, outstanding, overpaid, cached payment status) and every ledger row, oldest first. Gated on `commerce.payments.read`. An unknown order and another tenant's order are the same 404."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The order's settlement and ledger.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      orderId:
                        type: string
                        format: uuid
                      orderCode:
                        type: string
                      orderStatus:
                        type: string
                      settlement:
                        $ref: "#/components/schemas/CommerceSettlement"
                      payments:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommercePaymentAllocation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: recordCommerceOrderPayment
      tags:
        - Commerce
      summary: "Issue #285 (ADR-0025). Records one `succeeded` tender (`cash`, `manual_qris`, `manual_bank_transfer`) against an order. Gated on `commerce.payments.create`; requires `Idempotency-Key`."
      description: >-
        The order row is locked for the write, so two concurrent final
        payments cannot over-settle it: the second waits, then fails with
        `409 OVERPAYMENT`. Overpayment is rejected for every tender — only a
        `cash` leg may exceed what is owed, and only as change. For `cash`,
        `amount` is what the customer HANDED OVER; the amount applied
        (`min(handed, outstanding)`) and the change are derived server-side
        from the cash leg alone. The leg that brings settlement to the
        order's release threshold (the total; for a down-payment order, its
        down payment) moves a `pending_payment` order to `paid` through the
        order-status machine, firing the usual `order.paid` events. A `gateway`
        leg cannot be recorded here — only the hosted-checkout flow creates
        one. Same key + same body replays the stored 201; same key + a different
        body (or a different staff member, or another order) is
        `409 IDEMPOTENCY_CONFLICT`. Emits `awcms.commerce.payment.recorded`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenderType
                - amount
              properties:
                tenderType:
                  type: string
                  enum:
                    - cash
                    - manual_qris
                    - manual_bank_transfer
                    - gift_card
                    - store_credit
                storedValueCode:
                  type: string
                  maxLength: 64
                  description: "Required for `gift_card` / `store_credit` (Issue #288, ADR-0030), forbidden otherwise: the plaintext code of the account to draw from (separators and case are ignored; the check character is verified). It is resolved to an account and discarded — never stored, logged, audited or echoed (the response shows only the masked code). Needs the tenant's `storedValue` feature (`409 FEATURE_DISABLED`)."
                amount:
                  type: string
                  description: "`numeric(14,2)` string, > 0, never a JSON number. For `cash`, the amount handed over."
                reference:
                  type: string
                  nullable: true
                  maxLength: 100
                  description: A bank/QRIS reference for the operator's own reconciliation. Never echoed in audit events or domain events.
                note:
                  type: string
                  nullable: true
                  maxLength: 500
      responses:
        "201":
          description: Recorded (or replayed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommercePaymentMutation"
        "400":
          description: "`VALIDATION_ERROR` or `IDEMPOTENCY_REQUIRED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`IDEMPOTENCY_CONFLICT` (also a key reused against another order or with a different tender/amount), `OVERPAYMENT` (the amount exceeds what is still owed — `details.outstanding`/`details.attempted`), `ORDER_NOT_PAYABLE` (a cancelled or expired order) or `REGISTER_SESSION_CLOSING` (Issue #284: the POS sale's register session is counting/awaiting a supervisor, so the money would fall into no cash-up — retry once the close is decided)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/orders/{id}/payments/{paymentId}/reversals:
    post:
      operationId: reverseCommerceOrderPayment
      tags:
        - Commerce
      summary: "Issue #285 (ADR-0025). Records a compensating reversal of (part of) a succeeded payment — the ledger is append-only, so a refund or a corrected entry is a NEW row, never an edit. Gated on `commerce.payments.revoke` (the platform's high-risk verb); requires `Idempotency-Key`."
      description: >-
        `amount` omitted reverses whatever remains reversible of the payment;
        the sum of a payment's reversals can never exceed the payment
        (`409 REVERSAL_EXCEEDS_PAYMENT`, checked under the order-row lock). The
        reversal lowers the settlement and the derived `paymentStatus`
        (`paid -> partially_paid`, or `refunded` once everything went back) but
        NEVER moves the order lifecycle (`status`) — cancelling fulfilment is a
        human decision. The row records the book-keeping fact only: no provider
        is called and no money moves; returning it is the operator's act. `note`
        (the reason) is required. The payment and the order are resolved tenant-
        and order-scoped: another tenant's order, an unknown payment and a payment
        of a different order are the same 404. Emits
        `awcms.commerce.payment.reversed`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - note
              properties:
                amount:
                  type: string
                  nullable: true
                  description: "`numeric(14,2)` string, > 0. Omitted/null = the full remaining reversible amount."
                note:
                  type: string
                  maxLength: 500
                  description: The reason for the reversal (required).
                registerSessionId:
                  type: string
                  format: uuid
                  nullable: true
                  description: "Issue #284 (ADR-0028 D2). The OPEN register session of the tenant, whose current cashier is the caller, that the refund is paid out of. The reversal leg is stamped with it, so THAT drawer's expected cash drops (a cash refund for a sale from an earlier, closed shift would otherwise lower no cash-up). Omitted = unchanged behaviour: the leg is stamped only with its own order's session while that is still open."
      responses:
        "201":
          description: Recorded (or replayed). `data.payment` is the new reversal row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommercePaymentMutation"
        "400":
          description: "`VALIDATION_ERROR` or `IDEMPOTENCY_REQUIRED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`IDEMPOTENCY_CONFLICT` (also a key reused against another order, or with a different amount), `REVERSAL_EXCEEDS_PAYMENT` (`details.reversible`), `PAYMENT_NOT_REVERSIBLE` (`details.reason`: `not_a_payment`, `not_succeeded`, `fully_reversed`; Issue #288: `stored_value_refund_not_allowed` — the program does not allow a refund back onto the card, there is no cash alternative — or `stored_value_account_unavailable` — the card is disabled, expired or gone), `REGISTER_SESSION_NOT_OPEN` (`details.status`) or `NOT_SESSION_CASHIER` for a `registerSessionId` that is not an open session of the caller. An unknown or other-tenant `registerSessionId` is `404`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/registers:
    get:
      operationId: listCommerceRegisters
      tags:
        - Commerce
      summary: "Issue #284 (ADR-0028). The tenant's POS registers (code, name, optional location label, active flag), each with its live (open/closing) session if any. Gated on `commerce.registers.read` and the tenant's `register` feature."
      parameters:
        - name: includeInactive
          in: query
          required: false
          description: "`false` hides deactivated registers; anything else (the default) lists them."
          schema:
            type: string
            enum:
              - "true"
              - "false"
      responses:
        "200":
          description: The registers, active first then by code (limit 200).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommerceRegister"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`FEATURE_DISABLED` — the tenant's `register` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createCommerceRegister
      tags:
        - Commerce
      summary: "Issue #284 (ADR-0028). Defines a POS register. Gated on `commerce.registers.create`; `code` is unique per tenant, case-insensitively."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - name
              properties:
                code:
                  type: string
                  maxLength: 40
                  description: Letters, digits, `.`, `_`, `-`; starts with a letter or digit. Never changes after creation.
                name:
                  type: string
                  maxLength: 120
                locationLabel:
                  type: string
                  nullable: true
                  maxLength: 120
      responses:
        "201":
          description: The new register.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceRegister"
        "400":
          description: "`VALIDATION_ERROR`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`REGISTER_CODE_TAKEN` or `FEATURE_DISABLED` — the tenant's `register` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/registers/{id}:
    get:
      operationId: getCommerceRegister
      tags:
        - Commerce
      summary: "Issue #284 (ADR-0028). One register. Gated on `commerce.registers.read`. An unknown id and another tenant's id are the same 404."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The register.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceRegister"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`FEATURE_DISABLED` — the tenant's `register` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateCommerceRegister
      tags:
        - Commerce
