          type: string
          nullable: true
        faqs:
          type: array
          items:
            type: object
            properties:
              question:
                type: string
              answer:
                type: string
        social:
          type: object
          description: facebook/instagram/tiktok/x/youtube/linkedin, each a URL or null.
          additionalProperties:
            type: string
            nullable: true
        customerLevels:
          type: array
          items:
            type: object
            properties:
              level:
                type: integer
              name:
                type: string
              type:
                type: string
                enum:
                  - percentage
                  - nominal
              value:
                type: string
              active:
                type: boolean
        shipping:
          type: object
          description: alternativeServices[] {id,name,cost}, selfPickup, courierEnabled, pinpointEnabled, freeShipping {active,minOrder,maxDiscount}, originCityName, originSubdistrictName.
        payment:
          type: object
          description: manualBank {active, accounts[] {bankName, accountNumber, accountHolder}}, manualQris {active, mediaObjectId}, downPayment {active, percent}, tax {active, percent}, insurance {active, ratePercent, minFee}.
        promoSection:
          type: object
          properties:
            active:
              type: boolean
            items:
              type: array
              items:
                type: object
        meta:
          type: object
          description: home/contact, each {title, description} (nullable).
