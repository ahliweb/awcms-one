                type: string
                nullable: true
              variantName:
                type: string
                nullable: true
              sku:
                type: string
                nullable: true
              quantity:
                type: integer
              unitPrice: *id003
              lineTotal: *id003
        subtotal: *id003
        discount: *id003
        tax: *id003
        total: *id003
        customer:
          type: object
          nullable: true
          properties:
            name: *id004
            phone: *id004
        pricingContext:
          type: object
          additionalProperties: true
        notes:
          type: string
          nullable: true
        contentHash:
          type: string
