    post:
      operationId: issueCommerceStoredValueAccount
      tags:
        - Commerce
      summary: "Issue #288 (ADR-0030). Issues a gift card / store credit. Gated on `commerce.stored_value.create` and the tenant's `storedValue` feature; requires `Idempotency-Key`."
      description: >-
        Generates a CSPRNG code (20 characters from an unambiguous 32-symbol
        alphabet = 100 bits, plus one check character), stores ONLY its
        tenant-scoped hash and last four, appends the `issue` ledger entry, and
        returns the plaintext `code` ONCE, in this response. A replay (same key,
        same body) answers the same account with `code: null` and
        `codeRevealed: false`; a lost code is remedied by disabling the account
        and issuing a new one — the plaintext is never recoverable. The program
        for the kind must be enabled (`409 STORED_VALUE_PROGRAM_DISABLED`) and
        the amount within its balance ceiling (`409
        STORED_VALUE_BALANCE_CEILING`). `expiresAt` overrides the program's
        default lifetime (`null` = never). Emits
        `awcms.commerce.stored_value.entry_recorded`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kind
                - amount
              properties:
                kind:
                  type: string
                  enum:
                    - gift_card
                    - store_credit
                amount:
                  type: string
                  description: "`numeric(14,2)` string, > 0, never a JSON number."
                customerId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Optional ownership reference. Informational — the code is a bearer instrument and redemption does not require the customer.
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
                reason:
                  type: string
                  nullable: true
                  maxLength: 500
      responses:
        "201":
          description: The new account and its plaintext code (shown once), or the stored replay without the code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceStoredValueIssued"
        "400":
          description: "`VALIDATION_ERROR` or `IDEMPOTENCY_REQUIRED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`STORED_VALUE_PROGRAM_DISABLED`, `STORED_VALUE_BALANCE_CEILING` (`details.ceiling`), `IDEMPOTENCY_CONFLICT` or `FEATURE_DISABLED` — the tenant's `storedValue` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
