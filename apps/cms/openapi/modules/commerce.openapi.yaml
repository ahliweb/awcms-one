          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: "Inclusive last projection day (`YYYY-MM-DD`). Defaults to today in the report time zone."
          schema:
            type: string
            format: date
      responses:
        "200":
          description: One row per day in range, ascending.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      from:
                        type: string
                        format: date
                      to:
                        type: string
                        format: date
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommerceSalesDailyRow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
