  # --- Issue #116 (ADR-0017 D6) — POS counter sales. ------------------------
  /api/v1/commerce/pos/orders:
    get:
      operationId: listCommercePosOrders
      tags:
        - Commerce
      summary: "Issue #116 (ADR-0017 D6). POS order history — the owner order-list summary plus `paymentMethod`/`cashierTenantUserId`, filtered `channel=pos`, with optional date/cashier filters. Gated on `commerce.orders.read`; `409 FEATURE_DISABLED` when the tenant's `pos` feature is off (#118)."
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: dateFrom
          in: query
          required: false
          description: Inclusive lower bound on `createdAt`. A bare `YYYY-MM-DD` means the start of that day (UTC).
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          required: false
          description: Inclusive upper bound on `createdAt`. A bare `YYYY-MM-DD` means the end of that day (UTC).
          schema:
            type: string
            format: date-time
        - name: cashier
          in: query
          required: false
          description: A `tenant_users.id` — filters to sales rung up by this staff member (`orders.pos_cashier_tenant_user_id`).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: One page of POS orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          allOf:
                            - $ref: "#/components/schemas/CommerceOrderSummary"
                            - type: object
                              properties:
                                paymentMethod:
                                  type: string
                                  description: "Legacy summary hint — the tender with the largest applied amount (Issue #285); the ledger is the truth."
                                  enum:
                                    - cash
                                    - manual_qris
                                    - manual_bank
                                    - gateway
                                cashierTenantUserId:
                                  type: string
                                  format: uuid
                                  nullable: true
                                outstanding:
                                  type: string
                                  description: "Issue #285 — what the sale still owes, derived from its payment ledger (`0.00` for a settled sale)."
                      nextCursor:
                        type: string
                        nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`FEATURE_DISABLED` — the tenant turned the `pos` feature off (Issue #118)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createCommercePosOrder
      tags:
        - Commerce
      summary: "Issue #116 (ADR-0017 D6). Staff creates a `paid`, `self_pickup` order at the counter for a walk-in or phone-identified customer. Gated on `commerce.pos.create` — the ONLY order-creation path that needs a permission at all, since every other one is anonymous or provider-driven."
      description: >-
        Requires `Idempotency-Key`. `orders.channel` is set `pos`;
        `order_events` records the acting STAFF member (`admin`), never
        `system` and never `customer` — `pos_cashier_tenant_user_id` on the
        order row carries WHICH staff member. Payment is `cash` or
        `manual_qris` and the order is created already `paid` — there is no
        `pending_payment` step visible to the caller for a counter sale.
        `customer` is optional in full: an omitted/blank `phone` attaches the
        sale to this tenant's single WALK-IN customer row (a documented
        sentinel phone, `docs/kamus-data.md`); a given `phone` finds or
        creates a customer by that (normalised) phone, same as a storefront
        guest checkout (and prices the sale at that customer's level, #118).
        `payment.amountTendered` is REQUIRED for `cash` and ignored for
        `manual_qris`; it is a `numeric(14,2)` string, and the response's
        `change` is computed server-side, also as a string (ADR-0003 — never
        a float). The idempotency key is the HEADER only — a body field of the
        same name is ignored. Same key + same body replays the stored 201;
        same key + different body (or a different cashier) is
        `409 IDEMPOTENCY_CONFLICT`.


        ### Multi-tender (Issue #285, ADR-0025 — contract version 2)


        Send EITHER the legacy `payment` object above (unchanged — adapted to
        exactly one payment-ledger leg) OR an explicit `tenders[]` array,
        never both. Each tender is `{ tenderType: cash | manual_qris |
        manual_bank_transfer | gift_card | store_credit, amount, reference?,
        storedValueCode? }` (Issue #288: a stored-value tender carries the
        plaintext `storedValueCode`, is redeemed in the SAME transaction as the
        sale, and needs the tenant's `storedValue` feature). For a NON-cash tender
        `amount` is the amount applied to the sale; for the (at most one) `cash`
        tender it is the amount HANDED OVER — the server subtracts every non-cash
        tender from the amount due first, applies cash to what is left, and
        derives the change from the cash leg ONLY (`change = handed - applied`,
        never negative, never offsetting a shortfall on another tender). Non-cash
        tenders summing above the total are `409 OVERPAYMENT`; tenders that do not
        cover the total are `409 INSUFFICIENT_TENDER` unless `allowDue` is
        `true`.


        `allowDue: true` (requires `tenders[]`, a customer `phone`, and the
        SEPARATE permission `commerce.pos_due.create` in addition to
        `commerce.pos.create`) lets the sale finalize with a balance DUE: the
        order stays `pending_payment` (`paymentStatus` `unpaid`/`partially_paid`,
        no expiry) with `settlement.outstanding` explicit, and later payments
        (`POST /api/v1/commerce/orders/{id}/payments`) settle it. `tenders: []`
        with `allowDue: true` is a sale entirely on account.


        The 201 carries `payments` (every ledger row — one per tender, for the
        receipt) and `settlement`; `change`/`amountTendered` keep their legacy
        meaning (the cash leg's change / the cash handed over, `null` when the
        sale had no cash leg).


        ### Spending loyalty points (Issue #363, ADR-0043)


        `loyaltyRedemption: { points }` spends the points of the customer
        already attached to the sale by `customer.phone` - never an account id
        from the request - as a discount line on the goods. The server computes
        the discount (`points * rupiah_per_point`, integer cents), bounded by
        the goods subtotal and the tenant's optional cap, and the tenders must
        then cover the total NET of it (`loyaltyDiscount` on the response). It
        needs the tenant's `loyalty` and `loyaltyRedemption` features, a point
        value set by the tenant, and the SEPARATE permission
        `commerce.loyalty_redemptions.create` in addition to
        `commerce.pos.create`. A walk-in sale (no phone) cannot redeem. The
        debit and the discount commit together or not at all.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lines
              description: "Exactly one of `payment` (legacy single tender) / `tenders` (Issue #285 multi-tender)."
              properties:
                customer:
                  type: object
                  nullable: true
                  properties:
                    name:
                      type: string
                      nullable: true
                    phone:
                      type: string
                      nullable: true
                      description: Omitted/blank attaches the sale to this tenant's walk-in customer row; a phone that does not normalise is a `400 VALIDATION_ERROR`. REQUIRED for a sale left with a balance due.
                tenders:
                  type: array
                  maxItems: 10
                  description: "Issue #285 — the explicit multi-tender payload (mutually exclusive with `payment`). At most one `cash` tender; non-cash tenders may repeat."
                  items:
                    type: object
                    required:
                      - tenderType
                      - amount
                    properties:
                      tenderType:
                        type: string
                        enum:
                          - cash
                          - manual_qris
                          - manual_bank_transfer
                          - gift_card
                          - store_credit
                      amount:
                        type: string
                        description: "`numeric(14,2)` string, > 0. Non-cash: applied to the sale. Cash: handed over (change derived server-side). A `gift_card` / `store_credit` amount is always explicit and can never exceed the total (change never applies to it)."
                      reference:
                        type: string
                        nullable: true
                        maxLength: 100
                      storedValueCode:
                        type: string
                        maxLength: 64
                        description: "Required for `gift_card` / `store_credit` (Issue #288, ADR-0030), forbidden otherwise; one code at most once per sale. Resolved to an account (neutral `404 STORED_VALUE_NOT_FOUND` for an unknown, other-tenant or other-kind code) and discarded: never stored, logged, audited, hashed into the idempotency key as plaintext, or returned. A refused card (`409 STORED_VALUE_UNAVAILABLE` / `STORED_VALUE_INSUFFICIENT`, `429 STORED_VALUE_LOOKUP_THROTTLED`) refuses the WHOLE sale before any row is written."
                allowDue:
                  type: boolean
                  description: "Issue #285 — finalize with a balance due. Requires `tenders[]`, a customer phone, and `commerce.pos_due.create`."
                loyaltyRedemption:
                  $ref: "#/components/schemas/CommerceLoyaltyRedemptionRequest"
                registerId:
                  type: string
                  format: uuid
                  nullable: true
                  description: "Issue #284 (ADR-0028) — the register the sale is rung up on. REQUIRED while the tenant's `register` feature is on: the sale is attached to that register's OPEN session, whose current cashier must be the caller. Optional for a tenant with the feature off (the default) — naming a register then is `409 FEATURE_DISABLED`, so a sale never looks attached when it is not."
                lines:
                  type: array
                  items:
                    type: object
                    required:
                      - productId
                      - quantity
                    properties:
                      productId:
                        type: string
                      variantId:
                        type: string
                        nullable: true
                      quantity:
                        type: integer
                payment:
                  type: object
                  required:
                    - method
                  properties:
                    method:
                      type: string
                      enum:
                        - cash
                        - manual_qris
                    amountTendered:
                      type: string
                      nullable: true
                      description: "`numeric(14,2)` string — required for `cash`, ignored for `manual_qris`."
                notes:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Order created, already `paid`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    allOf:
                      - $ref: "#/components/schemas/CommerceOrderAdmin"
                      - type: object
                        required:
                          - change
                          - amountTendered
                          - cashierTenantUserId
                        properties:
                          change:
                            type: string
                            nullable: true
                            description: "`amountTendered - total`, `numeric(14,2)` string; `null` for `manual_qris`."
                          amountTendered:
                            type: string
                            nullable: true
                            description: "The cash handed over, echoed back for the receipt; `null` for `manual_qris`."
                          cashierTenantUserId:
                            type: string
                            format: uuid
                            description: The staff member who rang the sale up (`orders.pos_cashier_tenant_user_id`).
                          registerSessionId:
                            type: string
                            format: uuid
                            nullable: true
                            description: "Issue #284 — the register session the sale was attached to; `null` when the tenant's `register` feature is off."
        "400":
          description: "`VALIDATION_ERROR` (shape, or a `customer.phone` that does not normalise) or `IDEMPOTENCY_REQUIRED` (no `Idempotency-Key` header)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`FEATURE_DISABLED` (the tenant turned `pos` off, #118), `IDEMPOTENCY_CONFLICT` (same key, different payload), `CART_CHANGED` (a line's price/stock changed since it was priced — `details.quote` carries the fresh quote), `INSUFFICIENT_TENDER` (the tenders do not cover the total — `details.shortfall`) or `OVERPAYMENT` (non-cash tenders exceed the total — `details.outstanding`/`details.attempted`) or, with the `register` feature on (Issue #284), `REGISTER_SESSION_REQUIRED` (the register has no open session), `REGISTER_SESSION_CLOSING` or `NOT_SESSION_CASHIER`. `403` also covers `allowDue: true` without `commerce.pos_due.create` and, with `loyaltyRedemption` (Issue #363), a caller without `commerce.loyalty_redemptions.create`; `404` an unknown or other-tenant `registerId`. With `loyaltyRedemption`: `LOYALTY_REDEMPTION_UNAVAILABLE`, `LOYALTY_REDEMPTION_REQUIRES_CUSTOMER` (a walk-in sale has no account), `LOYALTY_REDEMPTION_EXCEEDS_LIMIT`, `LOYALTY_REDEMPTION_CUSTOMER_UNAVAILABLE` or `INSUFFICIENT_POINTS`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
