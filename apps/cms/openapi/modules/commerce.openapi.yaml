    # --- Issue #86 (ADR-0016, epic #32 wave 0) — CONTRACT ONLY. ---------------
    CustomerAccount:
      type: object
      description: "Issue #86 (design only). A row of `awcms_commerce_customer_accounts`, 1:1 with `awcms_commerce_customers` (D1) — no password, ever."
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        level:
          type: integer
          description: Mirrors `awcms_commerce_customers.level` — tiered pricing at quote time is out of scope for this contract (D6).
        createdAt:
          type: string
          format: date-time
        historyFrom:
          type: string
          format: date-time
          description: Order-history floor (D4) — the guest row's own `created_at` when the phone/e-mail match at bind time, otherwise the moment this account was created.
        marketingConsent:
          type: boolean
          description: "Issue #114 (contract #106 ADR-0017 D9). `true` when `marketing_consent_at` is non-null. A campaign's audience resolution only ever includes accounts where this is `true` — an account that never opts in is structurally unreachable, not merely filtered by convention."
    CustomerSession:
      type: object
      description: "Issue #86 (design only). A row of `awcms_commerce_customer_sessions` — never returned with its token; the token is minted once, at verify, and only its `sha256:` digest is ever stored (D3)."
      properties:
        id:
          type: string
          format: uuid
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: 30-day sliding TTL (D3) — refreshed on use, not fixed at issue.
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
    OtpRequest:
      type: object
      description: 'Issue #86/#108 (implemented, contract #86/#106 D2/D5). Body of `POST /account/otp/request`. `email` is required unless `via` is `"whatsapp"`, in which case `phone` is required instead and `purpose` must be `"login"` (registration stays e-mail OTP only).'
      required:
        - purpose
      properties:
        email:
          type: string
          format: email
          description: Required unless `via` is `"whatsapp"`.
        purpose:
          type: string
          enum:
            - login
            - register
        name:
          type: string
          description: Required when `purpose` is `register`; ignored for `login`.
        phone:
          type: string
          description: Required when `purpose` is `register` (via e-mail), or when `via` is `"whatsapp"` (E.164 or a locally-typed Indonesian number, normalised server-side).
        via:
          type: string
          enum:
            - email
            - whatsapp
          default: email
          description: 'Issue #108 (implemented, contract #106/ADR-0017 D5). `"whatsapp"` only supports `purpose: "login"` (the phone is looked up through the account''s linked customer row) and answers `409 CHANNEL_UNAVAILABLE` when the tenant has no WhatsApp channel configured (`COMMERCE_WHATSAPP_PROVIDER` unset).'
    OtpVerify:
      type: object
      description: 'Issue #86/#108 (implemented, contract #86/#106 D2/D5). Body of `POST /account/otp/verify`. Exactly one of `email`/`phone` is required — `phone` proves a `via: "whatsapp"` login OTP and only ever supports `purpose: "login"`.'
      required:
        - code
        - purpose
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          description: 'Issue #108 — alternative to `email` when the OTP was requested with `via: "whatsapp"`. Mutually exclusive with `email`.'
        code:
          type: string
          description: 6 digits.
        purpose:
          type: string
          enum:
            - login
            - register
    WishlistItem:
