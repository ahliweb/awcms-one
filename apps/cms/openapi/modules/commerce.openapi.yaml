              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/reports/commerce/outstanding-balances:
    get:
      operationId: getReportsCommerceOutstandingBalances
      tags:
        - Commerce
      summary: "Issue #285 (ADR-0025). Every order that still owes money (not cancelled/expired, `total - settled > 0`, `settled` re-derived from the payment-allocation ledger), largest balance first. `count`/`totalOutstanding` cover EVERY match; `items` is the first `limit`. Gated on `commerce.payments.read`."
      parameters:
        - name: channel
          in: query
          required: false
          schema:
            type: string
            enum:
              - storefront
              - pos
        - name: limit
          in: query
          required: false
          description: Rows to return, 1-500 (default 100).
          schema:
            type: integer
      responses:
        "200":
          description: Outstanding balances.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      channel:
                        type: string
                        nullable: true
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommerceOutstandingBalanceRow"
                      truncated:
                        type: boolean
                      count:
                        type: integer
                      totalOutstanding:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/commerce/stored-value/programs:
    get:
      operationId: listCommerceStoredValuePrograms
      tags:
        - Commerce
      summary: "Issue #288 (ADR-0030). The tenant's gift-card and store-credit program configuration. Gated on `commerce.stored_value_programs.read` and the tenant's `storedValue` feature."
      description: >-
        Always returns BOTH kinds; one the tenant never saved is reported with
        its disabled defaults (`configured: false`).
      responses:
        "200":
          description: Both programs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommerceStoredValueProgram"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`FEATURE_DISABLED` — the tenant's `storedValue` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/stored-value/programs/{kind}:
    put:
      operationId: upsertCommerceStoredValueProgram
      tags:
        - Commerce
      summary: "Issue #288 (ADR-0030). Creates or updates one kind's program. Gated on `commerce.stored_value_programs.update` and the tenant's `storedValue` feature."
      description: >-
        A PUT by nature (the same body leaves the same row), so it takes no
        `Idempotency-Key`; every change is audited. `enabled` governs ISSUING
        and LOADING only — value already outstanding stays redeemable when a
        program is switched off, because it is owed. When
        `allowRefundToAccount` is false a payment made with this kind of value
        cannot be reversed at all (closed loop: there is no cash alternative).
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum:
              - gift_card
              - store_credit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
                - allowRefundToAccount
              properties:
                enabled:
                  type: boolean
                expiryDays:
                  type: integer
                  nullable: true
                  minimum: 1
                  maximum: 3650
                  description: Default lifetime of a new account in days; `null` = never expires.
                allowRefundToAccount:
                  type: boolean
                maxBalance:
                  type: string
                  nullable: true
                  description: "`numeric(14,2)` string, > 0; `null` = no ceiling. Does not apply to a refund."
        "200":
          description: The saved program.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceStoredValueProgram"
        "400":
          description: "`VALIDATION_ERROR`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
