                description:
                  type: string
                  maxLength: 500
                  description: The reason. Free text — never in audit, events or the cash-up.
                payeeName:
                  type: string
                  nullable: true
                  maxLength: 120
                  description: Free text payee. A typed party reference is a documented follow-up (ADR-0031 D8).
                registerSessionId:
                  type: string
                  format: uuid
                  nullable: true
                  description: The OPEN drawer session the cash came from (cash only; needs the `register` feature).
