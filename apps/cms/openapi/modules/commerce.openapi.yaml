                    - manual_qris
                amount:
                  type: string
                  description: numeric(14,2) as a string.
                bankName:
                  type: string
                  nullable: true
                accountName:
                  type: string
                  nullable: true
                transferredAt:
                  type: string
                  format: date-time
                  nullable: true
                proofMediaObjectId:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Confirmation recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: ORDER_NOT_PAYABLE — the order is not pending_payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/storefront/orders/{orderCode}/payment-proof/upload-sessions:
    post:
      operationId: createCommerceStorefrontPaymentProofUploadSession
      tags:
        - Commerce
      summary: Reserved for a future increment (Issue 29) — always 503 MEDIA_UNAVAILABLE today. See the module README for why.
      security: []
      parameters:
        - name: orderCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "503":
          description: Media upload is not available on this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/commerce/storefront/orders/{orderCode}/payment-proof/upload-sessions/{sessionId}/finalize:
    post:
      operationId: finalizeCommerceStorefrontPaymentProofUploadSession
      tags:
        - Commerce
      summary: Reserved for a future increment (Issue 29) — always 503 MEDIA_UNAVAILABLE today.
      security: []
      parameters:
        - name: orderCode
          in: path
          required: true
          schema:
            type: string
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "503":
          description: Media upload is not available on this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/commerce/storefront/orders/{orderCode}/cancel:
    post:
      operationId: cancelCommerceStorefrontOrder
      tags:
        - Commerce
      summary: Anonymous customer-initiated cancel (Issue 29), only while pending_payment.
      security: []
      parameters:
        - name: orderCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                reason:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Order cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceOrder"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: ORDER_NOT_CANCELLABLE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/storefront/reviews:
    post:
      operationId: createCommerceStorefrontReview
      tags:
        - Commerce
      summary: Anonymous review submission (Issue 29). Requires a completed order containing the product; lands pending for moderation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderCode
                - phone
                - productId
                - rating
                - body
              properties:
                orderCode:
                  type: string
                phone:
                  type: string
                productId:
                  type: string
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                body:
                  type: string
      responses:
        "201":
          description: Review submitted, pending moderation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                          - pending
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: REVIEW_NOT_ALLOWED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    CommerceCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
          nullable: true
        productCount:
          type: integer
          description: Computed — the tenant's LIVE products currently in this category (Issue 23).
    CommerceProductImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        mediaObjectId:
          type: string
          format: uuid
        publicUrl:
          type: string
          nullable: true
          description: Resolved through media_library's MediaLibraryPort; null if the media object is no longer safe to reference.
        altText:
          type: string
          nullable: true
        sortOrder:
          type: integer
    CommerceProductVariant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        name:
          type: string
        value:
          type: string
        colorHex:
          type: string
          nullable: true
        imageMediaObjectId:
          type: string
          format: uuid
          nullable: true
        imageUrl:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        price:
          type: string
          nullable: true
          description: numeric(14,2) as a decimal string, or null to inherit the product's own price.
        priceLevel2:
          type: string
          nullable: true
        priceLevel3:
          type: string
          nullable: true
        priceLevel4:
          type: string
          nullable: true
        stock:
          type: integer
        weightGrams:
          type: integer
        sortOrder:
          type: integer
    CommerceProductVariantInput:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        colorHex:
          type: string
          nullable: true
          description: "#RRGGBB."
        imageMediaObjectId:
          type: string
          format: uuid
          nullable: true
        sku:
          type: string
          nullable: true
          description: Checked for uniqueness against BOTH this tenant's live products and live variants.
        price:
          type: string
          nullable: true
        priceLevel2:
          type: string
          nullable: true
        priceLevel3:
          type: string
          nullable: true
        priceLevel4:
          type: string
          nullable: true
        stock:
          type: integer
          minimum: 0
        weightGrams:
          type: integer
          minimum: 0
        sortOrder:
          type: integer
    CommerceServiceFormField:
      type: object
      required:
        - id
        - type
        - label
        - required
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - text
            - textarea
            - select
            - number
            - date
        label:
          type: string
        required:
          type: boolean
        options:
          type: array
          items:
            type: string
          nullable: true
          description: Required (non-empty) when type is "select"; rejected for every other type.
    CommerceVariantAttributeGroup:
      type: object
      required:
        - name
        - options
      properties:
        name:
          type: string
        options:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string
              description:
                type: string
                nullable: true
    CommerceProductParityFields:
      type: object
      description: Fields Issue 23 adds on top of Issue 4's catalog core — shared by the create and update request bodies below.
      properties:
        priceLevel2:
          type: string
          nullable: true
          description: numeric(14,2) as a decimal string.
        priceLevel3:
          type: string
          nullable: true
        priceLevel4:
          type: string
          nullable: true
        costPrice:
          type: string
          nullable: true
          description: Admin-only — never present on a GET response's CommerceProduct.
        minPurchase:
          type: integer
          minimum: 1
          default: 1
        weightGrams:
          type: integer
          minimum: 0
          default: 0
        manualRating:
          type: string
          nullable: true
          description: numeric(2,1) as a decimal string, "0.0"-"5.0".
        manualSoldCount:
          type: integer
          minimum: 0
          default: 0
        withInsurance:
          type: boolean
          default: false
        insuranceRequired:
          type: boolean
          default: false
        insuranceFee:
          type: string
          nullable: true
        promoBannerShow:
          type: boolean
          default: false
        promoBannerTitle:
          type: string
          nullable: true
        promoBannerSubtitle:
          type: string
          nullable: true
        promoBannerBadge:
          type: string
          nullable: true
        promoBannerIcon:
          type: string
          nullable: true
        promoBannerColor:
          type: string
          nullable: true
        sizeChartType:
          type: string
          enum:
            - none
            - image
            - table
          default: none
        sizeChartMediaId:
          type: string
          format: uuid
          nullable: true
          description: Required when sizeChartType is "image"; must be null otherwise.
        sizeChartDetails:
          type: object
          nullable: true
          description: Required when sizeChartType is "table"; must be null otherwise. Arbitrary JSON (object/array), capped at 20000 serialized characters.
        serviceForm:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CommerceServiceFormField"
        subscriptionPeriod:
          type: string
          nullable: true
          enum:
            - day
            - week
            - month
            - year
        downloadLink:
          type: string
          nullable: true
        allowDp:
          type: boolean
          default: false
        allowFreeShipping:
          type: boolean
          default: true
        variantAttributes:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CommerceVariantAttributeGroup"
        isFeatured:
          type: boolean
          default: false
        isRecommended:
          type: boolean
          default: false
    CommerceProductCreateInput:
      allOf:
        - $ref: "#/components/schemas/CommerceProductParityFields"
        - type: object
          required:
            - sku
            - name
            - slug
            - price
          properties:
            categoryId:
              type: string
              format: uuid
              nullable: true
              description: Must reference a live category in the SAME tenant. An id that is unknown, soft-deleted, or belongs to another tenant is rejected identically with 400 (same GHSA-r7cx-c4jh-cvvw-shaped reasoning as categories.parentId).
            type:
              type: string
              enum:
                - physical
                - digital
                - service
                - subscription
              default: physical
            sku:
              type: string
            name:
              type: string
            slug:
              type: string
              description: Lowercase alphanumeric segments separated by single hyphens.
            description:
              type: string
              nullable: true
            digitalNote:
              type: string
              nullable: true
            price:
              type: string
              description: numeric(14,2) as a decimal string, e.g. "19999.00" — never a JSON number. Non-negative, at most 2 fractional digits.
            discountPercent:
              type: integer
              minimum: 0
              maximum: 100
              default: 0
            stock:
              type: integer
              minimum: 0
              default: 0
            label:
              type: string
              nullable: true
            labelColor:
              type: string
              nullable: true
    CommerceProductUpdateInput:
      allOf:
        - $ref: "#/components/schemas/CommerceProductParityFields"
        - type: object
          properties:
            categoryId:
              type: string
              format: uuid
              nullable: true
            type:
              type: string
              enum:
                - physical
                - digital
                - service
                - subscription
            sku:
              type: string
            name:
              type: string
            slug:
              type: string
            description:
              type: string
              nullable: true
            digitalNote:
              type: string
              nullable: true
            price:
              type: string
            discountPercent:
              type: integer
              minimum: 0
              maximum: 100
            stock:
              type: integer
              minimum: 0
            status:
              type: string
              enum:
                - draft
                - active
                - inactive
                - archived
            label:
              type: string
              nullable: true
            labelColor:
              type: string
              nullable: true
    # NOT built on `CommerceProductParityFields` via `allOf` — that schema's
    # `costPrice` is exactly the field this response must never carry
    # (`sql/156`'s header, this file's own header), and OpenAPI/JSON Schema
    # composition has no "allOf minus one property". So every parity field
    # OTHER than `costPrice` is repeated here by hand; keep the two lists in
    # sync when a parity field is added or renamed.
    CommerceProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum:
            - physical
            - digital
            - service
            - subscription
        sku:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        digitalNote:
          type: string
          nullable: true
        price:
          type: string
          description: numeric(14,2) as a decimal string — never a JSON number (money is never a float; see sql/153's header).
        discountPercent:
          type: integer
        stock:
          type: integer
        status:
          type: string
          enum:
            - draft
            - active
            - inactive
            - archived
        label:
          type: string
          nullable: true
        labelColor:
          type: string
          nullable: true
        priceLevel2:
          type: string
          nullable: true
        priceLevel3:
          type: string
          nullable: true
        priceLevel4:
          type: string
          nullable: true
        minPurchase:
          type: integer
        weightGrams:
          type: integer
        manualRating:
          type: string
          nullable: true
        manualSoldCount:
          type: integer
        withInsurance:
          type: boolean
        insuranceRequired:
          type: boolean
        insuranceFee:
          type: string
          nullable: true
        promoBannerShow:
          type: boolean
        promoBannerTitle:
          type: string
          nullable: true
        promoBannerSubtitle:
          type: string
          nullable: true
        promoBannerBadge:
          type: string
          nullable: true
        promoBannerIcon:
          type: string
          nullable: true
        promoBannerColor:
          type: string
          nullable: true
        sizeChartType:
          type: string
          enum:
            - none
            - image
            - table
        sizeChartMediaId:
          type: string
          format: uuid
          nullable: true
        sizeChartImageUrl:
          type: string
          nullable: true
          description: sizeChartMediaId resolved to a public URL through the media port (Issue 26). null unless sizeChartType is image and the object is publicly resolvable.
        sizeChartDetails:
          type: object
          nullable: true
        serviceForm:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CommerceServiceFormField"
        subscriptionPeriod:
          type: string
          nullable: true
          enum:
            - day
            - week
            - month
            - year
        allowDp:
          type: boolean
        allowFreeShipping:
          type: boolean
        variantAttributes:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CommerceVariantAttributeGroup"
        isFeatured:
          type: boolean
        isRecommended:
          type: boolean
        finalPrice:
          type: string
          description: price after discountPercent off, computed server-side in integer cents (domain/price-calculation.ts) — never a float.
        averageRating:
          type: string
          nullable: true
          description: "= manualRating (until #29 lands reviews)."
        soldCount:
          type: integer
          description: "= manualSoldCount (until #29 lands orders)."
        images:
          type: array
          items:
            $ref: "#/components/schemas/CommerceProductImage"
        variants:
          type: array
          items:
            $ref: "#/components/schemas/CommerceProductVariant"
    CommerceFlashSale:
