    CommerceReturnMutation:
      type: object
      properties:
        return:
          $ref: "#/components/schemas/CommerceReturn"
        storeCredit:
          type: object
          nullable: true
          description: "The store credit a refund issued. `code` is the plaintext, present ONLY in the response of the request that issued the account (a replay answers `codeRevealed: false`)."
          properties:
            accountId:
              type: string
              format: uuid
            code:
              type: string
              nullable: true
            codeRevealed:
              type: boolean
    CommerceRefundOutcome:
      type: object
      properties:
        refund:
          $ref: "#/components/schemas/CommerceRefund"
        settled:
          type: boolean
        storeCredit:
          type: object
          nullable: true
          additionalProperties: true
    CommerceReturnsReconcile:
      type: object
      properties:
        checkedReturns:
          type: integer
        findings:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - over_returned_line
                  - settled_refund_without_reversal
                  - reversal_without_refund
                  - refund_exceeds_payment
                  - return_refund_total_mismatch
                  - restock_mismatch
                  - open_return_fully_refunded
              id:
                type: string
                format: uuid
              detail:
                type: string
    CommerceBarcodeRow:
      type: object
      description: "Issue #292 (ADR-0032). A sellable catalogue row - a product without variants, or a variant - with its barcode. `symbology` is DERIVED from the code, never stored."
      properties:
        productId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        variantLabel:
          type: string
          nullable: true
          description: "`<variant name>: <variant value>` for a variant row."
        sku:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        symbology:
          type: string
          nullable: true
          enum:
            - ean13
            - ean8
            - upca
            - gtin14
            - code128
        price:
          type: string
          description: "Effective selling price, a `numeric(14,2)` string (a variant's own price, else the product's discounted price)."
        stock:
          type: integer
        status:
          type: string
    CommerceBarcodeLookup:
      allOf:
        - $ref: "#/components/schemas/CommerceBarcodeRow"
        - type: object
          properties:
            requiresVariant:
              type: boolean
              description: True when the row is the bare parent of a product that has live variants - the cashier must pick a variant.
            sellable:
              type: boolean
              description: True only for an active, in-stock row that does not require a variant.
    CommerceSegmentRules:
      type: object
      description: >-
        A rule tree in the CLOSED vocabulary (PRD 6.1; owner answer Q7 - no
        booking-derived field). A node has exactly one of `and` / `or` (arrays of
        1..10 nodes), `not` (one node) or `field`. A leaf is `{ field, op,
        value?, windowDays? }`. Fields and their operators: `level` (eq, in;
        1..4), `has_account` / `has_email` (eq; boolean), `customer_since`
        (before, after; a date value), `order_count` (eq, gt, gte, lt, lte;
        integer 0..1000000; optional `windowDays`), `paid_spend` (gt, gte, lt,
        lte; a `numeric(14,2)` STRING; optional `windowDays`), `last_order_date`
        / `first_order_date` (before, after with a date value, or never with no
        value), `loyalty_balance` (eq, gt, gte, lt, lte; integer points). A date
        value is an ISO 8601 date-time with a zone, or `{ "daysAgo": 0..3650 }`
        resolved against the server's as-of. Bounds: depth 4, 25 nodes, 3
        distinct windows (1..3650 days), 8 KiB. "Paid order" means a live order
        with `paid_at` set, not cancelled or expired, paid at or before the
        as-of; spend is the sum of order totals.
      additionalProperties: true
    CommerceSegmentInput:
      type: object
      required:
        - name
        - rules
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          nullable: true
          maxLength: 500
        rules:
          $ref: "#/components/schemas/CommerceSegmentRules"
    CommerceSegmentUpdate:
      type: object
      required:
        - baseVersion
      additionalProperties: false
      description: "At least one of `name`, `description`, `rules` besides `baseVersion`."
      properties:
        baseVersion:
          type: integer
          minimum: 1
          description: "The version this edit started from; must equal the segment's `latestVersion`."
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          nullable: true
          maxLength: 500
        rules:
          $ref: "#/components/schemas/CommerceSegmentRules"
    CommerceSegment:
      type: object
      required:
        - id
        - name
        - status
        - latestVersion
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - retired
        latestVersion:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        retiredAt:
          type: string
          format: date-time
          nullable: true
    CommerceSegmentVersion:
      type: object
      required:
        - version
        - rules
        - nodeCount
        - depth
        - createdAt
      properties:
        version:
          type: integer
        rules:
          $ref: "#/components/schemas/CommerceSegmentRules"
        nodeCount:
          type: integer
        depth:
          type: integer
        createdAt:
          type: string
          format: date-time
    CommerceSegmentDetail:
      allOf:
        - $ref: "#/components/schemas/CommerceSegment"
        - type: object
          required:
            - versions
          properties:
            versions:
              type: array
              description: "Newest first, at most 100. Immutable."
              items:
                $ref: "#/components/schemas/CommerceSegmentVersion"
    CommerceSegmentPreviewRequest:
      type: object
      additionalProperties: false
      description: "Either `rules`, or `segmentId` (with an optional `version`) - never both. There is no `asOf`: the server chooses it."
      properties:
        rules:
          $ref: "#/components/schemas/CommerceSegmentRules"
        segmentId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
    CommerceSegmentCount:
      type: object
      required:
        - suppressed
        - count
      properties:
        suppressed:
          type: boolean
          description: "True when fewer than 5 customers match; the number is then withheld."
        count:
          type: integer
          nullable: true
        label:
          type: string
          enum:
            - fewer_than_5
    CommerceSegmentMember:
      type: object
      required:
        - id
        - name
        - phoneMasked
        - level
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phoneMasked:
          type: string
        emailMasked:
          type: string
          nullable: true
        level:
          type: integer
    CommerceSegmentPreview:
      type: object
      required:
        - asOf
        - count
      properties:
        segment:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            version:
              type: integer
        asOf:
          type: string
          format: date-time
          description: "The SERVER instant every time-relative operand was resolved against."
        count:
          $ref: "#/components/schemas/CommerceSegmentCount"
        sample:
          type: array
          nullable: true
          description: "At most 10 masked customers; null unless the caller holds `commerce.segment_members.read` and `commerce.customers.read`."
          items:
            $ref: "#/components/schemas/CommerceSegmentMember"
    CommerceSegmentMembersPage:
      type: object
      required:
        - segmentId
        - version
        - asOf
        - items
      properties:
        segmentId:
          type: string
          format: uuid
        version:
          type: integer
        asOf:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommerceSegmentMember"
        nextCursor:
          type: string
          nullable: true
