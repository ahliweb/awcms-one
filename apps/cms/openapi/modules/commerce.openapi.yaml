        - targetId
        - docNumber
        - channel
        - purpose
        - recipientSource
        - recipientMasked
        - locale
        - templateKey
        - templateVersion
        - contentHash
        - status
        - hasLink
        - createdAt
        - outbox
      properties:
        id:
          type: string
          format: uuid
          description: Also the `correlation_id` of the outbox row.
        targetType:
          type: string
          enum:
            - document
            - quotation_version
            - work_order
        targetId:
          type: string
          format: uuid
        docNumber:
          type: string
        channel:
          type: string
          enum:
            - email
            - whatsapp
        purpose:
          type: string
          enum:
            - transactional
        recipientSource:
          type: string
          enum:
            - source_customer
            - override
        recipientMasked:
          type: string
        locale:
          type: string
          enum:
            - id
            - en
        templateKey:
          type: string
        templateVersion:
          type: integer
        contentHash:
          type: string
          description: SHA-256 of the exact variables handed to the outbox; two sends of one immutable source have the same hash.
        status:
