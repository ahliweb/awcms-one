                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/loyalty/reconcile:
    post:
      operationId: reconcileCommerceLoyalty
      tags:
        - Commerce
      summary: "Issue #289. Recompute every account's balance from the ledger and report drift (projection disagrees with the ledger) and ledger breaks (a row whose running `balanceAfter` is not the running sum). `repair: true` additionally rewrites each drifted account's PROJECTION — never the ledger — with one audit event per repair. Gated on `commerce.loyalty.manage` (a high-risk action) in both modes."
      requestBody:
        required: false
