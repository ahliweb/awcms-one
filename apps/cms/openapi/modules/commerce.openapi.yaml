        quotationId:
          type: string
          format: uuid
          nullable: true
        quotationVersion:
          type: integer
          nullable: true
        orderId:
          type: string
          format: uuid
          nullable: true
        assigneeTenantUserId:
          type: string
          format: uuid
          nullable: true
        dueAt:
