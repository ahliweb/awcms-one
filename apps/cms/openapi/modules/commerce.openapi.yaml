                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceCartQuoteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Unresolvable tenant, disabled module, or a rate-limited caller — the same neutral body (contract's own anti-oracle rule).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/storefront/orders:
    post:
      operationId: createCommerceStorefrontOrder
      tags:
        - Commerce
      summary: Anonymous order creation (Issue 29). Idempotent by the client-supplied idempotencyKey; re-quotes the cart inside the write transaction. No bearer, no permission check.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommerceCreateOrderRequest"
      responses:
        "201":
          description: Order created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceOrder"
        "200":
          description: The idempotency key was seen before; the same order is returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Unresolvable tenant, disabled module, or a rate-limited caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: CART_CHANGED — a line's price/stock/shipping/payment method changed since it was last quoted; `error.details.quote` carries a fresh quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited (per IP and per normalised phone).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
