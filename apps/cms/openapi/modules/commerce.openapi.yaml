          format: uuid
          nullable: true
        hasLink:
          type: boolean
        linkExpiresAt:
          type: string
          format: date-time
          nullable: true
        requestedByTenantUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        outbox:
          $ref: "#/components/schemas/CommerceDocumentDeliveryOutbox"
