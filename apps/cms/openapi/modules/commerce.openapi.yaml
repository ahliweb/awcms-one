components:
  schemas:
    CommerceCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
          nullable: true
        productCount:
          type: integer
          description: Computed — the tenant's LIVE products currently in this category (Issue 23).
    CommerceProductImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        mediaObjectId:
          type: string
          format: uuid
        publicUrl:
          type: string
          nullable: true
          description: Resolved through media_library's MediaLibraryPort; null if the media object is no longer safe to reference.
        altText:
          type: string
          nullable: true
        sortOrder:
          type: integer
    CommerceProductVariant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        name:
          type: string
        value:
          type: string
        colorHex:
          type: string
          nullable: true
        imageMediaObjectId:
          type: string
          format: uuid
          nullable: true
        imageUrl:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        price:
          type: string
          nullable: true
          description: numeric(14,2) as a decimal string, or null to inherit the product's own price.
        priceLevel2:
          type: string
          nullable: true
        priceLevel3:
          type: string
          nullable: true
        priceLevel4:
          type: string
          nullable: true
        stock:
          type: integer
        weightGrams:
          type: integer
        sortOrder:
          type: integer
    CommerceProductVariantInput:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        colorHex:
          type: string
          nullable: true
          description: "#RRGGBB."
        imageMediaObjectId:
          type: string
          format: uuid
          nullable: true
        sku:
          type: string
          nullable: true
          description: Checked for uniqueness against BOTH this tenant's live products and live variants.
        price:
          type: string
          nullable: true
        priceLevel2:
          type: string
          nullable: true
        priceLevel3:
          type: string
          nullable: true
        priceLevel4:
          type: string
          nullable: true
        stock:
          type: integer
          minimum: 0
        weightGrams:
          type: integer
          minimum: 0
        sortOrder:
          type: integer
    CommerceServiceFormField:
      type: object
      required:
        - id
        - type
        - label
        - required
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - text
            - textarea
            - select
            - number
            - date
        label:
          type: string
        required:
          type: boolean
        options:
          type: array
          items:
            type: string
          nullable: true
          description: Required (non-empty) when type is "select"; rejected for every other type.
    CommerceVariantAttributeGroup:
      type: object
      required:
        - name
        - options
      properties:
        name:
          type: string
        options:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name:
                type: string
              description:
                type: string
                nullable: true
    CommerceProductParityFields:
      type: object
      description: Fields Issue 23 adds on top of Issue 4's catalog core — shared by the create and update request bodies below.
      properties:
        priceLevel2:
          type: string
          nullable: true
          description: numeric(14,2) as a decimal string.
        priceLevel3:
          type: string
          nullable: true
        priceLevel4:
          type: string
          nullable: true
        costPrice:
          type: string
          nullable: true
          description: Admin-only — never present on a GET response's CommerceProduct.
        minPurchase:
          type: integer
          minimum: 1
          default: 1
        weightGrams:
          type: integer
          minimum: 0
          default: 0
        manualRating:
          type: string
          nullable: true
          description: numeric(2,1) as a decimal string, "0.0"-"5.0".
        manualSoldCount:
          type: integer
          minimum: 0
          default: 0
        withInsurance:
          type: boolean
          default: false
        insuranceRequired:
          type: boolean
          default: false
        insuranceFee:
          type: string
          nullable: true
