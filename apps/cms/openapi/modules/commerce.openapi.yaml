                    phone:
                      type: string
                lines:
                  type: array
                  items:
                    $ref: "#/components/schemas/CommerceCartQuoteLine"
                notes:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Order created, already `paid`.
