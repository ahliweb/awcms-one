      summary: "Issue #294 (ADR-0031). Submits a draft for posting. Gated on `commerce.expense_postings.create`; requires `Idempotency-Key`."
      description: >-
        Within the tenant's `expenses.approvalThreshold` the expense is posted
        outright (`outcome: posted`, decision `auto`). Above it, a caller who
