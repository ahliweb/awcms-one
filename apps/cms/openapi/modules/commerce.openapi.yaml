    CommerceCartQuoteResult:
      type: object
      description: Issue 29 — arithmetic order documented in `commerce-storefront-endpoints.md`. subtotal, discount, shippingCost, insuranceFee, tax and total are all numeric(14,2) strings.
      properties:
        lines:
          type: array
          items:
