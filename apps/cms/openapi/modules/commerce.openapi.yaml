        subtotal:
          type: string
        weightGrams:
          type: integer
        shippingOptions:
          type: array
          description: 'Issue #106 (ADR-0017 D4), implemented by #107. Every offered method, available or not — one entry per alternative service, one for self_pickup, and either one available:false courier placeholder (cost:null, with a note) or one available:true entry per resolved courier service. A `courier` entry becomes `{method:"courier", serviceId:"jne:REG", name:"JNE REG (2-3 hari)", cost, etd, available:true}` once `destination` is supplied and the provider answers; without a `destination`, or on a provider failure, every `courier` entry keeps `available:false` and `cost:null` — the cart is never blocked on the provider being reachable.'
          items:
            type: object
            properties:
              method:
                type: string
                enum:
                  - alternative
                  - self_pickup
                  - courier
              serviceId:
                type: string
                nullable: true
              name:
                type: string
              cost:
                type: string
                nullable: true
              available:
                type: boolean
              etd:
                type: string
                nullable: true
                description: Estimated delivery duration as the provider phrases it (e.g. "2-3 hari") — courier options only.
              note:
                type: string
                nullable: true
                description: Set on an unavailable courier placeholder to explain why (e.g. "Tujuan belum dikenali kurir"); null/absent otherwise.
        shipping:
          type: object
          nullable: true
        freeShippingApplied:
          type: boolean
        voucher:
          type: object
          nullable: true
        insurance:
          type: object
        tax:
          type: object
        discount:
          type: string
        total:
          type: string
        downPayment:
          type: object
        paymentMethods:
          type: array
          description: "`gateway` (Issue #106 ADR-0017 D3; implemented by #110) joins the existing `manual_bank`/`manual_qris`/`dp` entries once `COMMERCE_PAYMENT_GATEWAY` is not `none`; `available` still reflects the tenant's own store-settings toggle (`payment.gateway.enabled`, D10)."
