    Affiliate:
      type: object
      description: "Issue #92 (contract #86 D5). A row of `awcms_commerce_affiliates`, 1:1 with a customer — designed fresh, no legacy column carried over. `customerId`/`customerName` are populated on the STAFF list (`GET /api/v1/commerce/affiliates`) only; the storefront's own `GET/POST .../account/affiliate` never needs them (the account already knows who it is) and instead extends this shape with `link`/`stats`."
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Unique per tenant; captured by the storefront as `?ref=` and sent at order creation.
        customerId:
          type: string
          format: uuid
        customerName:
          type: string
        commissionRate:
          type: string
          description: numeric(5,2) as a string.
        status:
          type: string
          enum:
            - active
            - suspended
        createdAt:
          type: string
          format: date-time
    AffiliateCommission:
      type: object
      description: "Issue #92 (contract #86 D5). A row of `awcms_commerce_affiliate_commissions` — created when the referenced order reaches `completed`; self-referral yields none. `affiliateCode`/`orderCode` are the STAFF list's own convenience denormalisations (never re-derived by the client); the storefront's own `AfiliasiKomisi` (`apps/storefront/src/lib/akun-klien.ts`) only reads `id`/`orderCode`/`amount`/`status`/`createdAt`."
      properties:
        id:
          type: string
          format: uuid
        affiliateId:
          type: string
          format: uuid
        affiliateCode:
          type: string
        orderId:
          type: string
          format: uuid
        orderCode:
          type: string
        baseAmount:
          type: string
          description: numeric(14,2) as a string.
        rate:
          type: string
          description: numeric(5,2) as a string, copied from the affiliate's rate at commission-creation time (a later rate change never reprices an existing commission).
        amount:
          type: string
          description: numeric(14,2) as a string.
        status:
          type: string
          enum:
            - pending
            - approved
            - paid
            - void
        createdAt:
          type: string
          format: date-time
    # --- Issue #106 (ADR-0017, epic #33 wave 0) — CONTRACT ONLY. ---------------
    CommerceConversation:
      type: object
      description: "Issue #111 (contract #106 D8). A row of `awcms_commerce_conversations` — one customer account's private thread with the store. The account's own list/detail (`GET .../account/conversations*`) carries only `id`/`subject`/`status`/`lastMessageAt`/`unreadForCustomer` (unreadForCustomer travels as 0|1, never a genuine count); the staff list/detail additionally carries `customerId`/`customerName`/`unreadForStore`."
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
          minLength: 1
          maxLength: 150
        status:
          type: string
          enum:
            - open
            - closed
        lastMessageAt:
          type: string
          format: date-time
        unreadForCustomer:
          type: integer
          enum:
            - 0
            - 1
          description: "0|1, not a genuine multi-message count — see this schema's own description."
        unreadForStore:
          type: integer
          enum:
            - 0
            - 1
          description: "Staff-facing only. 0|1, same shape as unreadForCustomer."
        customerId:
          type: string
          format: uuid
          description: Staff-facing only.
        customerName:
          type: string
          description: Staff-facing only.
    CommerceConversationMessage:
      type: object
      description: "Issue #111 (contract #106 D8). A row of `awcms_commerce_messages` — one turn of a conversation, from either side."
      properties:
        id:
          type: string
          format: uuid
        sender:
          type: string
          enum:
            - customer
            - store
        body:
          type: string
          minLength: 1
          maxLength: 4000
        createdAt:
          type: string
          format: date-time
    CommerceCampaign:
      type: object
      description: "Issue #114 (contract #106 ADR-0017 D9). A row of `awcms_commerce_campaigns` — a consent-gated mass e-mail/WhatsApp send. `recipientCount`/`sentCount` are populated once the campaign has actually been dispatched; both are `null` on a fresh `draft`."
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
          enum:
            - email
            - whatsapp
        audience:
          type: object
          description: "`{levels: number[], hasAccount: boolean|null, lastOrderSince: string|null}` — every non-empty filter narrows the audience further (AND, not OR); an empty object targets every consented account."
        subject:
          type: string
          nullable: true
          description: Ignored for `channel:"whatsapp"`.
        body:
          type: string
        status:
          type: string
          enum:
            - draft
            - scheduled
            - sending
            - sent
            - cancelled
        recipientCount:
          type: integer
          nullable: true
        sentCount:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
    CommerceWebhookEndpoint:
      type: object
      description: "Issue #106 (ADR-0017 D2/D3; implemented by #110). A row of `awcms_commerce_webhook_endpoints`. The raw token is NEVER part of this shape — only `createCommerceWebhookEndpoint`'s own `201` response carries it, once."
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum:
            - midtrans
        label:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
    CommerceHeldSale:
      type: object
      description: "Issue #286 (ADR-0029). A parked POS cart. `status` is the EFFECTIVE status: a still-held cart past its expiry reads `expired`. Carries no cart content (that is returned once, by resume)."
      properties:
        id: &id001
          type: string
          format: uuid
        ownerTenantUserId: *id001
        registerId:
          type: string
          format: uuid
          nullable: true
        label:
          type: string
          nullable: true
        lineCount:
          type: integer
        status:
          type: string
          enum:
            - held
            - resumed
            - discarded
            - expired
        heldAt: &id002
          type: string
          format: date-time
        expiresAt: *id002
        closedAt:
          type: string
          format: date-time
          nullable: true
    CommerceResumedHeldSale:
      allOf:
        - $ref: "#/components/schemas/CommerceHeldSale"
        - type: object
          properties:
            cart:
              type: object
              properties:
                lines:
                  type: array
                  items:
                    type: object
                    properties:
                      productId: *id001
                      variantId:
                        type: string
                        format: uuid
                        nullable: true
                      quantity:
                        type: integer
                customer:
                  type: object
                  nullable: true
                  properties:
                    name:
                      type: string
                      nullable: true
                    phone:
                      type: string
                      nullable: true
                notes:
                  type: string
                  nullable: true
    CommerceQuotation:
      type: object
      description: "Issue #286 (ADR-0029). A quotation header with its CURRENT version's validity and total. `status` is effective: a `sent` quotation whose current version's validity has passed reads `expired`."
      properties:
        id: *id001
        number: &id004
          type: string
        status:
          type: string
          enum:
            - draft
            - sent
            - accepted
            - rejected
