  /api/v1/commerce/storefront/orders/{orderCode}/payment-gateway/sessions:
    post:
      operationId: createCommerceStorefrontPaymentGatewaySession
      tags:
        - Commerce
      summary: "Issue #106 (ADR-0017 D3; implemented by #110). Create a hosted payment-gateway session (Midtrans Snap) for a `pending_payment` order whose `paymentMethod` is `gateway`. Anonymous, identified by `phone` — or an optional `customerBearer`, matching the rest of this anonymous surface (Issue #91's own optional-bearer pattern)."
      description: >-
        `createSession` (the `PaymentGatewayProvider` port) is called OUTSIDE
        any DB transaction (ADR-0006/ADR-0017 D1); the returned `providerRef`
        is persisted before the redirect is handed back, so a
        `commerce:payments:reconcile` pass can always find this session even
        if the shopper never returns from the hosted page. Calling this twice
        for the same order while a session is still live returns the SAME
        session rather than creating a second one at the provider.
      security: []
      parameters:
        - name: orderCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: Required unless a valid `customerBearer` is presented instead.
      responses:
        "201":
          description: Session created (or the still-live session for this order was returned).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      redirectUrl:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                      providerRef:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: "UNAUTHENTICATED — an Authorization header was present but not a live session."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "PAYMENT_NOT_APPLICABLE — the order's `paymentMethod` is not `gateway`, or its status is not `pending_payment`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "GATEWAY_UNAVAILABLE — `COMMERCE_PAYMENT_GATEWAY=none`, unset, or the provider call itself failed/timed out."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/storefront/reviews:
    post:
      operationId: createCommerceStorefrontReview
      tags:
        - Commerce
      summary: "Anonymous review submission (Issue 29), with an optional customer bearer (Issue #91). Requires a completed order containing the product; lands pending for moderation."
      description: >-
        Issue #91 (implemented, contract #86): an OPTIONAL
        `Authorization: Bearer <customer session token>` is accepted here too.
        Present and valid → ownership is checked against the signed-in
        account's OWN customer row instead of the orderCode+phone credential
        (`phone` is still validated for shape and still the per-phone rate
        limit's key); present and invalid/expired → `401 UNAUTHENTICATED`;
        absent entirely → the anonymous path is unchanged.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderCode
                - phone
                - productId
                - rating
                - body
              properties:
                orderCode:
                  type: string
                phone:
                  type: string
                productId:
                  type: string
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
