                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/loyalty/programs/{id}/retire:
    post:
      operationId: retireCommerceLoyaltyProgram
      tags:
        - Commerce
      summary: "Issue #289. End the open active version NOW. Orders paid afterwards earn nothing until another version is activated; points already earned are untouched. `409 PROGRAM_NOT_ACTIVE` for anything but the open active version."
