# Source fragment for the "commerce" module (Issue 4, epic #1; brought to
# full BjekMart product-model parity by Issue 23, epic #21).
#
# Owns every path whose operations carry this module's OpenAPI tag, plus
# every components.schemas entry referenced ONLY by this module's operations.
#
# NOT independently valid OpenAPI: $ref targets pointing at shared components
# (securitySchemes/parameters/responses and cross-module schemas) only resolve
# after `bun run openapi:bundle` merges this file with the root fragment and
# every sibling module fragment into openapi/awcms-public-api.openapi.yaml.
# Edit this file, never the generated bundle.
#
# `CommerceCategory`/`CommerceProduct` below are the DTO contract, shared
# VERBATIM with `apps/storefront` (issue #5, in `awcms-one`) — do not drift
# their field lists from `commerce/application/category-directory.ts` /
# `product-directory.ts`'s `toRecord` functions. `costPrice` is intentionally
# ABSENT from `CommerceProduct` — it never leaves the admin-only fetch path
# (`sql/156`'s header).
paths:
  /api/v1/commerce/categories:
    get:
      operationId: listCommerceCategories
      tags:
        - Commerce
      summary: List categories for the current tenant — keyset-paginated, newest first.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous response's nextCursor. A malformed value is rejected with 400.
          schema:
            type: string
        - name: parentId
          in: query
          required: false
          description: "Filter to the direct children of one category (Issue 23)."
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Live categories for the tenant (limit 100), newest first, each with a computed productCount, with an opaque nextCursor for the next page (null on the last page).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommerceCategory"
                      nextCursor:
                        type: string
                        nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createCommerceCategory
      tags:
        - Commerce
      summary: Create a category.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - slug
              properties:
                name:
                  type: string
                slug:
                  type: string
                  description: Lowercase alphanumeric segments separated by single hyphens.
                parentId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Must reference a live category in the SAME tenant. An id that is unknown, soft-deleted, or belongs to another tenant is rejected identically with 400 — the responses are deliberately indistinguishable so the field cannot be used to probe for category ids elsewhere on the platform.
                icon:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Category created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceCategory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: slug is already taken by a live category in this tenant (CATEGORY_SLUG_ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/categories/{id}:
    get:
      operationId: getCommerceCategory
      tags:
        - Commerce
      summary: Fetch one category.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Category detail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceCategory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCommerceCategory
      tags:
        - Commerce
      summary: Update a category's name/slug/icon.
      description: No parentId here — a category's position in the hierarchy is set once, at creation. Move a category by deleting and recreating it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                icon:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Category updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceCategory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: slug is already taken by a live category in this tenant (CATEGORY_SLUG_ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCommerceCategory
      tags:
        - Commerce
      summary: Soft-delete a category (audited).
      description: Sets deleted_at; the slug is freed for reuse. Restore it with POST /api/v1/commerce/categories/{id}/restore (Issue 23).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Category soft-deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                          - deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/commerce/categories/{id}/restore:
    post:
      operationId: restoreCommerceCategory
      tags:
        - Commerce
      summary: Restore a soft-deleted category (Issue 23).
      description: 404 when the id is not currently soft-deleted (idempotent-safe — a repeat restore is a 404, never a duplicate). 409 when a live category has since taken the same slug.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Category restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceCategory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: slug is already taken by a live category in this tenant (CATEGORY_SLUG_ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/products:
    get:
      operationId: listCommerceProducts
      tags:
        - Commerce
      summary: List products for the current tenant — filterable, sortable, keyset-paginated.
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous response's nextCursor. Only meaningful with the default sort=newest; combined with any other sort it is rejected with 400. A malformed value is rejected with 400.
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - draft
              - active
              - inactive
              - archived
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match on name or sku (trigram-indexed).
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Defaults to newest. price_asc/price_desc/name return a single bounded page (no nextCursor) rather than a keyset walk — see domain/product-sort.ts.
          schema:
            type: string
            enum:
              - newest
              - price_asc
              - price_desc
              - name
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
        - name: recommended
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Live products for the tenant (limit 100) matching every supplied filter, in the requested order, each with images[]/variants[] resolved, with an opaque nextCursor for the next page (null on the last page or for a non-newest sort).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommerceProduct"
                      nextCursor:
                        type: string
                        nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createCommerceProduct
      tags:
        - Commerce
      summary: Create a product. Always starts in status draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommerceProductCreateInput"
      responses:
        "201":
          description: Product created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: slug or sku is already taken by a live product in this tenant (PRODUCT_SLUG_ALREADY_EXISTS / PRODUCT_SKU_ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/products/by-slug/{slug}:
    get:
      operationId: getCommerceProductBySlug
      tags:
        - Commerce
      summary: Fetch one product by its URL slug (Issue 23) — the storefront's detail fetch.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail, with images[]/variants[] resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/commerce/products/{id}:
    get:
      operationId: getCommerceProduct
      tags:
        - Commerce
      summary: Fetch one product, with images[]/variants[] resolved.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Product detail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCommerceProduct
      tags:
        - Commerce
      summary: Update a product, including a status transition and every parity field.
      description: There is no dedicated status-transition endpoint — status travels through this same PATCH, checked against product-status.ts's LEGAL_TRANSITIONS. sizeChartType's cross-field consistency (domain/size-chart.ts) is checked against the MERGED next state.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommerceProductUpdateInput"
      responses:
        "200":
          description: Product updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: slug or sku is already taken by a live product in this tenant (PRODUCT_SLUG_ALREADY_EXISTS / PRODUCT_SKU_ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCommerceProduct
      tags:
        - Commerce
      summary: Soft-delete a product (audited).
      description: Sets deleted_at; the sku and slug are freed for reuse. Restore it with POST /api/v1/commerce/products/{id}/restore (Issue 23).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Product soft-deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                          - deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/commerce/products/{id}/restore:
    post:
      operationId: restoreCommerceProduct
      tags:
        - Commerce
      summary: Restore a soft-deleted product (Issue 23).
      description: 404 when the id is not currently soft-deleted. 409 when a live product has since taken the same slug or sku.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Product restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceProduct"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: slug or sku is already taken by a live product in this tenant (PRODUCT_SLUG_ALREADY_EXISTS / PRODUCT_SKU_ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/products/{id}/images:
    post:
      operationId: createCommerceProductImage
      tags:
        - Commerce
      summary: Attach a media object to a product (Issue 23). Gated on products.update.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mediaObjectId
              properties:
                mediaObjectId:
                  type: string
                  format: uuid
                  description: Must reference a live, verified, same-tenant media object.
                altText:
                  type: string
                  nullable: true
                sortOrder:
                  type: integer
                  default: 0
      responses:
        "201":
          description: Product image created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceProductImage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/commerce/products/{id}/images/{imageId}:
    patch:
      operationId: updateCommerceProductImage
      tags:
        - Commerce
      summary: Edit a product image's altText/sortOrder (Issue 23). mediaObjectId is immutable once attached.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                altText:
                  type: string
                  nullable: true
                sortOrder:
                  type: integer
      responses:
        "200":
          description: Product image updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceProductImage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCommerceProductImage
      tags:
        - Commerce
      summary: Soft-delete a product image (audited) (Issue 23).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Product image soft-deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                          - deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/commerce/products/{id}/variants:
    post:
      operationId: createCommerceProductVariant
      tags:
        - Commerce
      summary: Add a variant to a product (Issue 23). Gated on products.update.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommerceProductVariantInput"
      responses:
        "201":
          description: Product variant created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceProductVariant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: sku is already used by a live product or variant in this tenant (VARIANT_SKU_ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/products/{id}/variants/{variantId}:
    patch:
      operationId: updateCommerceProductVariant
      tags:
        - Commerce
      summary: Edit a product variant (Issue 23).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: variantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommerceProductVariantInput"
      responses:
        "200":
          description: Product variant updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceProductVariant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: sku is already used by a live product or variant in this tenant (VARIANT_SKU_ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteCommerceProductVariant
      tags:
        - Commerce
      summary: Soft-delete a product variant (audited) (Issue 23).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: variantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Product variant soft-deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                          - deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  schemas:
    CommerceCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
          nullable: true
        productCount:
          type: integer
          description: Computed — the tenant's LIVE products currently in this category (Issue 23).
    CommerceProductImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        mediaObjectId:
          type: string
          format: uuid
        publicUrl:
          type: string
          nullable: true
          description: Resolved through media_library's MediaLibraryPort; null if the media object is no longer safe to reference.
        altText:
          type: string
          nullable: true
        sortOrder:
          type: integer
    CommerceProductVariant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        name:
          type: string
        value:
          type: string
        colorHex:
          type: string
          nullable: true
        imageMediaObjectId:
          type: string
          format: uuid
          nullable: true
        imageUrl:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        price:
          type: string
          nullable: true
          description: numeric(14,2) as a decimal string, or null to inherit the product's own price.
        priceLevel2:
          type: string
          nullable: true
        priceLevel3:
          type: string
          nullable: true
        priceLevel4:
          type: string
          nullable: true
        stock:
          type: integer
        weightGrams:
          type: integer
        sortOrder:
          type: integer
