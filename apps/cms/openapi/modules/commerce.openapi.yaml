              answer:
                type: string
        social:
          type: object
          additionalProperties:
            type: string
            nullable: true
        customerLevels:
          type: array
          items:
            type: object
            properties:
              level:
                type: integer
              name:
                type: string
        shipping:
          type: object
          properties:
            alternativeServices:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  cost:
                    type: string
            selfPickup:
              type: boolean
