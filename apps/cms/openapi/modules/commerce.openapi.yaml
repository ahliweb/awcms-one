    CommerceStoreSettings:
      type: object
      description: The OWNER shape — a versioned settings document validated against domain/store-settings-validation.ts (unknown keys are rejected). Contains manual-bank account numbers and the QRIS media id; only settings.read may read it and it is never echoed on a public route.
      additionalProperties: false
      required:
        - storeName
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
        storeName:
          type: string
        tagline:
          type: string
          nullable: true
        logoMediaObjectId:
          type: string
          format: uuid
          nullable: true
        faviconMediaObjectId:
          type: string
          format: uuid
          nullable: true
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        mapsEmbedUrl:
          type: string
          nullable: true
        faqs:
          type: array
          items:
            type: object
            properties:
              question:
                type: string
              answer:
                type: string
        social:
          type: object
          description: facebook/instagram/tiktok/x/youtube/linkedin, each a URL or null.
          additionalProperties:
            type: string
            nullable: true
        customerLevels:
          type: array
          items:
            type: object
            properties:
              level:
                type: integer
              name:
                type: string
              type:
                type: string
                enum:
                  - percentage
                  - nominal
              value:
                type: string
              active:
                type: boolean
        shipping:
          type: object
          description: "alternativeServices[] {id,name,cost}, selfPickup, courierEnabled, pinpointEnabled, freeShipping {active,minOrder,maxDiscount}, originCityName, originSubdistrictName, courier: {enabled, originDestinationId, couriers: string[]} (Issue #106 ADR-0017 D4, implemented by #107) — `originDestinationId` is the RajaOngkir destination id resolved once for the store's own shipping origin; `couriers` names which provider courier codes (e.g. `jne`, `sicepat`) are offered; `enabled` is the courier-rate integration's own on/off switch."
        payment:
          type: object
          description: "manualBank {active, accounts[] {bankName, accountNumber, accountHolder}}, manualQris {active, mediaObjectId}, downPayment {active, percent}, tax {active, percent}, insurance {active, ratePercent, minFee}. Gains `gateway: {enabled}` (Issue #106 ADR-0017 D3/D10; the #110 half — schema, provider, session route, webhook-endpoint tokens — implemented; #118 (BjekMart Features flag) still pending) — the store-level ON/OFF switch; `COMMERCE_PAYMENT_GATEWAY` (env, per deployment) must ALSO be a real gateway for the method to actually appear, per D1's env-only-credentials rule."
        promoSection:
          type: object
          properties:
            active:
              type: boolean
            items:
              type: array
              items:
                type: object
        meta:
          type: object
          description: home/contact, each {title, description} (nullable).
        affiliateCommissionRate:
          type: string
          nullable: true
          description: "Issue #92 — numeric(5,2) as a string, 0-100, two decimals. A real column, not part of this jsonb document (sql/921's header) — included here on the wire only. null means the affiliate program is OFF for this tenant; a non-null value both turns it on and is the rate a NEW enrolment copies."
        taxMode:
          type: string
          enum:
            - flat
            - engine
          readOnly: true
          description: "Issue #293 (ADR-0039) — READ-ONLY on the wire (a `PUT` carrying it is refused as an unrecognised field). `flat` (the default): tax is `payment.tax.percent` of the subtotal less the voucher discount. `engine`: the `tax` module prices carts and finalises a snapshot per order. A real column on the store-settings row (sql/948), flipped only by the audited `commerce:tax:cutover` tooling."
        taxProfileCode:
          type: string
          readOnly: true
          description: "Issue #293 — the tax module profile used in `engine` mode (default `store-default`). Read-only."
    CommerceStoreSettingsPublic:
      type: object
      description: The subset a storefront may publish — the contract awcms-one's storefront builds against. Never carries an account number, account holder or QRIS payload.
      properties:
        storeName:
          type: string
        tagline:
          type: string
          nullable: true
        logo:
          type: object
          nullable: true
          properties:
            url:
              type: string
            alt:
              type: string
            width:
              type: integer
              nullable: true
            height:
              type: integer
              nullable: true
        favicon:
          type: object
          nullable: true
          properties:
            url:
              type: string
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        whatsapp:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        mapsEmbedUrl:
          type: string
          nullable: true
        faqs:
          type: array
          items:
            type: object
            properties:
              question:
                type: string
              answer:
                type: string
        social:
          type: object
          additionalProperties:
            type: string
            nullable: true
        customerLevels:
          type: array
          items:
            type: object
            properties:
              level:
                type: integer
              name:
                type: string
        shipping:
          type: object
          properties:
            alternativeServices:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  cost:
                    type: string
            selfPickup:
              type: boolean
            courierEnabled:
              type: boolean
              description: "Issue #106 (ADR-0017 D4, #107, #118). `true` only when `shipping.courier.enabled`, the tenant's `commerce` module `features.courier` flag (Issue #118), AND a configured courier-rate provider are ALL true."
            pinpointEnabled:
              type: boolean
            freeShipping:
              type: object
              properties:
                active:
                  type: boolean
                minOrder:
                  type: string
                maxDiscount:
                  type: string
            originCityName:
              type: string
              nullable: true
            originSubdistrictName:
              type: string
              nullable: true
        payment:
          type: object
          properties:
            manualBank:
              type: object
              properties:
                active:
                  type: boolean
                banks:
                  type: array
                  items:
                    type: object
                    properties:
                      bankName:
                        type: string
            manualQris:
              type: object
              properties:
                active:
                  type: boolean
            downPayment:
              type: object
              properties:
                active:
                  type: boolean
                percent:
                  type: integer
            tax:
              oneOf:
                - type: object
                  description: "Issue #324 — flat mode: tax is `percent` of the subtotal less the voucher discount."
                  required:
                    - mode
                    - active
                    - percent
                  properties:
                    mode:
                      type: string
                      enum:
                        - flat
                    active:
                      type: boolean
                    percent:
                      type: integer
                - type: object
                  description: "Issue #324 — engine mode: tax is computed by the tax module. The `active` and `percent` fields are NOT present in engine mode."
                  required:
                    - mode
                  properties:
                    mode:
                      type: string
                      enum:
                        - engine
                    inclusive:
                      type: boolean
                      nullable: true
                      description: "Whether the tax is already included in the line prices (not added to the total). Omitted if not cheaply available."
              discriminator:
                propertyName: mode
            insurance:
              type: object
              properties:
                active:
                  type: boolean
                ratePercent:
                  type: string
                minFee:
                  type: string
            proofUpload:
              type: boolean
              description: Issue 29 — whether the public payment-proof upload path is usable on this deployment. Always false in this increment; a payment confirmation without a proof image is still accepted.
            gatewayEnabled:
              type: boolean
              description: 'Issue #106 (ADR-0017 D3/D10, #110, #118). Whether the storefront should offer `payment.method: "gateway"` at all — the store-level `payment.gateway.enabled` toggle, the tenant''s `commerce` module `features.gateway` flag (Issue #118), AND a configured `COMMERCE_PAYMENT_GATEWAY` must ALL be true; the rate/provider details themselves never cross into this public shape.'
        orders:
          type: object
          description: Issue 29.
          properties:
            expiryHours:
              type: integer
              description: How many hours a newly-created order stays pending_payment before commerce:orders:expire moves it to expired.
        promoSection:
          type: object
          properties:
            active:
              type: boolean
            items:
              type: array
              items:
                type: object
                properties:
                  badge:
                    type: string
                    nullable: true
                  title:
                    type: string
                  subtitle:
                    type: string
                    nullable: true
                  tags:
                    type: array
                    items:
                      type: string
                  buttonText:
                    type: string
                    nullable: true
                  buttonLink:
                    type: string
                    nullable: true
        meta:
          type: object
        affiliateProgramEnabled:
          type: boolean
          description: "Issue #92 — whether the affiliate program is on at all. The rate itself never crosses into this public shape (same masking discipline as payment.manualBank/manualQris)."
        inboxEnabled:
          type: boolean
          description: "Issue #118 (contract #106 D10) — the tenant's `commerce` module `features.inbox` flag, verbatim. Storefront `apps/storefront` reads this to decide whether to offer the account conversations UI."
        campaignsEnabled:
          type: boolean
          description: "Issue #118 (contract #106 D10) — the tenant's `commerce` module `features.campaigns` flag, verbatim."
        whatsappOtpEnabled:
          type: boolean
          description: "Issue #108/#118 — whether OTP-via-WhatsApp is usable on this deployment (a configured `WhatsappProvider`, `COMMERCE_WHATSAPP_PROVIDER`/its credentials) — not a `features.*` flag. `apps/storefront`'s `masuk.astro`/`daftar.astro` already read this exact top-level key."
    CommerceCartQuoteLine:
      type: object
      description: Issue 29 — a resolved cart line, request or response shape depending on context.
      properties:
        productId:
          type: string
        variantId:
          type: string
          nullable: true
        quantity:
          type: integer
        serviceFormValues:
          type: object
          nullable: true
          additionalProperties:
            type: string
    CommerceCartQuoteRequest:
      type: object
      required:
        - lines
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CommerceCartQuoteLine"
        shipping:
          type: object
          nullable: true
          properties:
            method:
              type: string
              enum:
                - alternative
                - self_pickup
                - courier
            serviceId:
              type: string
        destination:
          type: object
          nullable: true
          description: 'Issue #106 (ADR-0017 D4), implemented by #107. `{districtCode}` — an `idn_admin_regions` level-3 (district/kecamatan) dotted code (e.g. "62.02.01"), resolved server-side against `awcms_commerce_courier_destinations` to a RajaOngkir destination id. Required for a `courier` shipping option to be quoted at all; absent, or when `shipping.courier.enabled` is off or no provider is configured, every `courier` option answers `available:false`.'
          properties:
            districtCode:
              type: string
        voucherCode:
          type: string
          nullable: true
        insurance:
          type: boolean
    CommerceCartQuoteResult:
      type: object
      description: Issue 29 — arithmetic order documented in `commerce-storefront-endpoints.md`. subtotal, discount, shippingCost, insuranceFee, tax and total are all numeric(14,2) strings.
      properties:
        lines:
          type: array
          items:
            type: object
            properties:
              productId:
                type: string
              variantId:
                type: string
                nullable: true
              slug:
                type: string
                nullable: true
              name:
                type: string
                nullable: true
              variantName:
                type: string
                nullable: true
              sku:
                type: string
                nullable: true
              quantity:
                type: integer
              unitPrice:
                type: string
              lineTotal:
                type: string
              weightGrams:
                type: integer
              status:
                type: string
                enum:
                  - ok
                  - price_changed
                  - out_of_stock
                  - quantity_reduced
                  - unavailable
                  - min_purchase
                  - service_form_invalid
              availableStock:
                type: integer
                nullable: true
              minPurchase:
                type: integer
                nullable: true
              bundle:
                type: object
                description: "Issue #290 (ADR-0036). Present on a bundle line only: what ONE bundle is made of. The line is a single line at the bundle's price; its stock check is the computed availability."
                properties:
                  components:
                    type: array
                    items:
                      type: object
                      properties:
                        position:
                          type: integer
                        productId:
                          type: string
                          format: uuid
                        variantId:
                          type: string
                          format: uuid
                          nullable: true
                        sku:
                          type: string
                          nullable: true
                        name:
                          type: string
                        variantName:
                          type: string
                          nullable: true
                        quantityPerBundle:
                          type: integer
                        unitPrice:
                          type: string
        subtotal:
          type: string
        weightGrams:
          type: integer
        shippingOptions:
          type: array
          description: 'Issue #106 (ADR-0017 D4), implemented by #107. Every offered method, available or not — one entry per alternative service, one for self_pickup, and either one available:false courier placeholder (cost:null, with a note) or one available:true entry per resolved courier service. A `courier` entry becomes `{method:"courier", serviceId:"jne:REG", name:"JNE REG (2-3 hari)", cost, etd, available:true}` once `destination` is supplied and the provider answers; without a `destination`, or on a provider failure, every `courier` entry keeps `available:false` and `cost:null` — the cart is never blocked on the provider being reachable.'
          items:
            type: object
            properties:
              method:
                type: string
                enum:
                  - alternative
                  - self_pickup
                  - courier
              serviceId:
                type: string
                nullable: true
              name:
                type: string
              cost:
                type: string
                nullable: true
              available:
                type: boolean
              etd:
                type: string
                nullable: true
                description: Estimated delivery duration as the provider phrases it (e.g. "2-3 hari") — courier options only.
              note:
                type: string
                nullable: true
                description: Set on an unavailable courier placeholder to explain why (e.g. "Tujuan belum dikenali kurir"); null/absent otherwise.
        shipping:
          type: object
          nullable: true
        freeShippingApplied:
          type: boolean
        voucher:
          type: object
          nullable: true
        insurance:
          type: object
        tax:
          type: object
          description: "`active`/`percent`/`amount` are the pre-#293 shape. Issue #293 (ADR-0039) adds `mode` (`flat` | `engine`: who computed it), `inclusive` (the tax is already inside the line prices and is NOT added to `total`; engine mode only), `error` (a `tax` module refusal code such as `TAX_RULE_VERSION_NOT_FOUND` when the engine could not answer — `canCheckout` is then false, never an untaxed sale) and `engine` ({profileCode, versionNo, ruleVersionId, taxDate}, null in flat mode). In engine mode `percent` is the fallback rule's first component rate, for display only; `amount` is the engine's figure."
          properties:
            active:
              type: boolean
            percent:
              type: number
            amount:
              type: string
            mode:
              type: string
              enum:
                - flat
                - engine
            inclusive:
              type: boolean
            error:
              type: string
              nullable: true
            engine:
              type: object
              nullable: true
              properties:
                profileCode:
                  type: string
                versionNo:
                  type: integer
                ruleVersionId:
                  type: string
                  nullable: true
                taxDate:
                  type: string
                  format: date
        discount:
          type: string
        total:
          type: string
        downPayment:
          type: object
        paymentMethods:
          type: array
          description: "`gateway` (Issue #106 ADR-0017 D3; implemented by #110) joins the existing `manual_bank`/`manual_qris`/`dp` entries once `COMMERCE_PAYMENT_GATEWAY` is not `none`; `available` still reflects the tenant's own store-settings toggle (`payment.gateway.enabled`, D10)."
          items:
            type: object
            properties:
              method:
                type: string
                enum:
                  - manual_bank
                  - manual_qris
                  - dp
                  - gateway
              available:
                type: boolean
        canCheckout:
          type: boolean
        quotedAt:
          type: string
          format: date-time
    CommerceCreateOrderRequest:
      type: object
      required:
        - idempotencyKey
        - customer
        - lines
        - shipping
        - payment
      properties:
        idempotencyKey:
          type: string
        customer:
          type: object
          required:
            - name
            - phone
          properties:
            name:
              type: string
            phone:
              type: string
            email:
              type: string
              nullable: true
        address:
          type: object
          nullable: true
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CommerceCartQuoteLine"
        shipping:
          type: object
          description: '`{method:"courier", serviceId}` (Issue #106 ADR-0017 D4, implemented by #107) joins the existing `{method:"alternative", serviceId}` and `{method:"self_pickup"}` shapes; `serviceId`+cost are validated against a non-expired `awcms_commerce_shipping_rates` cache row keyed off `address.districtCode` — the provider is never called a second time on the write path. A stale/unknown selection answers the same `409 CART_CHANGED` (with a fresh quote) every other price/stock/shipping mismatch does.'
        payment:
          type: object
          required:
            - method
          properties:
            method:
              type: string
              enum:
                - manual_bank
                - manual_qris
                - dp
                - gateway
              description: "`gateway` (Issue #106 ADR-0017 D3; implemented by #110) creates the order `pending_payment` exactly like every other method; the shopper is redirected to the gateway's hosted page only via the separate `POST .../payment-gateway/sessions` call below, never as a side effect of order creation itself."
        voucherCode:
          type: string
          nullable: true
        insurance:
          type: boolean
        notes:
          type: string
          nullable: true
        affiliateCode:
          type: string
          nullable: true
          description: "Issue #86 (design only). Optional `?ref=` referral code captured by the storefront; ignored if it matches the ordering customer's own affiliate code (self-referral yields no commission — D5)."
        loyaltyRedemption:
          $ref: "#/components/schemas/CommerceLoyaltyRedemptionRequest"
    CommerceLoyaltyRedemptionRequest:
      type: object
      nullable: true
      description: "Issue #363 (ADR-0043). Spend whole loyalty points on this order. The ONLY figure a client sends: the discount, the point value and the account are the server's (any other key is a `400`). Needs a valid customer bearer - the points are those of the signed-in account and no other. Refused with a stable `409` code: `LOYALTY_REDEMPTION_UNAVAILABLE` (feature off or no point value set), `LOYALTY_REDEMPTION_REQUIRES_ACCOUNT`, `LOYALTY_REDEMPTION_DEPOSIT_CONFLICT` (a down-payment order), `LOYALTY_REDEMPTION_EXCEEDS_LIMIT` (details: `reason`, `maxPoints`), `INSUFFICIENT_POINTS` (details: `balance`, `requested`). Replayed with the order by its `idempotencyKey`."
      required:
        - points
      properties:
        points:
          type: integer
          minimum: 1
          description: Whole points to spend.
    CommerceEntitlement:
      type: object
      description: "Issue #267 (IRMbyDUS entitlement module) — NOT identity-access's ADR-0084 tenant/plan entitlement concept; see sql/936's header. Granted once per (order, product) when the sourcing order reaches paid; revoked only by an admin (no refunded order status/event exists yet to auto-revoke from)."
      properties:
        id:
          type: string
          format: uuid
        ownerCustomerId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        sourceOrderId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - active
            - revoked
        grantedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LoyaltyProgramInput:
      type: object
      description: "Issue #289 — the create body of a loyalty program version. Points are integers; money is a numeric(14,2) STRING (ADR-0003)."
      required:
        - name
        - earnUnitAmount
        - earnPointsPerUnit
      properties:
        name:
          type: string
          maxLength: 200
        earnUnitAmount:
          type: string
          description: Spend that earns one step of points. Greater than zero.
        earnPointsPerUnit:
          type: integer
          minimum: 1
          maximum: 1000000
        minOrderAmount:
          type: string
          description: Eligible spend below this earns nothing. Defaults to "0.00".
        maxPointsPerOrder:
          type: integer
          nullable: true
          minimum: 1
        expiryDays:
          type: integer
          nullable: true
          minimum: 1
          maximum: 3650
          description: Points earned under this version lapse this many days after the order was paid; null = never.
        notes:
          type: string
          nullable: true
          maxLength: 1000
        eligibilitySegmentId:
          type: string
          format: uuid
          nullable: true
          description: "Issue #361 (ADR-0042 amendment). Restrict the version to a CRM segment: only the segment's members earn under it. `null` or absent = every customer earns. Setting it needs the tenant's `loyaltySegments` AND `segments` features and `commerce.segments.read` (`409 FEATURE_DISABLED`, `403`); an unknown, foreign or retired segment is `422 SEGMENT_NOT_FOUND`."
        eligibilitySegmentVersion:
          type: integer
          nullable: true
          minimum: 1
          description: "Issue #361. The segment version to pin; omitted with an id = the segment's latest version at save time. Needs `eligibilitySegmentId`."
    LoyaltyProgram:
      type: object
      description: "Issue #289 — one versioned, effective-dated earn rule. Eligible spend is the order's subtotal minus voucher discount (never shipping, insurance or tax); the points are `floor(spend / earnUnitAmount) * earnPointsPerUnit`, capped by `maxPointsPerOrder`. Rounding is always floor, recorded as `earnRounding`."
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        name:
          type: string
        status:
          type: string
          enum:
            - draft
            - active
            - retired
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
        effectiveTo:
          type: string
          format: date-time
          nullable: true
        earnUnitAmount:
          type: string
        earnPointsPerUnit:
          type: integer
        earnRounding:
          type: string
          enum:
            - floor
        minOrderAmount:
          type: string
        maxPointsPerOrder:
          type: integer
          nullable: true
        expiryDays:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        eligibilitySegmentId:
          type: string
          format: uuid
          nullable: true
          description: "Issue #361. The CRM segment this version is restricted to, recorded with the pinned `eligibilitySegmentVersion` so a past earn is explainable; `null` = every customer earns. Immutable once the version leaves draft (database trigger, `sql/1005`)."
        eligibilitySegmentVersion:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LoyaltyLedgerEntry:
      type: object
      description: "Issue #289 — one row of the append-only points ledger. `points` is a signed INTEGER: earn > 0, redeem < 0, expire <= 0 (0 marks a lot already fully spent), adjustment and reversal non-zero, restore > 0 (Issue #363: points given back when the order they paid for is cancelled or refunded; `reversesEntryId` names the `redeem` row it compensates and `expiresAt` the soonest expiry that redemption had consumed). `balanceAfter` is the account's running balance after this row."
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        accountSeq:
          type: integer
          format: int64
        kind:
          type: string
          enum:
            - earn
            - redeem
            - expire
            - adjustment
            - reversal
            - restore
        points:
          type: integer
          format: int64
        balanceAfter:
          type: integer
          format: int64
        programId:
          type: string
          format: uuid
          nullable: true
        sourceType:
          type: string
          enum:
            - order
            - expiry
            - redemption
            - manual
            - refund
        sourceId:
          type: string
          format: uuid
          nullable: true
        reversesEntryId:
          type: string
          format: uuid
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        actorTenantUserId:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    LoyaltyAccount:
      type: object
      description: "Issue #289 — a customer's loyalty account. `balance` is a PROJECTION of the ledger (the sum of every row's points), kept in the same transaction as each ledger insert; it can be negative only after a reversal clawed back points that were already spent."
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        balance:
          type: integer
          format: int64
        version:
          type: integer
          format: int64
        customerName:
          type: string
        customerPhoneMasked:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LoyaltyCustomerLookup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        phoneMasked:
          type: string
        balance:
          type: integer
          format: int64
          description: 0 for a customer with no account yet.
    CustomerLoyaltyHistoryItem:
      type: object
      description: "Issue #289 — the customer-facing projection of a ledger row: no staff actor, no free-text reason, no source order or program id."
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - earn
            - redeem
            - expire
            - adjustment
            - reversal
            - restore
        points:
          type: integer
          format: int64
        balanceAfter:
          type: integer
          format: int64
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    LoyaltySummary:
      type: object
      description: "Issue #289 — ledger-summed figures. `net` = earned − redeemed − expired + adjustmentsNet − reversed + restored. `outstanding` is the all-time sum of the ledger (not the projection), so it stays right if a projection has drifted."
      properties:
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
        period:
          type: object
          properties:
            entries:
              type: integer
            earned:
              type: integer
              format: int64
            redeemed:
              type: integer
              format: int64
            expired:
              type: integer
              format: int64
            adjustmentsNet:
              type: integer
              format: int64
            reversed:
              type: integer
              format: int64
            restored:
              type: integer
              format: int64
              description: "Issue #363 - points given back by `restore` rows (a cancelled or refunded order that had spent points)."
            net:
              type: integer
              format: int64
        outstanding:
          type: integer
          format: int64
        accounts:
          type: integer
        accountsWithNegativeBalance:
          type: integer
    LoyaltyRedemptionSettings:
      type: object
      nullable: true
      description: "Issue #363 (ADR-0043). What a loyalty point is worth when spent on an order. `null` when the tenant never set one (there is no default)."
      properties:
        rupiahPerPoint:
          type: integer
          description: Whole rupiah one point is worth.
        maxGoodsPercent:
          type: integer
          nullable: true
          description: Cap on the share of the goods subtotal (subtotal less voucher discount) payable in points; `null` for no cap.
        updatedAt:
          type: string
          format: date-time
    LoyaltyReconcileReport:
      type: object
      properties:
        accountsChecked:
          type: integer
        drifted:
          type: array
          items:
            type: object
            properties:
              accountId:
                type: string
                format: uuid
              customerId:
                type: string
                format: uuid
              projectedBalance:
                type: integer
                format: int64
              ledgerBalance:
                type: integer
                format: int64
              projectedVersion:
                type: integer
                format: int64
              ledgerVersion:
                type: integer
                format: int64
        ledgerBreaks:
          type: array
          items:
            type: object
            properties:
              accountId:
                type: string
                format: uuid
              badRows:
                type: integer
        unrepairable:
          type: array
          description: "Drifted accounts whose surviving ledger is not a complete history (it does not start at account_seq 1, has gaps, or is empty while the balance is not) because a retention purge aged early rows out. Reported, never repaired: SUM(ledger) is not their balance. A subset of drifted."
          items:
            type: object
            properties:
              accountId:
                type: string
                format: uuid
              reason:
                type: string
                enum: [unrepairable_history_purged]
        repaired:
          type: integer
    CommerceOrder:
      type: object
      description: Issue 29 — the storefront tracking/order-creation shape (`commerce-storefront-endpoints.md`). Customer/address phone are MASKED (phoneMasked); money fields are numeric(14,2) strings.
      properties:
        orderCode:
          type: string
        status:
          type: string
          enum:
            - pending_payment
            - paid
            - processing
            - shipped
            - completed
            - cancelled
            - expired
        paymentStatus:
          type: string
        paymentMethod:
          type: string
        channel:
          type: string
          enum:
            - storefront
            - pos
          description: "Issue #116 (contract #106 D6). `pos` for a walk-in/phone-identified order created through `POST /api/v1/commerce/pos/orders`; `storefront` for every other anonymous/bearer order-creation path. Every order created before #116 landed is `storefront`."
        shippingMethod:
          type: string
        shippingServiceName:
          type: string
          nullable: true
        customer:
          type: object
          properties:
            name:
              type: string
            phoneMasked:
              type: string
            email:
              type: string
              nullable: true
        address:
          type: object
          nullable: true
        lines:
          type: array
          items:
            type: object
        subtotal:
          type: string
        discount:
          type: string
        voucherCode:
          type: string
          nullable: true
        shippingCost:
          type: string
        insuranceFee:
          type: string
        tax:
          type: string
        total:
          type: string
          description: "The amount due. Net of `loyaltyDiscount` (Issue #363)."
        loyaltyDiscount:
          type: string
          description: "Issue #363 - the discount a points redemption gave on this order, `numeric(14,2)` string (`0.00` when none). Goods only: shipping, insurance and tax are never paid with points."
        loyaltyPointsRedeemed:
          type: integer
          format: int64
          description: "Issue #363 - whole points the order spent (0 when none)."
        downPayment:
          type: object
          nullable: true
        paymentInstructions:
          type: object
          nullable: true
        paymentConfirmations:
          type: array
          items:
            type: object
        timeline:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
              at:
                type: string
                format: date-time
              note:
                type: string
                nullable: true
        canCancel:
          type: boolean
        canConfirmPayment:
          type: boolean
        canReview:
          type: boolean
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        shippedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        whatsapp:
          type: object
          properties:
            number:
              type: string
            text:
              type: string
    CommerceOrderAdmin:
      allOf:
        - $ref: "#/components/schemas/CommerceOrder"
        - type: object
          description: "Issue 29 — admin detail adds customerId and unmasked customer/address phone; Issue #113 adds the read-only gateway session/payment-events panel; Issue #285 adds the derived `settlement` (and, on the POS receipt only, the `payments` ledger rows — everywhere else the rows are served by `GET /orders/{id}/payments` behind `commerce.payments.read`)."
          properties:
            id:
              type: string
              format: uuid
              description: "The order id — the staff-side handle (`/orders/{id}/payments`, `/orders/{id}/status`); the public record carries only the order code."
            customerId:
              type: string
              format: uuid
            settlement:
              $ref: "#/components/schemas/CommerceSettlement"
            payments:
              type: array
              description: "Present on the POS 201 receipt only."
              items:
                $ref: "#/components/schemas/CommercePaymentAllocation"
            gateway:
              type: object
              description: "Issue #113 — read-only payment-gateway panel. `session` is `null` for an order that was never a gateway order."
              properties:
                session:
                  type: object
                  nullable: true
                  properties:
                    id:
                      type: string
                      format: uuid
                    orderId:
                      type: string
                      format: uuid
                    provider:
                      type: string
                    providerRef:
                      type: string
                    redirectUrl:
                      type: string
                    status:
                      type: string
                    expiresAt:
                      type: string
                      format: date-time
                events:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      provider:
                        type: string
                      eventKey:
                        type: string
                      outcome:
                        type: string
                      receivedAt:
                        type: string
                        format: date-time
    CommerceSettlement:
      type: object
      description: "Issue #285 (ADR-0025) — an order's DERIVED settlement. `paid` = sum of succeeded payment legs, `reversed` = sum of succeeded reversals, `settled` = paid - reversed, `outstanding` = max(0, total - settled), `overpaid` = max(0, settled - total). Money is a `numeric(14,2)` decimal string (ADR-0003). `paymentStatus` is the cached derivation (`awcms_commerce_orders.payment_status`), a separate axis from the order lifecycle `status`."
      properties:
        total:
          type: string
        paid:
          type: string
        reversed:
          type: string
        settled:
          type: string
        outstanding:
          type: string
        overpaid:
          type: string
        paymentStatus:
          type: string
          enum:
            - unpaid
            - partially_paid
            - dp_paid
            - paid
            - refunded
    CommercePaymentAllocation:
      type: object
      description: "Issue #285 (ADR-0025) — one row of the append-only payment ledger: a tender leg (`kind: payment`) or a compensating reversal (`kind: reversal`, `reversesAllocationId` set). `amount` is what was APPLIED to the order; for a cash leg `tenderedAmount`/`changeAmount` carry what was handed over and what went back (`tenderedAmount = amount + changeAmount`). Only `succeeded` legs count toward settlement."
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - payment
            - reversal
        reversesAllocationId:
          type: string
          format: uuid
          nullable: true
        tenderType:
          type: string
          enum:
            - cash
            - manual_qris
            - manual_bank_transfer
            - gateway
            - gift_card
            - store_credit
        storedValue:
          type: object
          nullable: true
          description: "Issue #288 — the gift-card / store-credit account a `gift_card`/`store_credit` leg drew from (or a reversal returned value to); `null` for every other tender. Only the MASKED code is ever shown."
          properties:
            accountId:
              type: string
              format: uuid
            kind:
              type: string
              enum:
                - gift_card
                - store_credit
            maskedCode:
              type: string
              example: "•••••••-•••••••-•••AB2C"
        amount:
          type: string
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
        provider:
          type: string
          nullable: true
        providerReference:
          type: string
          nullable: true
        tenderedAmount:
          type: string
          nullable: true
        changeAmount:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        source:
          type: string
          enum:
            - pos
            - admin
            - storefront_manual
            - gateway_checkout
            - gateway_webhook
            - gateway_reconcile
            - backfill
        actorKind:
          type: string
          enum:
            - tenant_user
            - system
        actorTenantUserId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        settledAt:
          type: string
          format: date-time
          nullable: true
    CommercePaymentMutation:
      type: object
      description: "Issue #285 — the 201 body of recording a payment or a reversal: the new ledger row and the order's resulting settlement."
      properties:
        payment:
          $ref: "#/components/schemas/CommercePaymentAllocation"
        settlement:
          $ref: "#/components/schemas/CommerceSettlement"
    CommerceRegister:
      type: object
      description: "Issue #284 (ADR-0028) — a POS register (a named till)."
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        locationLabel:
          type: string
          nullable: true
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        activeSession:
          type: object
          nullable: true
          description: The register's single live (open/closing) session, if any.
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum:
                - open
                - closing
            currentCashierTenantUserId:
              type: string
              format: uuid
            openedAt:
              type: string
              format: date-time
    CommerceRegisterSession:
      type: object
      description: "Issue #284 (ADR-0028) — one shift on one register. `closing` = a close awaits a supervisor's approval; `corrected` = a closed session with a compensating correction. Money is a `numeric(14,2)` decimal string."
      properties:
        id:
          type: string
          format: uuid
        registerId:
          type: string
          format: uuid
        registerCode:
          type: string
        registerName:
          type: string
        status:
          type: string
          enum:
            - open
            - closing
            - closed
            - corrected
        openedAt:
          type: string
          format: date-time
        openedByTenantUserId:
          type: string
          format: uuid
        openingFloat:
          type: string
        currentCashierTenantUserId:
          type: string
          format: uuid
        closedAt:
          type: string
          format: date-time
          nullable: true
        closedByTenantUserId:
          type: string
          format: uuid
          nullable: true
    CommerceRegisterMovement:
      type: object
      description: "Issue #284 (ADR-0028) — an append-only cash drawer movement."
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        movementType:
          type: string
          enum:
            - cash_in
            - cash_out
            - safe_drop
            - expense
            - transfer
            - correction
        direction:
          type: string
          enum:
            - in
            - out
        amount:
          type: string
        reference:
          type: string
          nullable: true
          description: "Free text, or - for a movement an expense produced (Issue #294, ADR-0031) - the expense's short code (`EXP-XXXXXXXX`). The movement's link to its expense is a column, not part of this shape."
        note:
          type: string
          nullable: true
        actorTenantUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    CommerceRegisterCashUpReport:
      type: object
      description: "Issue #284 (ADR-0028) — a session's cash-up report. `live` is true while the figures are derived from the ledger (open/closing) and false once they are the stored close snapshot. Every amount is a `numeric(14,2)` decimal string; variances and corrections are SIGNED (negative = short)."
      properties:
        register:
          type: object
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            name:
              type: string
            locationLabel:
              type: string
              nullable: true
        session:
          $ref: "#/components/schemas/CommerceRegisterSession"
        live:
          type: boolean
        openingFloat:
          type: string
        sales:
          type: object
          description: Sales attached to the session, cancelled/expired ones excluded.
          properties:
            count:
              type: integer
            total:
              type: string
        tenders:
          type: array
          items:
            type: object
            properties:
              tenderType:
                type: string
                enum:
                  - cash
                  - manual_qris
                  - manual_bank_transfer
                  - gateway
                  - gift_card
                  - store_credit
              payments:
                type: string
              reversals:
                type: string
              expected:
                type: string
                description: "Cash: opening float + net cash legs + movements in − movements out. Other tenders: payments − reversals. Signed."
              counted:
                type: string
                nullable: true
                description: "`null` until a close was requested. Never altered by a correction."
              variance:
                type: string
                nullable: true
              correction:
                type: string
                description: Σ post-close corrections to the counted amount (`0.00` when none).
              effectiveCounted:
                type: string
                nullable: true
              effectiveVariance:
                type: string
                nullable: true
        movementTotals:
          type: object
          properties:
            in:
              type: string
            out:
              type: string
        movements:
          type: array
          items:
            $ref: "#/components/schemas/CommerceRegisterMovement"
        closeRequests:
          type: array
          description: Every close attempt, oldest first (a rejected one stays as history).
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              attempt:
                type: integer
              requestedByTenantUserId:
                type: string
                format: uuid
              requestedAt:
                type: string
                format: date-time
              varianceTotal:
                type: string
              varianceGross:
                type: string
              approvalThreshold:
                type: string
              approvalRequired:
                type: boolean
              varianceReason:
                type: string
                nullable: true
              decision:
                type: string
                enum:
                  - auto
                  - pending
                  - approved
                  - rejected
              decidedByTenantUserId:
                type: string
                format: uuid
