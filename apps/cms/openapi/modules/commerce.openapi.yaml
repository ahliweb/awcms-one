  /api/v1/commerce/webhook-endpoints:
    get:
      operationId: listCommerceWebhookEndpoints
      tags:
        - Commerce
      summary: "Issue #106 (ADR-0017 D2/D3; implemented by #110). Staff list of this tenant's inbound webhook endpoints — the token itself is NEVER re-shown after creation. Gated on `commerce.webhook_endpoints.update`."
      responses:
        "200":
          description: The endpoints.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommerceWebhookEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createCommerceWebhookEndpoint
      tags:
        - Commerce
      summary: "Issue #106 (ADR-0017 D2/D3; implemented by #110). Mint a new opaque endpoint token for a provider. The RAW token is returned exactly once, in this response, and never again — only its hash is stored (`awcms_commerce_webhook_endpoints`, D2). Gated on `commerce.webhook_endpoints.update`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider
              properties:
                provider:
                  type: string
                  enum:
                    - midtrans
                label:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Endpoint created; `data.token` is shown exactly once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    allOf:
                      - $ref: "#/components/schemas/CommerceWebhookEndpoint"
                      - type: object
                        properties:
                          token:
                            type: string
                            description: "The RAW token — embed it in the webhook URL configured at the provider. Never retrievable again after this response."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/commerce/webhook-endpoints/{id}:
    delete:
      operationId: deleteCommerceWebhookEndpoint
      tags:
        - Commerce
      summary: "Issue #106 (ADR-0017 D2/D3; implemented by #110). Revoke a webhook endpoint token — the fastest available rotation path if a URL leaks. Gated on `commerce.webhook_endpoints.update`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Revoked. Idempotent — revoking an already-revoked endpoint still answers 200 with the same row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      endpoint:
                        $ref: "#/components/schemas/CommerceWebhookEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/commerce/webhooks/{provider}/{endpointToken}:
    post:
      operationId: receiveCommercePaymentWebhook
      tags:
        - Commerce
      summary: "Issue #113 (contract #106's D2/D3). Public inbound payment-gateway callback. Tenant resolved from `endpointToken` via the SECURITY DEFINER `awcms_resolve_commerce_webhook_endpoint`; the provider's own signature (`verifyWebhook`) is verified timing-safe before anything else happens."
      description: >-
        Anonymous by definition — a provider callback carries no session.
        Replay-protected by a UNIQUE `(tenant_id, provider, event_key)`
        constraint on `awcms_commerce_payment_events`: a duplicate or replayed
        event is deduplicated and still answers `200`, exactly like a freshly
        verified one, so the provider's own retry behaviour never needs
        special-casing. A verified `paid` event calls `markOrderPaidBySystem`
        (the new `system` edge on `pending_payment -> paid`, `order-status.ts`);
        `expired` calls the existing `expireOrderBySystem`; `failed`/`refunded`
        only update the gateway session row — the order is deliberately never
        auto-transitioned to a refunded state (there is no such state; see
        `order-status.ts`'s header). Body size is bounded; an oversized or
        malformed body is rejected before signature verification runs. This
        route never calls the provider itself (no `fetchStatus`) —
        `commerce:payments:reconcile` is the only caller of that method.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - midtrans
        - name: endpointToken
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Midtrans's own HTTP notification body (snake_case, as documented by Midtrans — not translated here)."
              required:
                - order_id
                - status_code
                - gross_amount
                - transaction_status
                - signature_key
              properties:
                order_id:
                  type: string
                status_code:
                  type: string
                gross_amount:
                  type: string
                transaction_status:
                  type: string
                fraud_status:
                  type: string
                  nullable: true
                signature_key:
                  type: string
      responses:
        "200":
          description: "Always, for a verified event — new, deduplicated, or replayed alike."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
        "401":
          description: Bad or missing provider signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: "Unknown `endpointToken`, or a `provider` value the token was not minted for."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/reports/commerce/sales-daily:
    get:
      operationId: getReportsCommerceSalesDaily
      tags:
        - Commerce
      summary: "Issue #117 (contract #106, ADR-0017 D7). Per-day sales from the `commerce.sales_daily` reporting projection over the append-only order-event log: `-> paid` adds an order's figures, `-> cancelled|refunded` after a paid state subtracts them on the same day. One row per projection day that has any figure in the inclusive range. Gated on `reporting.dashboard.read`; the projection's freshness, rebuild and reconciliation live on `GET /api/v1/reports/projections/commerce.sales_daily`."
      parameters:
        - name: from
