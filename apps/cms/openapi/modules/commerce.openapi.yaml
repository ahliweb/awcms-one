        - Commerce
      summary: "Issue #288 (ADR-0030). Releases the balance of every lapsed account. Gated on `commerce.stored_value.update` and the tenant's `storedValue` feature."
      description: >-
        One `expire` ledger entry per account past its expiry, bounded to one
        batch (`more: true` = call again). Idempotent by construction (the
        entry's source key is the account and its expiry instant). The
        application never WAITS for this: an account about to be used is
        settled first, so a lapsed balance can never be spent however rarely
        this runs.
