    CommerceRetentionCohort:
      type: object
      description: "Issue #364 (ADR-0044). One customer cohort - the `Asia/Jakarta` calendar month of its members' first qualifying paid order."
      required:
        - cohortMonth
        - size
        - repeaters
        - mature
        - maturesAt
        - rateShown
        - ratePercent
        - restated
        - restatedAt
      properties:
        cohortMonth:
          type: string
          format: date
          description: First day of the cohort month (`YYYY-MM-01`).
        size:
          type: integer
          description: Customers in the cohort.
        repeaters:
          type: integer
          description: Cohort customers with a second distinct qualifying order after the first and within 90 x 24 hours of it.
        mature:
          type: boolean
          description: '`true` once every member''s 90-day window has elapsed; otherwise the figure is "to date".'
        maturesAt:
          type: string
          format: date-time
        rateShown:
          type: boolean
          description: "`false` for a cohort under 20 customers: counts only, no percentage."
        ratePercent:
          type: string
          nullable: true
          description: "`repeaters / size` as a percentage to one decimal place (round half up), or `null` when `rateShown` is false."
        restated:
          type: boolean
          description: A late event changed this cohort after its 35-day restatement window closed.
        restatedAt:
          type: string
          format: date-time
          nullable: true
    CommerceRetentionReport:
      type: object
      description: "Issue #364 (ADR-0044). The customer-retention report."
      required:
        - enabled
        - timeZone
        - windowDays
        - minCohortForRate
        - restatementWindowDays
        - asOf
        - from
        - to
        - cohorts
        - unlinkedOrders
      properties:
        enabled:
          type: boolean
          description: "`false` while the `retention` feature is off: everything below is then empty."
        timeZone:
          type: string
          description: The cohort calendar (`Asia/Jakarta`).
        windowDays:
          type: integer
          description: The repeat window N (90 in v1, configuration-free).
        minCohortForRate:
          type: integer
          description: Cohorts smaller than this show counts, not a percentage.
        restatementWindowDays:
          type: integer
        asOf:
          type: string
          format: date-time
          description: The instant the report was computed at; maturity is relative to it.
        from:
          type: string
          format: date
          description: First cohort month asked for (`YYYY-MM-01`).
        to:
          type: string
          format: date
          description: Last cohort month asked for (`YYYY-MM-01`).
        cohorts:
          type: array
          items:
            $ref: "#/components/schemas/CommerceRetentionCohort"
        unlinkedOrders:
          type: integer
          description: Qualifying orders of the anonymous walk-in placeholder, all time, outside every cohort.
