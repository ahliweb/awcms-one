            - converted
            - cancelled
        customerId:
          type: string
          format: uuid
          nullable: true
        customerName:
          type: string
          nullable: true
        currentVersion:
          type: integer
        acceptedVersion:
          type: integer
          nullable: true
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        convertedOrderId:
          type: string
          format: uuid
          nullable: true
        validUntil: *id002
        total: &id003
          type: string
          description: "`numeric(14,2)` decimal string (ADR-0003)."
        createdAt: *id002
        updatedAt: *id002
    CommerceQuotationVersion:
      type: object
