  /api/v1/commerce/products/{id}/protected-media:
    put:
      operationId: setCommerceProductProtectedMedia
      tags:
        - Commerce
      summary: "Link a product to the PRIVATE media object its entitlement gates (Issue #268, IRMbyDUS). Gated on products.update."
      description: |
        `mediaObjectId` must resolve, same-tenant, non-deleted, to a `visibility: "private"` object in a downloadable status (`verified`/`attached`). A `public` object is refused — linking one would defeat FR-LIB-002 (the object already has a permanent URL).

        Upsert on `(tenant_id, product_id)` — at most one link per product (`sql/939`). High-risk-adjacent (requires `Idempotency-Key`, though not itself in `HIGH_RISK_ACTIONS`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mediaObjectId
              properties:
                mediaObjectId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The link, created or updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      productId:
                        type: string
                        format: uuid
                      mediaObjectId:
                        type: string
                        format: uuid
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Idempotency-Key was reused with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: clearCommerceProductProtectedMedia
      tags:
        - Commerce
      summary: "Remove a product's protected-media link (Issue #268, IRMbyDUS). Gated on products.update. Idempotent."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Unlinked (or already unlinked — same response either way).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      productId:
                        type: string
                        format: uuid
                      unlinked:
                        type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Idempotency-Key was reused with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
