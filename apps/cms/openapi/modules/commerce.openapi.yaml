        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`FEATURE_DISABLED` — the tenant's `register` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: openCommerceRegisterSession
      tags:
        - Commerce
      summary: "Issue #284 (ADR-0028). Opens a session on a register with a counted opening float; the opener is the first current cashier. Gated on `commerce.register_sessions.create`; requires `Idempotency-Key`."
      description: >-
        One ACTIVE (open/closing) session per register: a second open is
        `409 REGISTER_SESSION_ALREADY_OPEN` (`details.activeSessionId`). Two
        genuinely concurrent opens serialise on the register row, and a partial
        unique index is the independent backstop, so exactly one wins. Same key
        + same body replays the stored 201; same key + a different body is
        `409 IDEMPOTENCY_CONFLICT`. Emits
        `awcms.commerce.register_session.opened`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - registerId
                - openingFloat
              properties:
                registerId:
                  type: string
                  format: uuid
                openingFloat:
                  type: string
                  description: "`numeric(14,2)` string, >= 0 (zero is allowed), never a JSON number."
      responses:
        "201":
          description: The session (or the stored replay).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceRegisterSession"
        "400":
          description: "`VALIDATION_ERROR` or `IDEMPOTENCY_REQUIRED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`REGISTER_SESSION_ALREADY_OPEN`, `REGISTER_INACTIVE`, `IDEMPOTENCY_CONFLICT` or `FEATURE_DISABLED` — the tenant's `register` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/register-sessions/{id}:
    get:
      operationId: getCommerceRegisterSession
      tags:
        - Commerce
      summary: "Issue #284 (ADR-0028). One session with its cash-up report: opening float, sales, expected / counted / difference per tender, movements, close history and corrections. Gated on `commerce.register_sessions.read`."
      description: >-
        Live (derived from the payment ledger and the movements) while the
        session is open or closing; the stored close snapshot once it is
        closed, with every correction applied ON TOP (the original lines are
        never altered). An unknown id and another tenant's id are the same 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The cash-up report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceRegisterCashUpReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`FEATURE_DISABLED` — the tenant's `register` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/register-sessions/{id}/movements:
    post:
      operationId: recordCommerceRegisterMovement
      tags:
        - Commerce
      summary: "Issue #284 (ADR-0028). Records a cash drawer movement against an OPEN session. Gated on `commerce.register_sessions.update`; requires `Idempotency-Key`."
      description: >-
        Append-only and cash only. `cash_in` is always `in`; `cash_out`,
        `safe_drop` and `expense` are always `out`; `transfer` and `correction`
        must say `direction`. An `expense`/`transfer` needs a `reference`, a
        `correction` a `note`. The `reference` here is FREE TEXT. Since Issue
        #294 (ADR-0031) a tenant whose `expenses` feature is ON records expenses
        through the expenses domain, whose posting appends the typed `expense`
        movement itself — so a raw `expense` movement is refused there
        (`409 EXPENSE_REQUIRES_EXPENSE_RECORD`): it would bypass the approval
        threshold. With the feature OFF (the default) nothing changes. Only the
        session's current cashier may record one. Emits
        `awcms.commerce.register_session.movement_recorded` (never the free
        text).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - movementType
                - amount
              properties:
                movementType:
                  type: string
                  enum:
                    - cash_in
                    - cash_out
                    - safe_drop
                    - expense
                    - transfer
                    - correction
                direction:
                  type: string
                  enum:
                    - in
                    - out
                  description: Required for `transfer` and `correction`; implied (and checked) for the others.
                amount:
                  type: string
                  description: "`numeric(14,2)` string, > 0."
                reference:
                  type: string
                  nullable: true
                  maxLength: 100
                note:
                  type: string
                  nullable: true
                  maxLength: 500
      responses:
        "201":
          description: The movement (or the stored replay).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceRegisterMovement"
        "400":
          description: "`VALIDATION_ERROR` or `IDEMPOTENCY_REQUIRED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`REGISTER_SESSION_NOT_OPEN` (`details.status`), `NOT_SESSION_CASHIER`, `EXPENSE_REQUIRES_EXPENSE_RECORD` (an `expense` movement while the `expenses` feature is on), `IDEMPOTENCY_CONFLICT` or `FEATURE_DISABLED` — the tenant's `register` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/register-sessions/{id}/handover:
    post:
      operationId: handOverCommerceRegisterSession
      tags:
        - Commerce
      summary: "Issue #284 (ADR-0028). Hands the drawer to another cashier. Gated on `commerce.register_sessions.update`; requires `Idempotency-Key`."
      description: >-
        Allowed for the session's CURRENT cashier, or for a supervisor holding
        `commerce.register_cash_ups.approve` (checked by the handler through the
        same access chokepoint only when the caller is not the current cashier;
        `403 ACCESS_DENIED` otherwise). The new cashier must be an ACTIVE tenant
        user of this tenant (`409 UNKNOWN_CASHIER` for an unknown, inactive or
        foreign id). The history is the audit trail
        (`register_session.handover`), not a table.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - toTenantUserId
              properties:
                toTenantUserId:
                  type: string
                  format: uuid
                note:
                  type: string
                  nullable: true
                  maxLength: 500
      responses:
        "200":
          description: The session, now owned by the new cashier (or the stored replay).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceRegisterSession"
        "400":
          description: "`VALIDATION_ERROR` or `IDEMPOTENCY_REQUIRED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`REGISTER_SESSION_NOT_OPEN`, `SAME_CASHIER`, `UNKNOWN_CASHIER`, `IDEMPOTENCY_CONFLICT` or `FEATURE_DISABLED` — the tenant's `register` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/register-sessions/{id}/close:
    post:
      operationId: closeCommerceRegisterSession
      tags:
        - Commerce
      summary: "Issue #284 (ADR-0028). Closes (cash-ups) a session by counting the drawer per tender. Gated on `commerce.register_cash_ups.create`; requires `Idempotency-Key`."
      description: >-
        The expected amount per tender is DERIVED (opening float + the session's
        stamped payment-ledger legs + drawer movements); the body carries only
        what was COUNTED. A count is required for `cash` and every tender with
        activity. The GROSS variance (the sum of the absolute per-tender
        differences) is compared with the tenant's `cashUp.approvalThreshold`
        (module setting; default `0.00`): within it the session is `closed`;
        above it, a caller who ALSO holds `commerce.register_cash_ups.approve`
        closes it in one step, and one who does not leaves it `closing`
        (`outcome: pending_approval`) until `.../close-decision`. A
        `varianceReason` is mandatory whenever any tender differs. Only the
        session's current cashier may close. The close is exclusive against every
        sale, movement and stamped payment leg of the session and idempotent: a
        replay returns the stored body, and two concurrent closes yield exactly
        one `closed`. Emits `awcms.commerce.register_session.closed` once, when
        the session actually reaches `closed`. Never rewrites a sale or a payment.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - counted
              properties:
                counted:
                  type: object
                  description: "Counted amount per tender type (`cash`, `manual_qris`, `manual_bank_transfer`, `gateway`, `gift_card`, `store_credit`) — `numeric(14,2)` strings, >= 0."
                  additionalProperties:
                    type: string
                varianceReason:
                  type: string
                  nullable: true
                  maxLength: 500
      responses:
        "200":
          description: The close outcome and the cash-up report (or the stored replay).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceRegisterCloseBody"
        "400":
          description: "`VALIDATION_ERROR` (a missing required count, a variance with no reason, a malformed amount) or `IDEMPOTENCY_REQUIRED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`REGISTER_SESSION_NOT_OPEN` (`details.status`), `NOT_SESSION_CASHIER`, `IDEMPOTENCY_CONFLICT` or `FEATURE_DISABLED` — the tenant's `register` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/register-sessions/{id}/close-decision:
    post:
      operationId: decideCommerceRegisterClose
      tags:
        - Commerce
      summary: "Issue #284 (ADR-0028). Approves or rejects a `closing` session's pending close request. Gated on `commerce.register_cash_ups.approve` (a high-risk verb); requires `Idempotency-Key`."
      description: >-
        `approve` closes the session (the cashier who counted stays the closer;
        the approver is on the request). `reject` (a `note` is required) returns
        the session to `open` for a recount and keeps the rejected request as
        history; the next close is attempt n+1. Only a `closing` session has
        anything to decide (`409 REGISTER_CLOSE_NOT_PENDING`).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum:
                    - approve
                    - reject
                note:
                  type: string
                  nullable: true
                  maxLength: 500
      responses:
        "200":
          description: "The outcome (`closed` after an approval, `reopened` after a rejection) and the report (or the stored replay)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceRegisterCloseBody"
        "400":
          description: "`VALIDATION_ERROR` or `IDEMPOTENCY_REQUIRED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`REGISTER_CLOSE_NOT_PENDING` (`details.status`), `SOD_MAKER_IS_CHECKER` (an approval by the user who requested the close, unless the tenant set `cashUp.allowSelfApproval`; rejecting your own count is allowed), `IDEMPOTENCY_CONFLICT` or `FEATURE_DISABLED` — the tenant's `register` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/register-sessions/{id}/corrections:
    post:
      operationId: correctCommerceRegisterSession
      tags:
        - Commerce
      summary: "Issue #284 (ADR-0028). Posts a compensating correction to a CLOSED session. Gated on `commerce.register_corrections.approve` (a high-risk verb); requires `Idempotency-Key`."
      description: >-
        A closed session is immutable: a correction adds signed per-tender
        `adjustment`s to the COUNTED amount (the original close request and
        lines are preserved untouched), moves the session `closed -> corrected`
        (further corrections keep it `corrected`) and returns the report with
        the corrected figures. A correction can never make a counted amount
        negative (`400`), and only a closed or corrected session can be
        corrected (`409 REGISTER_SESSION_NOT_CLOSED`). Emits
        `awcms.commerce.register_session.corrected` (never the free-text reason).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
                - adjustments
              properties:
                reason:
                  type: string
                  maxLength: 500
                adjustments:
                  type: array
                  minItems: 1
                  maxItems: 4
                  items:
                    type: object
                    required:
                      - tenderType
                      - adjustment
                    properties:
                      tenderType:
                        type: string
                        enum:
                          - cash
                          - manual_qris
                          - manual_bank_transfer
                          - gateway
                          - gift_card
                          - store_credit
                      adjustment:
                        type: string
                        description: "Signed, non-zero `numeric(14,2)` string (e.g. `-5000.00`)."
      responses:
        "201":
          description: The report with the correction applied (or the stored replay).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceRegisterCashUpReport"
        "400":
          description: "`VALIDATION_ERROR` (including a correction that would make a count negative) or `IDEMPOTENCY_REQUIRED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`REGISTER_SESSION_NOT_CLOSED` (`details.status`), `IDEMPOTENCY_CONFLICT` or `FEATURE_DISABLED` — the tenant's `register` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/register-sessions/{id}/report.csv:
    get:
      operationId: exportCommerceRegisterSessionCsv
      tags:
        - Commerce
      summary: "Issue #284 (ADR-0028). The session's cash-up as CSV: summary, per-tender expected/counted/difference, every movement and every correction. Gated on `commerce.register_sessions.export` (the platform's high-risk `export` verb)."
      description: >-
        One `section` column (`summary`, `tender`, `movement`, `correction`)
        keeps the whole cash-up unambiguous in a spreadsheet. EVERY cell is
        spreadsheet-formula-neutralised (a cell starting with `=`, `+`, `-`,
        `@`, a tab or a carriage return is prefixed with `'`; a strictly numeric
        amount keeps its sign). No customer name or phone appears. `Cache-Control:
        no-store`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The CSV.
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`FEATURE_DISABLED` — the tenant's `register` feature is off (it defaults OFF)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
