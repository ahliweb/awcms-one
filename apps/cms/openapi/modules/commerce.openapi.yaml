      tags:
        - Commerce
      summary: Anonymous, cross-origin cart quote (Issue 29, `commerce-storefront-endpoints.md`). Tenant resolved from the request Origin/Host — no bearer, no permission check. Read-only.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
