                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceStoredValueReport"
        "400":
          description: "`VALIDATION_ERROR`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`FEATURE_DISABLED` — the tenant's `storedValue` feature is off (it defaults OFF)."
