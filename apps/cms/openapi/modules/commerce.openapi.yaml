      summary: "Issue #294 (ADR-0031). Records a DRAFT expense. Gated on `commerce.expenses.create`; requires `Idempotency-Key`."
      description: >-
        A draft touches no register and no cash-up; posting is
        `/expenses/{id}/post`. A draft that names a `registerSessionId` must be
        paid in cash, name an OPEN session of this tenant, and additionally
        needs the `register` feature. Replaying the same key and body returns
