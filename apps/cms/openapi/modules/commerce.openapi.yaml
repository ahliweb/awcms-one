  /api/v1/commerce/storefront/account/loyalty:
    get:
      operationId: getCommerceStorefrontAccountLoyalty
      tags:
        - Commerce Accounts
      summary: "Issue #289 (ADR-0026). The signed-in customer's OWN points balance, the earn rule currently in force, and their point history (newest first, keyset-paginated). The customer id is read ONLY from the verified bearer session — there is no identifier a caller can change to read another customer's ledger."
      description: >-
        Each history item is `{ id, kind, points, balanceAfter, expiresAt,
        createdAt }` — never the staff actor, the free-text reason, the source
        order or the program id. A tenant that has not turned the `loyalty`
        feature on answers the neutral `404`, like every other disabled public
        case.
      security:
        - customerBearer: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 50
      responses:
        "200":
          description: Balance, earn rule and one page of history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      balance:
                        type: integer
                        format: int64
                      redemption:
                        nullable: true
                        description: "Issue #363 (ADR-0043). What a point is worth at checkout, or `null` when spending points is unavailable (the feature is off, or the tenant never set a value - one answer for both). For display only: the order route recomputes the discount."
                        type: object
                        properties:
                          rupiahPerPoint:
                            type: integer
                          maxGoodsPercent:
                            type: integer
                            nullable: true
                            description: The cap on the share of the goods subtotal payable in points; `null` for no cap.
                      program:
                        nullable: true
                        description: The rule in force right now; `null` when no version is active.
                        type: object
                        properties:
                          name:
                            type: string
                          earnUnitAmount:
                            type: string
                          earnPointsPerUnit:
                            type: integer
                          minOrderAmount:
                            type: string
                          maxPointsPerOrder:
                            type: integer
                            nullable: true
                          expiryDays:
                            type: integer
                            nullable: true
                      history:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/CustomerLoyaltyHistoryItem"
                          nextCursor:
                            type: string
                            nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: UNAUTHENTICATED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: ACCOUNT_BLOCKED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Loyalty is not enabled for this store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/storefront/products/{productId}/download:
    get:
      operationId: downloadCommerceStorefrontProductProtectedMedia
      tags:
        - Commerce Accounts
      summary: "Issue a short-lived presigned download URL for a purchased product's protected content (Issue #268, IRMbyDUS)."
      description: |
        Authentication (customer bearer session) → Authorization (the blocked-account gate every bearer-secured storefront route already applies) → Entitlement Verification (`verifyEntitlement` against the product's linked private media object) → short-lived presigned GET URL.

        The gated media object is resolved SERVER-SIDE from the product's own protected-media link (`PUT .../products/{id}/protected-media`) — `productId` is the only accepted input, never a media object id, so an entitled customer for one product cannot request another product's file by id.

        Missing entitlement → `403 ENTITLEMENT_REQUIRED`, with NO `url` field anywhere in the body — never a broken link, never a URL of any kind.
      security:
        - customerBearer: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A short-lived presigned GET URL for the product's protected media object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required:
                      - mediaObjectId
                      - url
                      - expiresAt
                    properties:
                      mediaObjectId:
                        type: string
                        format: uuid
                      url:
                        type: string
                        format: uri
                      expiresAt:
                        type: string
                        format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: UNAUTHENTICATED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: ACCOUNT_BLOCKED, or ENTITLEMENT_REQUIRED (no active entitlement for this product — the body never carries a url).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: This product has no protected content to download.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The product's protected-media link is misconfigured (points at a non-private or non-downloadable object).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Media storage is not configured for this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
