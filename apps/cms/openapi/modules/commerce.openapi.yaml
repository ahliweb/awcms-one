  /api/v1/commerce/loyalty/accounts/{customerId}/adjust:
    post:
      operationId: adjustCommerceLoyaltyPoints
      tags:
        - Commerce
      summary: "Issue #289. A manual signed points adjustment — its own permission (`commerce.loyalty_adjustments.create`), a MANDATORY `reason`, an audit event, and an `Idempotency-Key`. A negative adjustment cannot take the balance below zero (`409 WOULD_GO_NEGATIVE`); only a system reversal may."
      description: >-
        Same key + same body replays the stored 201; same key + different body
        is `409 IDEMPOTENCY_CONFLICT`. Adjustments never expire.
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - points
                - reason
              properties:
                points:
                  type: integer
                  description: Signed, non-zero, within ±1,000,000,000,000.
                reason:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Adjustment recorded (or replayed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      entry:
                        $ref: "#/components/schemas/LoyaltyLedgerEntry"
                      balance:
                        type: integer
                        format: int64
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: FEATURE_DISABLED, WOULD_GO_NEGATIVE, or IDEMPOTENCY_CONFLICT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/loyalty/accounts/{customerId}/ledger:
    get:
      operationId: listCommerceLoyaltyLedger
      tags:
        - Commerce
      summary: "Issue #289. The customer's append-only points history, newest first, keyset-paginated. Staff view: carries the actor and the reason that the customer-facing history omits. Gated on `commerce.loyalty.read`."
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 50
      responses:
        "200":
          description: One page of ledger entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/LoyaltyLedgerEntry"
                      nextCursor:
                        type: string
                        nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: FEATURE_DISABLED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/loyalty/accounts/{customerId}/redeem:
    post:
      operationId: redeemCommerceLoyaltyPoints
      tags:
        - Commerce
      summary: "Issue #289. Redeem a customer's points at the counter or on their behalf. Gated on `commerce.loyalty_redemptions.create`; `Idempotency-Key` required. Runs under the account row lock, so concurrent redemptions cannot overdraw (`409 INSUFFICIENT_POINTS`)."
      description: >-
        Records the points DEBIT only, with no order: it is the manual,
        out-of-band spend (for example a reward handed over outside a sale).
        Spending points AS A DISCOUNT on an order is done by the order itself -
        `loyaltyRedemption` on `POST /api/v1/commerce/storefront/orders` and
        on `POST /api/v1/commerce/pos/orders` (Issue #363, ADR-0043).
        Points past their `expiresAt` are expired first, under the same lock,
        so lapsed points can never be spent. Same key + same body replays the
        stored 201; same key + different body is `409 IDEMPOTENCY_CONFLICT`. A
        refused (insufficient) request is not recorded, so the same key can
        succeed after a top-up.
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - points
              properties:
                points:
                  type: integer
                  minimum: 1
                  description: A positive count of points to spend (the ledger row stores it negated).
                reason:
                  type: string
                  nullable: true
                  maxLength: 500
      responses:
        "201":
          description: Points redeemed (or replayed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      entry:
                        $ref: "#/components/schemas/LoyaltyLedgerEntry"
                      balance:
                        type: integer
                        format: int64
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: FEATURE_DISABLED, INSUFFICIENT_POINTS (details carry `balance` and `requested`), or IDEMPOTENCY_CONFLICT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/loyalty/programs:
    get:
      operationId: listCommerceLoyaltyPrograms
      tags:
        - Commerce
      summary: "Issue #289. Every loyalty program VERSION, newest first. Gated on `commerce.loyalty.read`."
      responses:
        "200":
          description: The tenant's program versions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/LoyaltyProgram"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: FEATURE_DISABLED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createCommerceLoyaltyProgram
      tags:
        - Commerce
      summary: "Issue #289. Create a new DRAFT program version (version number = max + 1 per tenant). Gated on `commerce.loyalty.manage`. Issue #361: the body may restrict the version to a CRM segment (`eligibilitySegmentId`), which additionally needs the `loyaltySegments` and `segments` features and `commerce.segments.read`; the segment version is pinned at save time and recorded on the program."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoyaltyProgramInput"
      responses:
        "201":
          description: Draft version created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/LoyaltyProgram"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: FEATURE_DISABLED (`loyalty`, or - when a segment is named - `loyaltySegments` or `segments`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "`SEGMENT_NOT_FOUND` (Issue #361) - the segment does not exist in this tenant, is retired, or has no such version."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/commerce/loyalty/programs/{id}:
    get:
      operationId: getCommerceLoyaltyProgram
      tags:
        - Commerce
      summary: "Issue #289. One program version. Gated on `commerce.loyalty.read`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The program version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/LoyaltyProgram"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: FEATURE_DISABLED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateCommerceLoyaltyProgram
      tags:
        - Commerce
      summary: "Issue #289. Edit a DRAFT program version. An active or retired version is immutable (a ledger row records the version it earned under) — `409 PROGRAM_NOT_EDITABLE`; a change of rules is a new version (the segment restriction of Issue #361 is part of the rules). Gated on `commerce.loyalty.manage`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any non-empty subset of the create fields.
              properties:
                name:
                  type: string
                earnUnitAmount:
                  type: string
                earnPointsPerUnit:
                  type: integer
                minOrderAmount:
                  type: string
                maxPointsPerOrder:
                  type: integer
                  nullable: true
                expiryDays:
                  type: integer
                  nullable: true
                notes:
                  type: string
                  nullable: true
                eligibilitySegmentId:
                  type: string
                  format: uuid
                  nullable: true
                  description: "Issue #361. Restrict to a segment, or `null` to clear the restriction. Same rules as on create (`LoyaltyProgramInput`)."
                eligibilitySegmentVersion:
                  type: integer
                  nullable: true
                  minimum: 1
      responses:
        "200":
          description: The updated draft.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/LoyaltyProgram"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: FEATURE_DISABLED (`loyalty`, or - when a segment is named - `loyaltySegments` or `segments`) or PROGRAM_NOT_EDITABLE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "`SEGMENT_NOT_FOUND` (Issue #361) - the segment does not exist in this tenant, is retired, or has no such version."
