  /api/v1/commerce/storefront/orders:
    post:
      operationId: createCommerceStorefrontOrder
      tags:
        - Commerce
      summary: "Anonymous order creation (Issue 29), with an optional customer bearer (Issue #91). Idempotent by the client-supplied idempotencyKey; re-quotes the cart inside the write transaction. No permission check required — a valid bearer is accepted, never required."
      description: >-
        Issue #91 (implemented, contract #86): an OPTIONAL
        `Authorization: Bearer <customer session token>` (see `customerBearer`)
        is accepted alongside the existing anonymous path. Present and valid
        → the order is attributed to that account's OWN customer row instead
        of the guest find-or-create by phone (the typed phone is still
        validated for shape, but ignored for identity); present and
        invalid/expired → `401 UNAUTHENTICATED` (explicit — the storefront
        re-reads its own session right before submit); absent entirely → the
        request proceeds exactly as it did before this issue. `affiliateCode`
        is likewise optional and shape-validated (a string, at most 50
        characters) but otherwise IGNORED in this issue — Issue #92 is what
        actually resolves it against `awcms_commerce_affiliates.code` and
        records a referral.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommerceCreateOrderRequest"
      responses:
        "201":
          description: Order created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CommerceOrder"
        "200":
          description: The idempotency key was seen before; the same order is returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
